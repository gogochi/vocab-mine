    el('h2', {}, PAPER.title || '類似題練習'),
    PAPER.intro ? el('p', {}, PAPER.intro) : null,
    el('p', {}, '每一段分開做，考前可以「全部一次做」。先點答案，再按「確定」；答錯會馬上看到正確答案和解析。標「原本錯過」的題目，是原卷錯過的觀念，要特別注意。中途離開也沒關係，下次會從同一題接著做。'));
}

function storageWarning() {
  return el('section', { class: 'card warn', role: 'alert' },
    el('b', {}, '這個瀏覽器不能存檔'), '：可能是無痕模式。練習可以做，但關掉後不會記得做到哪裡。');
}

function homeView() {
  return el('main', { class: 'screen home' },
    homeTop(),
    Storage.isOk() ? null : storageWarning(),
    whatsNewCard(),
    introCard(),
    statsRow(),
    simSections(),
    el('nav', { class: 'menu bio-menu', 'aria-label': '其他' },
      el('button', { class: 'menu-btn', onclick: () => go('parent') }, sprite('blk-diamond'), el('b', {}, '家長'), el('span', {}, '紀錄、音效、版本'))),
    el('footer', { class: 'foot' },
      el('p', {}, '每答一題都會自動存檔，進度存在這台裝置裡。'),
      el('p', { class: 'version' }, versionLabel())));
}

// ---------- parent page ----------
function setSettings(patch) {
  commit((s) => Object.assign({}, s, { settings: Core.mergeSettings(Object.assign({}, s.settings, patch)) }));
}

function field(label, control, hint) {
  return el('label', { class: 'field' }, el('span', { class: 'field-label' }, label), control, hint ? el('span', { class: 'field-hint' }, hint) : null);
}

function logCard() {
  const days = Object.keys(store.log).sort().reverse().slice(0, 14);
  return el('section', { class: 'card' }, el('h2', {}, '每天練習'),
    days.length
      ? el('ul', { class: 'boss-history' }, days.map((d) => {
        const e = store.log[d];
        return el('li', {}, `${fmtDateW(d)}　${e.q} 題，答對 ${e.ok} 題（${e.q ? Math.round((e.ok / e.q) * 100) : 0}%），約 ${minutes(e.ms)} 分鐘`);
      }))
      : el('p', { class: 'muted' }, '還沒有練習紀錄。'));
}

function settingsCard() {
  const pct = (v) => `${Math.round(v * 100)}%`;
  const label = el('span', {}, pct(store.settings.volume));
  return el('section', { class: 'card settings' }, el('h2', {}, '設定'),
    field('生物段考日期', el('input', { type: 'date', value: store.settings.examDate,
      onchange: (e) => { if (/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) { setSettings({ examDate: e.target.value }); render(); } } })),
    field('答題音效', el('select', { onchange: (e) => { setSettings({ sound: e.target.value === 'on' }); applyAudioSettings(); } },
      el('option', { value: 'on', selected: store.settings.sound }, '開'),
      el('option', { value: 'off', selected: !store.settings.sound }, '關'))),
    el('div', { class: 'voice' },
      field('音量', el('div', { class: 'rate' },
        el('input', { type: 'range', min: '0.1', max: '1', step: '0.05', value: String(store.settings.volume), 'aria-label': '音量',
          oninput: (e) => { label.textContent = pct(Number(e.target.value)); },
          onchange: (e) => { setSettings({ volume: Number(e.target.value) }); applyAudioSettings(); } }),
        label)),
      el('button', { type: 'button', class: 'btn btn-dark btn-sm', onclick: () => Sfx.mine(1) }, '🔊 試聽音效')));
}

function resetCard() {
  const reset = () => {
    if (!resetArmed) {
      resetArmed = true;
      render();
      setTimeout(() => { if (resetArmed) { resetArmed = false; render(); } }, RESET_ARM_MS);
      return;
    }
    resetArmed = false;
    commit((s) => Object.assign({}, s, { log: {}, sim: [] }));
    [...PAPER.parts.map((part) => part.id), ''].forEach((id) => {
      try { localStorage.removeItem(runKeyOf(PAPER, id)); } catch (e) { /* nothing saved */ }
    });
    showToast(el('span', {}, '紀錄已清除'), 'info');
    render();
  };
  return el('section', { class: 'card' }, el('h2', {}, '重新開始'),
    el('p', {}, '清除所有作答紀錄和做到一半的進度（設定會保留）。'),
    el('button', { class: resetArmed ? 'btn btn-gold btn-sm' : 'btn btn-ghost btn-sm', onclick: reset }, resetArmed ? '再按一次確定清除' : '清除紀錄'));
}

function parentView() {
  return el('main', { class: 'screen parent' }, backBar('家長'),
    simParentCard(), logCard(), settingsCard(), resetCard(), versionCard());
}

// ---- main.js ----
/* Boot, routing, rendering, and keeping tabs and days in sync. */
const VIEWS = { home: homeView, 'exam-q': examQuestionView, 'exam-done': examResultView, parent: parentView };
// Mid-question screens: no update banner, and no re-render from other tabs.
const PRACTICE_ROUTES = ['exam-q'];

let store = null;
let route = 'home';
let lastRenderAt = 0;
let renderedDay = Core.todayISO();

/** change(store) returns the next store. Re-reads first when another tab saved in the meantime. */
function commit(change) {
  const saved = Storage.savedRev();
  if (saved !== null && saved !== store.rev) store = Storage.load();
  store = Object.assign({}, change(store), { rev: store.rev + 1 });
  Storage.save(store);
}

function render() {
  const root = document.getElementById('app');
  setChildren(root, inPractice() ? null : updateBanner(), (VIEWS[route] || homeView)());
  lastRenderAt = performance.now();
  renderedDay = Core.todayISO();
  const target = root.querySelector('[data-autofocus]');
  if (target && route !== 'home') target.focus();
}

function inPractice() {
  return PRACTICE_ROUTES.includes(route);
}

function go(name) {
  route = name;
  render();
  window.scrollTo(0, 0);
}

/** Another tab saved, or a new day started while this tab stayed open: show the latest. */
function syncFromStorage() {
  const saved = Storage.savedRev();
  const changed = saved !== null && saved !== store.rev;
  if (changed) store = Storage.load();
  const newDay = renderedDay !== Core.todayISO();
  if ((changed || newDay) && !inPractice()) render();
}

function applyAudioSettings() {
  Sfx.setEnabled(store.settings.sound);
  Sfx.setVolume(store.settings.volume);
}

/** Asks the browser not to evict saved progress when space runs low (silently granted or not). */
function requestPersistentStorage() {
  try {
    if (window.location.protocol === 'https:' && navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => { /* keep best-effort storage */ });
    }
  } catch (e) { /* unsupported */ }
}

function startApp(data) {
  setPaper(data.sim);
  store = Storage.load();
  initWhatsNew(store.sim.length > 0 || Object.keys(store.log).length > 0);
  applyAudioSettings();
  preferPlaybackAudio();
  requestPersistentStorage();
  window.addEventListener('storage', (e) => { if (e.key === STORAGE_KEY) syncFromStorage(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    syncFromStorage();
    checkForUpdate();
  });
  window.addEventListener('focus', syncFromStorage);
  if (/[?&]e2e\b/.test(window.location.search)) {
    window.__bioMine = {
      store: () => store,
      sync: syncFromStorage,
      checkUpdate: () => checkForUpdate(true),
      exam: () => (examRun && !ExamCore.isFinished(examRun) ? { no: ExamCore.currentNo(examRun), answer: examQuestionNow().answer } : null),
    };
  }
  render();
  checkForUpdate();
}

function boot() {
  installSprites();
  AudioOut.startOnFirstTouch();
  if (window.APP_LOCKED) unlock(window.APP_LOCKED).then(startApp);
  else startApp({ sim: window.APP_DATA });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
