// ---- handwrite.js ----
/* One-character handwriting pad (田字格) and the online recognizer (Google handwriting input, zh_TW).
 * Strokes are kept as [[x...], [y...], [t...]] in CSS pixels: the "ink" format the recognizer expects. */
const RECOGNIZE_URL = 'https://inputtools.google.com/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8';
const RECOGNIZE_TIMEOUT_MS = 6000;
const PAD_MAX = 420;
const PAD_MIN = 220;
const KAI_STACK = '"BiauKai","DFKai-SB","標楷體","TW-Kai","Kaiti TC","STKaiti","KaiTi",serif';

/** Resolves with up to 10 candidate characters, best first; rejects when offline or on timeout. */
function recognizeInk(strokes, size) {
  const body = {
    options: 'enable_pre_space',
    requests: [{ writing_guide: { writing_area_width: size, writing_area_height: size }, ink: strokes, language: 'zh_TW' }],
  };
  const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = setTimeout(() => { if (ctrl) ctrl.abort(); }, RECOGNIZE_TIMEOUT_MS);
  return fetch(RECOGNIZE_URL, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    signal: ctrl ? ctrl.signal : undefined,
  })
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))
    .then((data) => {
      const list = Array.isArray(data) && data[0] === 'SUCCESS' && data[1] && data[1][0] && data[1][0][1];
      if (!Array.isArray(list)) throw new Error('unexpected reply');
      return list.filter((s) => typeof s === 'string').slice(0, 10);
    })
    .finally(() => clearTimeout(timer));
}

const padSize = () => Math.max(PAD_MIN, Math.min(PAD_MAX, window.innerWidth - 72));

/** opts.guide: a character shown faintly behind the grid (tracing after a mistake). */
function makePad(opts) {
  const options = opts || {};
  const size = padSize();
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const canvas = el('canvas', {
    class: 'pad-canvas', width: Math.round(size * dpr), height: Math.round(size * dpr),
    style: `width:${size}px;height:${size}px`, role: 'img', 'aria-label': options.label || '手寫區',
  });
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#1d1712';
  ctx.lineWidth = Math.max(6, size / 26);
  let strokes = [];
  let t0 = 0;
  const listeners = new Set();
  // Which pointer is writing: a pen beats a touch, a moving finger or stylus beats a resting palm (src/ink.js).
  const tracker = Ink.createInkTracker();

  const point = (e) => {
    const r = canvas.getBoundingClientRect();
    return {
      id: e.pointerId, type: e.pointerType, width: e.width || 0, t: Math.round(performance.now() - t0),
      x: Math.round(((e.clientX - r.left) / r.width) * size), y: Math.round(((e.clientY - r.top) / r.height) * size),
    };
  };

  function drawStroke(s) {
    const [xs, ys] = s;
    ctx.beginPath();
    ctx.moveTo(xs[0], ys[0]);
    if (xs.length === 1) ctx.lineTo(xs[0] + 0.1, ys[0] + 0.1); // a dot
    for (let i = 1; i < xs.length; i += 1) ctx.lineTo(xs[i], ys[i]);
    ctx.stroke();
  }

  function redraw() {
    ctx.clearRect(0, 0, size, size);
    strokes.forEach(drawStroke);
    const current = tracker.current();
    if (current) drawStroke(current);
  }

  const changed = () => listeners.forEach((fn) => fn(strokes.length));

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (!strokes.length && tracker.writer() === null) t0 = performance.now();
    if (tracker.down(point(e)) === 'ignore') return;
    // Capture every pointer we follow, so a palm sliding off the pad still reports its lift.
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not capturable: still works */ }
    redraw();
  });
  canvas.addEventListener('pointermove', (e) => {
    e.preventDefault();
    const events = typeof e.getCoalescedEvents === 'function' && e.getCoalescedEvents().length ? e.getCoalescedEvents() : [e];
    const drew = events.map((ev) => tracker.move(point(ev))).some((r) => r !== 'ignore');
    if (drew) redraw();
  });
  canvas.addEventListener('pointerup', (e) => {
    const stroke = tracker.up(point(e));
    if (!stroke) return;
    strokes = [...strokes, stroke];
    redraw();
    changed();
  });
  canvas.addEventListener('pointercancel', (e) => {
    if (tracker.cancel(point(e))) redraw(); // the browser took the pointer away (a rejected palm): drop the stroke
  });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  const guide = options.guide
    ? el('span', { class: 'pad-guide', 'aria-hidden': 'true', style: `font-family:${KAI_STACK};font-size:${Math.round(size * 0.82)}px` }, options.guide)
    : null;
  const node = el('div', { class: 'pad', style: `width:${size}px;height:${size}px` }, guide, canvas);

  return {
    node,
    size,
    strokes: () => strokes.map((s) => s.map((a) => a.slice())),
    isEmpty: () => strokes.length === 0,
    undo() { strokes = strokes.slice(0, -1); redraw(); changed(); },
    clear() { strokes = []; redraw(); changed(); },
    snapshot: () => canvas.toDataURL('image/png'),
    onChange(fn) { listeners.add(fn); },
    nudge() {
      node.classList.remove('nope');
      void node.offsetWidth;
      node.classList.add('nope');
    },
  };
}

function padTools(pad) {
  return el('div', { class: 'pad-tools' },
    el('button', { type: 'button', class: 'btn btn-ghost btn-sm', onclick: () => pad.undo() }, '↶ 上一筆'),
    el('button', { type: 'button', class: 'btn btn-ghost btn-sm', onclick: () => pad.clear() }, '全部擦掉'));
}

// ---- zhuyin.js ----
/* On-screen 注音 keypad: rows for 聲母／介音／韻母／聲調. Each tap fills its own slot, so the order
 * of tapping does not matter; tapping the same symbol again takes it out. */
const ZY_ROWS = [
  { label: '聲母', keys: [...Core.INITIALS] },
  { label: '介音', keys: [...Core.MEDIALS] },
  { label: '韻母', keys: [...Core.FINALS] },
  { label: '聲調', keys: ['', 'ˊ', 'ˇ', 'ˋ', '˙'] },
];
const TONE_TEXT = { '': '一聲', 'ˊ': 'ˊ', 'ˇ': 'ˇ', 'ˋ': 'ˋ', '˙': '˙' };
const TONE_NAME = { '': '一聲', 'ˊ': '二聲', 'ˇ': '三聲', 'ˋ': '四聲', '˙': '輕聲' };

const slotOf = (key) => Core.slotOfKey(key) || 'tone';

/** onEnter: called when the keypad's 確定 is pressed. */
function makeZhuyinPad(onEnter, opts) {
  const options = opts || {};
  let slots = Core.emptySlots();
  let toneChosen = false;
  const display = el('div', { class: 'zy-display', 'aria-live': 'polite' });
  const keys = [];

  function refresh() {
    const text = Core.formatZhuyin(slots);
    setChildren(display, text
      ? el('span', { class: 'zy-text' }, text)
      : el('span', { class: 'zy-placeholder' }, options.placeholder || '點下面的注音'));
    keys.forEach(({ key, btn }) => {
      const slot = slotOf(key);
      const on = slot === 'tone' ? toneChosen && slots.tone === key : slots[slot] === key;
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  function tap(key) {
    if (slotOf(key) === 'tone') {
      const off = toneChosen && slots.tone === key;
      slots = Object.assign({}, slots, { tone: off ? '' : key });
      toneChosen = !off;
    } else {
      slots = Core.tapZhuyin(slots, key);
    }
    refresh();
  }

  const rows = ZY_ROWS.map((row) => el('div', { class: `zy-row zy-${row.label}` },
    el('span', { class: 'zy-label' }, row.label),
    el('div', { class: 'zy-keys' }, row.keys.map((key) => {
      const label = row.label === '聲調' ? TONE_TEXT[key] : key;
      const btn = el('button', {
        type: 'button', class: row.label === '聲調' ? 'zy-key zy-tone' : 'zy-key',
        'aria-label': row.label === '聲調' ? TONE_NAME[key] : key, onclick: () => tap(key),
      }, label);
      keys.push({ key, btn });
      return btn;
    }))));

  const node = el('div', { class: 'zy-pad' },
    el('div', { class: 'zy-top' }, display,
      el('button', { type: 'button', class: 'btn btn-ghost btn-sm', onclick: () => { slots = Core.emptySlots(); toneChosen = false; refresh(); } }, '清除'),
      onEnter ? el('button', { type: 'button', class: 'btn btn-primary btn-sm zy-enter', onclick: () => onEnter(Core.formatZhuyin(slots)) }, options.enterText || '確定') : null),
    rows);
  refresh();

  return {
    node,
    value: () => Core.formatZhuyin(slots),
    nudge() {
      display.classList.remove('nope');
      void display.offsetWidth;
      display.classList.add('nope');
    },
  };
}

// ---- session.js ----
/* Practice sessions: queue building, moving through steps, answering, and the session bars. */
const BOSS_SIZE = 30;
const EXTRA_NEW = 10;
const ERROR_SESSION_MAX = 30;
const ACTIVE_CAP_MS = 90 * 1000;
const MODE_LABELS = {
  mission: '今日任務', extra: '多學新題', errors: '錯題本', practice: '自由練習', boss: '魔王關', redo: '重練答錯的題目',
};
const PRACTICE_UNITS = { mix: ['char', 'zhuyin'], write: ['char'], zhuyin: ['zhuyin'] };
const COMBO_STEP = 5;      // fanfare every 5 answers in a row
const COMBO_BADGE_MIN = 3; // show the 🔥 counter from 3 in a row

let session = null;
const updateSession = (patch) => { session = Object.assign({}, session, patch); };
const stateOf = (id) => Core.getState(store.states, id);
const emptyLog = () => ({ q: 0, ok: 0, ms: 0, fresh: 0, mined: 0 });
const todayLog = () => store.log[Core.todayISO()] || emptyLog();

// ---------- building a session ----------
function queueFor(mode, opts) {
  if (mode === 'mission') {
    const m = Core.buildMission(ITEMS, store.states, Core.todayISO(), store.settings, todayLog().fresh);
    return Core.buildQueue(m.reviews, m.fresh);
  }
  if (mode === 'extra') return Core.buildQueue([], ITEMS.filter((it) => !stateOf(it.id).seen).slice(0, EXTRA_NEW));
  if (mode === 'errors') return Core.buildQueue(Core.errorBook(ITEMS, store.states).slice(0, ERROR_SESSION_MAX), []);
  if (mode === 'redo') return Core.buildQueue(opts.ids.map((id) => ITEM_BY_ID.get(id)).filter(Boolean), []);
  if (mode === 'practice') {
    const sel = Core.selectPractice(ITEMS, store.states, PRACTICE_UNITS[opts.type] || PRACTICE_UNITS.mix, opts.count);
    return Core.buildQueue(sel.review, sel.fresh);
  }
  if (mode === 'boss') {
    return Core.selectBoss(ITEMS, store.states, BOSS_SIZE).map((it) => ({ kind: 'quiz', id: it.id, qtype: Core.typeOf(it) }));
  }
  return [];
}

function questionAt(pos) {
  const step = session.queue[pos];
  if (!step || step.kind !== 'quiz') return null;
  return Core.makeQuestion(ITEM_BY_ID.get(step.id));
}

function startSession(mode, opts) {
  const queue = queueFor(mode, opts || {});
  if (!queue.length) {
    showToast(el('span', {}, '目前沒有要練的題目'), 'info');
    return;
  }
  session = {
    mode, queue, pos: 0, q: null, fb: null, check: null, done: false, retries: {}, results: {}, view: null,
    answered: 0, correct: 0, ups: [0, 0, 0, 0], wrongIds: [], lastActive: Date.now(), combo: 0, bestCombo: 0,
  };
  updateSession({ q: questionAt(0) });
  saveSessionSnapshot();
  go('session');
}

function leaveSession() {
  session = null;
  go('home');
}

// ---------- moving through the queue ----------
function advance() {
  if (!session || session.done) return;
  const pos = session.pos + 1;
  if (pos >= session.queue.length) {
    finishSession();
    return;
  }
  updateSession({ pos, fb: null, q: null, check: null, view: null });
  updateSession({ q: questionAt(pos) });
  saveSessionSnapshot();
  render();
}

function finishSession() {
  if (session.mode === 'boss') {
    const record = { date: Core.todayISO(), score: session.correct, total: session.answered };
    commit((s) => Object.assign({}, s, { boss: [...s.boss, record].slice(-50) }));
  }
  updateSession({ done: true });
  saveSessionSnapshot();
  const won = session.answered > 0 && session.correct / session.answered >= 0.8;
  if (session.mode === 'boss') (won ? Sfx.bossWin : Sfx.bossLose)();
  else Sfx.complete();
  go('result');
}

// ---------- answering ----------
function recordAnswer(id, before, after, correct) {
  const today = Core.todayISO();
  const now = Date.now();
  const delta = {
    q: 1, ok: correct ? 1 : 0, ms: Math.min(now - session.lastActive, ACTIVE_CAP_MS),
    fresh: before.seen ? 0 : 1, mined: correct ? 1 : 0,
  };
  commit((s) => Object.assign({}, s, {
    states: Object.assign({}, s.states, { [id]: after }),
    log: Core.addToLog(s.log, today, delta),
  }));
  updateSession({ lastActive: now });
}

/** values: null = 「不會，看答案」; text for 寫注音; {verdict, given, self} for 寫國字. */
function submitAnswer(values) {
  if (!session || session.fb || !session.q) return;
  const q = session.q;
  const step = session.queue[session.pos];
  const gaveUp = values === null;
  const res = gaveUp ? { correct: false } : Core.checkQuestion(q, values);
  const before = stateOf(q.id);
  const graded = Core.grade(before, res.correct, Core.todayISO());
  const patchState = {};
  // A re-ask right after seeing the answer is too easy to count as "fixed": it stays in the error book.
  if (step.retry && res.correct) patchState.run = 0;
  // Self-checked answers are counted, so the parent page can list them for a second look.
  if (res.correct && values && values.self) patchState.self = before.self + 1;
  const after = Object.assign({}, graded, patchState);
  recordAnswer(q.id, before, after, res.correct);
  updateSession({ results: Object.assign({}, session.results, { [session.pos]: resultRecord(q, res.correct, gaveUp, values) }) });
  const ups = session.ups.map((n, lv) => (after.lv > before.lv && lv === after.lv ? n + 1 : n));
  const combo = res.correct ? session.combo + 1 : 0;
  updateSession({
    answered: session.answered + 1, correct: session.correct + (res.correct ? 1 : 0), ups,
    combo, bestCombo: Math.max(session.bestCombo, combo), check: null,
  });
  if (res.correct) {
    celebrate(q, before, after);
    advance();
    return;
  }
  handleMistake(q, step, givenText(q, values), gaveUp, before);
}

const givenText = (q, values) => {
  if (!values) return '';
  return q.type === 'write' ? String(values.given || '') : String(values);
};

function handleMistake(q, step, given, gaveUp, before) {
  Sfx.wrong();
  const wrongIds = session.wrongIds.includes(q.id) ? session.wrongIds : [...session.wrongIds, q.id];
  updateSession({ wrongIds, fb: { given, gaveUp, lostLevel: before.seen ? before.lv : 0 } });
  if (session.mode !== 'boss') {
    const count = (session.retries[q.id] || 0) + 1;
    updateSession({
      retries: Object.assign({}, session.retries, { [q.id]: count }),
      queue: Core.insertRetry(session.queue, session.pos, step, count),
    });
  }
  saveSessionSnapshot();
  render();
}

function celebrate(q, before, after) {
  const up = after.lv > before.lv;
  const combo = session.combo;
  const milestone = combo >= COMBO_STEP && combo % COMBO_STEP === 0;
  if (session.mode === 'boss') Sfx.bossHit();
  if (up) Sfx.ore(after.lv, false);
  else Sfx.mine(combo);
  if (milestone) setTimeout(() => Sfx.combo(combo), 280);
  const diamond = up && after.lv === Core.MAX_LEVEL;
  let msg = '答對了！';
  if (diamond) msg = '鑽石到手！';
  else if (up) msg = `升級成${Core.LEVEL_NAMES[after.lv]}`;
  const cls = ['toast-body', diamond ? 'is-diamond' : '', milestone ? 'is-combo' : ''].filter(Boolean).join(' ');
  showToast(el('div', { class: cls },
    oreSprite(after, 'toast-ore'),
    el('div', { class: 'toast-text' }, el('b', { class: 'kai' }, Core.displayAnswer(q)), el('span', {}, msg),
      milestone ? el('span', { class: 'toast-combo' }, `🔥 連續答對 ${combo} 題！`) : null)), 'good');
}

// ---------- views ----------
function sessionView() {
  if (!session || session.done) return homeView();
  const step = session.queue[session.pos];
  const it = ITEM_BY_ID.get(step.id);
  let body;
  if (isReviewing()) body = reviewCard();
  else if (step.kind === 'learn') body = learnCard(it);
  else if (session.fb) body = feedbackCard(it);
  else body = quizCard();
  return el('main', { class: `screen session mode-${session.mode}` },
    sessionBar(), session.mode === 'boss' ? bossBar() : null, body);

function sessionBar() {

    el('button', { class: 'icon-btn', 'aria-label': '先休息，回礦坑（進度已存）', title: '先休息', onclick: leaveSession }, '✕'),
    el('span', { class: 'session-title' }, MODE_LABELS[session.mode]),
    el('div', { class: 'progress', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': total, 'aria-valuenow': session.pos },
      el('span', { style: `width:${pct}%` })),

      ? el('span', { class: 'combo-badge', title: '連續答對', 'aria-label': `連續答對 ${session.combo} 題` }, '🔥', el('b', {}, session.combo))
      : null,
    el('span', { class: 'count' }, isReviewing()
      ? `回顧 ${session.view + 1} / ${total}`
      : `${Math.min(session.pos + 1, total)} / ${total}`));
}

function bossBar() {
  const total = session.queue.length;
  const hp = total - session.correct;

// ---- session-nav.js ----
/* Today's mission and 「多學新題」 survive closing the app (saved after every step),
 * and a session can step back to look at earlier cards, or skip a question for later. */
const SESSION_KEY = `${STORAGE_KEY}:session`;
const SAVED_MODES = Core.RESUMABLE_MODES;
const RESUME_TEXT = {
  mission: { title: '今日任務做到一半', go: '繼續挖礦', other: '重新排今天的任務' },
  extra: { title: '多學新題做到一半', go: '繼續學新題', other: '這一輪先不做' },
};

function saveSessionSnapshot() {
  if (!session || !SAVED_MODES.includes(session.mode)) return;
  if (session.done) {
    clearSavedSession();
    return;
  }
  const snap = {
    v: 1, day: Core.todayISO(), mode: session.mode, queue: session.queue, pos: session.pos, q: session.q, fb: session.fb,
    results: session.results, retries: session.retries, ups: session.ups, answered: session.answered,
    correct: session.correct, wrongIds: session.wrongIds, combo: session.combo, bestCombo: session.bestCombo,
  };
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify(snap));
  } catch (e) { /* each answer is still saved per word; only the place in the queue is lost */ }
}

function clearSavedSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* nothing saved */ }
}

function loadSavedSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? Core.sanitizeSavedSession(JSON.parse(raw), VALID_IDS, Core.todayISO()) : null;
  } catch (e) {
    return null;
  }
}

function resumeSession() {
  const saved = loadSavedSession();
  if (!saved) {
    startSession('mission');
    return;
  }
  session = Object.assign({ done: false, view: null, check: null, lastActive: Date.now() }, saved);
  if (!session.q && session.queue[session.pos].kind === 'quiz') updateSession({ q: questionAt(session.pos) });
  go('session');
}

function restartMission() {
  clearSavedSession();
  startSession('mission');
}

/** Leaves a half-done 「多學新題」 round; home offers a fresh round again. */
function dropSavedRound() {
  clearSavedSession();
  render();
}

// ---------- stepping back and forth ----------
const isReviewing = () => Boolean(session) && session.view !== null && session.view !== undefined;

function stepBack() {
  if (!session || session.fb) return;
  const from = isReviewing() ? session.view : session.pos;
  if (from <= 0) return;
  updateSession({ view: from - 1 });
  render();
}

function stepForward() {
  if (!isReviewing()) return;
  const next = session.view + 1;
  updateSession({ view: next >= session.pos ? null : next });
  render();
}

function skipQuestion() {
  if (!session || session.fb || isReviewing() || !Core.canSkipStep(session.queue, session.pos)) return;
  updateSession({ queue: Core.skipStep(session.queue, session.pos), check: null });
  updateSession({ q: questionAt(session.pos) });
  saveSessionSnapshot();
  render();
}

/** What the review screen shows for a question that was already answered. */
function resultRecord(q, correct, gaveUp, values) {
  return { correct, gaveUp, self: Boolean(values && values.self), type: q.type, answer: q.answer, given: givenText(q, values) };
}

function backButton() {
  const from = isReviewing() ? session.view : session.pos;
  if (from <= 0 || session.fb) return null;
  return el('button', { type: 'button', class: 'btn btn-ghost btn-nav', onclick: keyGuard(stepBack) }, '← 上一步');
}

function skipButton() {
  if (!Core.canSkipStep(session.queue, session.pos)) return null;
  return el('button', { type: 'button', class: 'btn btn-ghost', title: '這題放到最後再做', onclick: skipQuestion }, '先跳過');
}

function reviewNav(index) {
  const backToNow = index + 1 >= session.pos;
  return el('div', { class: 'review-nav' },
    backButton(),
    el('button', { type: 'button', class: 'btn btn-primary', 'data-autofocus': '', onclick: keyGuard(stepForward) },
      backToNow ? '回到現在這題 →' : '下一步 →'));
}

function reviewBadge(r) {
  if (r.correct) return el('p', { class: 'review-badge good' }, r.self ? '✓ 這題答對了（自己比對）' : '✓ 這題答對了');
  return el('p', { class: 'review-badge bad' }, r.gaveUp ? '這題按了「不會」' : '✗ 這題答錯了');
}

function reviewCard() {
  const index = session.view;
  const step = session.queue[index];
  const it = ITEM_BY_ID.get(step.id);
  if (step.kind === 'learn') return learnCard(it, reviewNav(index));
  const r = session.results[index];
  return el('section', { class: 'card review-card' },
    el('span', { class: 'chip chip-review' }, `回顧第 ${index + 1} 步`),
    r ? reviewBadge(r) : null,
    phraseView(it, 'show', true),
    r ? el('p', { class: 'review-answer' }, '正確答案：', el('b', { class: 'kai' }, r.answer)) : null,
    r && !r.correct && r.given ? el('p', { class: 'fb-yours' }, r.type === 'write' ? '電腦看成：' : '你選的：', el('s', {}, r.given)) : null,
    reviewNav(index));
}

// ---------- home: pick up today's mission or a 「多學新字」 round ----------
function resumeMissionCard(saved) {
  const text = RESUME_TEXT[saved.mode] || RESUME_TEXT.mission;
  const total = saved.queue.length;
  const pct = Math.round((saved.pos / total) * 100);
  return el('section', { class: 'card mission resume' },
    el('div', { class: 'mission-ores', 'aria-hidden': 'true' }, sprite('blk-iron'), sprite('blk-gold'), sprite('blk-diamond')),
    el('div', { class: 'mission-text' },
      el('h2', {}, text.title),
      el('p', { class: 'mission-meta' }, `已完成 ${saved.pos} / ${total} 步，還剩 ${total - saved.pos} 步`),
      el('div', { class: 'progress mission-progress', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': total, 'aria-valuenow': saved.pos },
        el('span', { style: `width:${pct}%` }))),
    el('div', { class: 'mission-cta' },
      el('button', { class: 'btn btn-primary btn-big', 'data-autofocus': '', onclick: resumeSession }, text.go),
      el('button', { class: 'btn btn-ghost btn-sm', onclick: saved.mode === 'extra' ? dropSavedRound : restartMission }, text.other)));
}

// ---- quiz.js ----
/* Cards: new question, 寫國字 (pad + recognizer, then self-check if needed), 寫注音 (keypad),
 * the wrong-answer card (trace / re-enter the answer once) and the result screen. */
const SELF_CHECK_TITLES = {
  close: '電腦看不太清楚，請自己對對看',
  miss: '電腦看成別的字，請自己對對看',
  offline: '沒連上手寫辨識，請自己對對看',
  off: '請自己對對看',
};

/** mode: 'write' (注音 over an empty box), 'zhuyin' (character to read), 'show' (character with its 注音). */
function phraseView(it, mode, big) {
  const chars = [...Core.phraseOf(it)];
  const proper = Core.properMask(it);
  const at = [...it.before].length;
  const cell = (ch, i) => {
    if (i !== at) return el('span', { class: proper[i] ? 'ph-ch proper' : 'ph-ch' }, ch);
    if (mode === 'write') {
      return el('span', { class: 'ph-target ph-ask' }, el('span', { class: 'ph-zy' }, it.zhuyin), el('span', { class: 'ph-box', 'aria-label': '要寫的國字' }, '　'));
    }
    const zy = mode === 'zhuyin' ? el('span', { class: 'ph-zy ph-zy-empty' }, '？') : el('span', { class: 'ph-zy' }, it.zhuyin);
    return el('span', { class: proper[i] ? 'ph-target proper' : 'ph-target' }, zy, el('span', { class: 'ph-char' }, ch));
  };
  return el('p', { class: big ? 'phrase kai phrase-big' : 'phrase kai', lang: 'zh-Hant' }, chars.map(cell));
}

const typeHint = (it) => (it.type === 'char' ? '考法：看注音，寫出國字' : '考法：看國字，寫出注音');

function modelChar(ch) {
  return el('div', { class: 'model-char kai', 'aria-label': `正確的字：${ch}` }, ch);
}

/** reviewFooter: the back/forward buttons when looking at a card from earlier in the session. */
function learnCard(it, reviewFooter) {
  const footer = reviewFooter || el('div', { class: 'learn-nav' },
    backButton(),
    el('button', { class: 'btn btn-primary', 'data-autofocus': '', onclick: keyGuard(advance) }, '記住了，下一個 →'));
  return el('section', { class: 'card learn-card' },
    el('span', { class: reviewFooter ? 'chip chip-review' : 'chip chip-new' }, reviewFooter ? '回顧：新題' : `新題 · 第 ${it.no} 題`),
    phraseView(it, 'show', true),
    el('p', { class: 'q-hint' }, typeHint(it)),
    el('div', { class: 'learn-model' }, modelChar(it.char), el('span', { class: 'learn-zy' }, it.zhuyin)),
    it.note ? el('p', { class: 'note muted' }, it.note) : null,
    footer);
}

// ---------- 寫國字 ----------
function writeCard(q, it) {
  const pad = makePad({ label: '在這裡寫國字' });
  const status = el('p', { class: 'pad-status', 'aria-live': 'polite' });
  const submit = el('button', { type: 'button', class: 'btn btn-primary' }, '寫好了');
  const giveUp = el('button', { type: 'button', class: 'btn btn-ghost', onclick: () => submitAnswer(null) }, '不會，看答案');
  submit.addEventListener('click', () => checkWriting(pad, q, status, [submit, giveUp]));
  return el('section', { class: 'card quiz-card write-card' },
    el('span', { class: 'chip chip-write' }, '寫國字'),
    el('p', { class: 'q-hint' }, '看注音，把空格裡的國字寫在格子裡'),
    phraseView(it, 'write', true),
    el('div', { class: 'pad-wrap' }, pad.node),
    padTools(pad),
    status,
    el('div', { class: 'quiz-actions' }, backButton(), skipButton(), giveUp, submit));
}

function checkWriting(pad, q, status, buttons) {
  if (pad.isEmpty()) { pad.nudge(); return; }
  const pos = session.pos;
  const image = pad.snapshot();
  const selfCheck = (reason, guess) => {
    if (!session || session.pos !== pos || session.fb) return; // moved on while waiting
    updateSession({ check: { image, guess: guess || '', reason } });
    render();
  };
  if (!store.settings.recognize) { selfCheck('off'); return; }
  buttons.forEach((b) => { b.disabled = true; });
  status.textContent = '辨識中…';
  recognizeInk(pad.strokes(), pad.size)
    .then((candidates) => {
      if (!session || session.pos !== pos || session.fb) return;
      const verdict = Core.judgeRecognition(candidates, q.answer);
      if (verdict === 'match') submitAnswer({ verdict: 'right', given: candidates[0], self: false });
      else selfCheck(verdict, candidates[0]);
    })
    .catch(() => selfCheck('offline'));
}

function selfCheckCard(q, it) {
  const c = session.check;
  const decide = (verdict) => submitAnswer({ verdict, given: c.guess || '（手寫）', self: true });
  return el('section', { class: 'card selfcheck' },
    el('span', { class: 'chip chip-write' }, '寫國字'),
    el('h2', {}, SELF_CHECK_TITLES[c.reason] || SELF_CHECK_TITLES.off),
    phraseView(it, 'show'),
    el('div', { class: 'compare' },
      el('figure', {}, el('img', { src: c.image, alt: '你寫的字', class: 'compare-img' }), el('figcaption', {}, '你寫的')),
      el('figure', {}, modelChar(q.answer), el('figcaption', {}, '正確答案'))),
    c.guess ? el('p', { class: 'muted' }, `電腦看成：「${c.guess}」`) : null,
    el('p', { class: 'q-hint' }, '要一筆一畫都一樣才算對，多一點、少一橫都不行喔。'),
    el('div', { class: 'quiz-actions' },
      el('button', { type: 'button', class: 'btn btn-red', onclick: keyGuard(() => decide('wrong')) }, '✗ 不一樣，我寫錯了'),
      el('button', { type: 'button', class: 'btn btn-primary', onclick: keyGuard(() => decide('right')) }, '✓ 一樣，我寫對了')));
}

// ---------- 寫注音 ----------
function zhuyinCard(q, it) {
  const pad = makeZhuyinPad((value) => {
    if (!value) { pad.nudge(); return; }
    submitAnswer(value);
  });
  return el('section', { class: 'card quiz-card zhuyin-card' },
    el('span', { class: 'chip chip-zhuyin' }, '寫注音'),
    el('p', { class: 'q-hint' }, '看國字，用下面的注音拼出框起來的字怎麼念'),
    phraseView(it, 'zhuyin', true),
    pad.node,
    el('div', { class: 'quiz-actions' }, backButton(), skipButton(),
      el('button', { type: 'button', class: 'btn btn-ghost', onclick: () => submitAnswer(null) }, '不會，看答案')));
}

function quizCard() {
  const q = session.q;
  const it = ITEM_BY_ID.get(q.id);
  if (q.type === 'write') return session.check ? selfCheckCard(q, it) : writeCard(q, it);
  return zhuyinCard(q, it);
}

// ---------- wrong answer ----------
function feedbackHead(q, fb) {
  let title = '答錯了，明天會再考這一題';
  if (fb.gaveUp) title = '沒關係，記住正確答案';
  else if (fb.lostLevel > 0) title = `答錯了，${Core.LEVEL_NAMES[fb.lostLevel]}變回石頭`;
  return el('div', { class: 'fb-head', role: 'alert' },
    el('span', { class: 'fb-icon', 'aria-hidden': 'true' }, '✗'),
    el('div', {},
      el('b', {}, title),
      el('div', { class: 'fb-answer' }, '正確答案：', el('b', { class: 'kai' }, q.answer))));
}

function yoursLine(q, fb) {
  if (fb.gaveUp || !fb.given) return null;
  return el('p', { class: 'fb-yours' }, q.type === 'write' ? '電腦看成：' : '你選的：', el('s', {}, fb.given));
}

function traceForm(q) {
  const pad = makePad({ guide: q.answer, label: '照著淡淡的字寫一次' });
  const done = el('button', { type: 'button', class: 'btn btn-primary' }, '寫好了 →');
  done.addEventListener('click', keyGuard(() => {
    if (pad.isEmpty()) { pad.nudge(); return; }
    Sfx.fixed();
    advance();
  }));
  return el('div', { class: 'retype' },
    el('p', { class: 'q-hint' }, '照著淡淡的字描一次，記住字形：'),
    el('div', { class: 'pad-wrap' }, pad.node),
    padTools(pad),
    el('div', { class: 'quiz-actions' }, done));
}

function retypeZhuyin(q) {
  const pad = makeZhuyinPad((value) => {
    if (Core.zhuyinEqual(value, q.answer)) {
      Sfx.fixed();
      advance();
    } else {
      pad.nudge();
    }
  }, { placeholder: `照著拼：${q.answer}`, enterText: '拼好了 →' });
  return el('div', { class: 'retype' }, el('p', { class: 'q-hint' }, '照著正確的注音拼一次：'), pad.node);
}

function feedbackCard(it) {
  const q = session.q;
  const fb = session.fb;
  const head = [feedbackHead(q, fb), yoursLine(q, fb), phraseView(it, 'show', true),
    it.type === 'char' ? el('div', { class: 'learn-model' }, modelChar(it.char)) : null];
  if (session.mode === 'boss') {
    return el('section', { class: 'card fb-card' }, head,
      el('button', { class: 'btn btn-primary btn-wide', 'data-autofocus': '', onclick: keyGuard(advance) }, '下一題 →'));
  }
  return el('section', { class: 'card fb-card' }, head, q.type === 'write' ? traceForm(q) : retypeZhuyin(q));
}

// ---------- result ----------
function bossVerdict(pct) {
  if (pct >= 90) return '完美擊敗魔王！';
  if (pct >= 80) return '擊敗魔王！';
  if (pct >= 60) return '魔王只剩一點血，再挑戰一次！';
  return '魔王太強了，先練錯題本再來';
}

function itemChips(list) {
  return el('div', { class: 'chips' }, list.map((it) =>
    el('button', { class: 'word-chip kai', onclick: () => openItem(it.id) }, oreSprite(stateOf(it.id)), Core.phraseOf(it))));
}

function resultView() {
  const s = session;
  if (!s) return homeView();
  const pct = s.answered ? Math.round((s.correct / s.answered) * 100) : 0;
  const isBoss = s.mode === 'boss';
  const ups = [1, 2, 3].filter((lv) => s.ups[lv] > 0);
  const wrongItems = s.wrongIds.map((id) => ITEM_BY_ID.get(id)).filter(Boolean);
  const backHome = () => { session = null; go('home'); };
  return el('main', { class: 'screen' }, el('section', { class: 'card result' },
    isBoss ? sprite('blk-boss', 'result-boss') : null,
    el('h1', {}, isBoss ? bossVerdict(pct) : '任務完成！'),
    el('p', { class: 'result-score' }, el('b', {}, isBoss ? `${pct} 分` : `${s.correct} / ${s.answered}`),

    el('label', { class: 'check' }, el('input', { type: 'checkbox', checked: store.settings.recognize,

    el('p', { class: 'field-hint' }, '開著時，手寫的筆畫會送到 Google 手寫辨識（只有筆畫，沒有姓名或其他資料），認出來和答案一樣就自動算對；認不出來或沒網路時，改成讓孩子自己比對。關掉就全部自己比對。'),
    volumeControl(),
    el('label', { class: 'check' }, el('input', { type: 'checkbox', checked: store.settings.sound,
      onchange: (e) => { setSettings({ sound: e.target.checked }); Sfx.setEnabled(e.target.checked); } }), '遊戲音效（挖礦、升級、連續答對）'));
}

// ---------- backup ----------
function importPanel() {
  if (!pendingImport) return null;
  const n = Object.keys(pendingImport.states).length;
  const lastDay = Object.keys(pendingImport.log).sort().pop();
  const apply = () => {
    replaceProgress(pendingImport, '匯入');
    pendingImport = null;
    showToast(el('span', {}, '已匯入進度'), 'good');
    render();
  };
  return el('div', { class: 'confirm', role: 'alert' },
    el('p', {}, `這個檔案有 ${n} 題的紀錄${lastDay ? `，最後練習是 ${fmtDateW(lastDay)}` : ''}。要用它取代這台裝置上的進度嗎？`),
    el('button', { class: 'btn btn-red btn-sm', onclick: apply }, '取代目前進度'),
    el('button', { class: 'btn btn-dark btn-sm', onclick: () => { pendingImport = null; render(); } }, '取消'));
}

function onImportFile(e) {
  readProgressFile(e.target.files[0], VALID_IDS)
    .then((data) => { pendingImport = data; render(); })
    .catch((err) => { showToast(el('span', {}, err.message), 'bad'); });
}

function resetButton() {
  const reset = () => {
    if (!resetArmed) {
      resetArmed = true;
      render();
      setTimeout(() => { if (resetArmed) { resetArmed = false; render(); } }, 5000);
      return;
    }
    resetArmed = false;
    replaceProgress(Object.assign(Core.emptyStore(), { settings: store.settings }), '清除');
    showToast(el('span', {}, '進度已清除'), 'info');
    render();
  };
  return el('button', { class: resetArmed ? 'btn btn-red btn-sm' : 'btn btn-ghost btn-sm', onclick: reset },
    resetArmed ? '再按一次：確定清除全部進度' : '清除全部進度');
}

function undoPanel() {
  const backup = Storage.loadBackup(VALID_IDS);
  if (!backup) return null;
  const undo = () => {
    replaceProgress(backup.store, '復原');
    Storage.clearBackup();
    showToast(el('span', {}, '已復原'), 'good');
    render();
  };
  const seen = Object.keys(backup.store.states).length;
  return el('div', { class: 'confirm' },
    el('p', {}, `${fmtDateW(backup.savedAt)}「${backup.reason}」之前的進度還留著（${seen} 題的紀錄）。`),
    el('button', { class: 'btn btn-dark btn-sm', onclick: undo }, `復原到「${backup.reason}」之前`),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { Storage.clearBackup(); render(); } }, '不用了'));
}

function backupCard() {
  const fileInput = el('input', { type: 'file', accept: '.json,application/json', class: 'visually-hidden', onchange: onImportFile });
  return el('section', { class: 'card' }, el('h2', {}, '進度備份'),
    el('p', {}, '每答一題就會自動存檔，網頁更新也不會影響進度。進度只存在這台裝置裡：清除瀏覽紀錄、刪掉主畫面圖示或換裝置前，先匯出一個檔案，之後用「匯入」放回來。'),
    el('div', { class: 'row' },
      el('button', { class: 'btn btn-primary btn-sm', onclick: () => downloadProgress(store) }, '匯出進度'),
      el('button', { class: 'btn btn-dark btn-sm', onclick: () => fileInput.click() }, '匯入進度'),
      fileInput, resetButton()),
    importPanel(),
    undoPanel());
}

function parentView() {
  return el('main', { class: 'screen parent' }, backBar('家長'),
    overviewCard(), answersToConfirmCard(), logCard(), mistakesCard(), selfCheckedCard(), bossCard(), settingsCard(), backupCard(), versionCard());
}

// ---------- paper test ----------
let paperTest = null;
let paperAll = false;

/** 「注音或國字」＋前後文：＿＿ — the worksheet's own layout, with 專名號 (proper-noun underline) kept. */
function paperQuestion(r) {
  const it = ITEM_BY_ID.get(`q${r.no}`);
  const proper = Core.properMask(it);
  const at = [...it.before].length;
  const parts = [...Core.phraseOf(it)].map((ch, i) => {
    const text = i === at ? `「${it.prompt}」` : ch;
    return el('span', { class: [proper[i] ? 'proper' : '', i === at ? 'paper-prompt' : ''].filter(Boolean).join(' ') || null }, text);
  });
  return el('li', { value: r.no },
    el('span', { class: 'kai' }, parts, '：'),
    el('span', { class: 'paper-line' }, '＿＿＿＿'));
}

function paperSheet(rows) {
  return el('div', { class: 'sheet' },
    el('h1', {}, '國一第一次段考 字音練習卷'),
    el('p', { class: 'sheet-meta' }, `姓名：＿＿＿＿＿＿　日期：＿＿＿＿＿＿　答對：＿＿＿ / ${rows.length}`),
    el('h2', {}, '寫出括號內的國字或注音'),
    el('ol', { class: 'sheet-list paper-grid' }, rows.map(paperQuestion)));
}

function answerKey(rows) {
  return el('div', { class: 'sheet answer-key' },
    el('h1', {}, '解答'),
    el('ol', { class: 'key-list kai' }, rows.map((r) => el('li', { value: r.no }, r.answer))));
}

function paperView() {
  if (!paperTest) paperTest = Core.buildPaperTest(ITEMS, store.states, Math.random, 30, paperAll);
  const setAll = (all) => { paperAll = all; paperTest = null; render(); };
  return el('main', { class: 'screen paper-screen' },
    el('div', { class: 'no-print' }, backBar('紙本測驗'),
      el('div', { class: 'row paper-tools' },
        toggleGroup('題目', [[false, '30 題（先出不熟的）'], [true, '整份 100 題']], (v) => paperAll === v, setAll),
        paperAll ? null : el('button', { class: 'btn btn-dark btn-sm', onclick: () => { paperTest = null; render(); } }, '換一份'),
        el('button', { class: 'btn btn-primary btn-sm', onclick: () => window.print() }, '列印')),
      el('p', { class: 'paper-note' }, '最後一頁是解答，印好後先收起來。')),
    el('article', { id: 'paper', class: 'paper' }, paperSheet(paperTest), answerKey(paperTest)));
}

// ---- main.js ----
/* Boot, routing, rendering, and keeping tabs and days in sync. */
const UNIT_IDS = ['char', 'zhuyin'];
const KEY_GUARD_MS = 450;
const VIEWS = {
  home: homeView, session: sessionView, result: resultView, errors: errorsView, practice: practiceView,
  boss: bossView, bank: bankView, parent: parentView, paper: paperView,
};

// Filled in by startApp() once the questions are available (the web copy first needs unlocking).
let ITEMS = [];
let ITEM_BY_ID = new Map();
let VALID_IDS = new Set();
let store = null;
let route = 'home';
let lastRenderAt = 0;
let renderedDay = Core.todayISO();

/** change(store) returns the next store. Re-reads first when another tab saved in the meantime. */
function commit(change) {
  const saved = Storage.savedRev();
  if (saved !== null && saved !== store.rev) store = Storage.load(VALID_IDS);
  store = Object.assign({}, change(store), { rev: store.rev + 1 });
  Storage.save(store);
}

function render() {
  const root = document.getElementById('app');
  setChildren(root, route === 'session' ? null : updateBanner(), (VIEWS[route] || homeView)());
  lastRenderAt = performance.now();
  renderedDay = Core.todayISO();
  const target = root.querySelector('[data-autofocus]');
  if (target && route !== 'home') target.focus();
}

function go(name) {
  route = name;
  render();
  window.scrollTo(0, 0);
}

/** Ignores a keyboard "click" that lands right after a screen change (a double Enter). */
function keyGuard(fn) {
  return (e) => {
    if (e && e.detail === 0 && performance.now() - lastRenderAt < KEY_GUARD_MS) return;
    fn(e);
  };
}

/** Another tab saved, or a new day started while this tab stayed open: show the latest. */
function syncFromStorage() {
  const saved = Storage.savedRev();
  const changed = saved !== null && saved !== store.rev;
  if (changed) store = Storage.load(VALID_IDS);
  const newDay = renderedDay !== Core.todayISO();
  if ((changed || newDay) && route !== 'session') render();
}

function applyAudioSettings() {
  Sfx.setEnabled(store.settings.sound);
  Sfx.setVolume(store.settings.volume);
}

/** Asks the browser not to evict saved progress when space runs low (silently granted or not). */
function requestPersistentStorage() {
  try {
    if (window.location.protocol === 'https:' && navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => { /* keep best-effort storage */ });
    }
  } catch (e) { /* unsupported */ }
}

function startApp(data) {
  ITEMS = Core.buildItems(data.doc);
  ITEM_BY_ID = new Map(ITEMS.map((it) => [it.id, it]));
  VALID_IDS = new Set(ITEMS.map((it) => it.id));
  store = Storage.load(VALID_IDS);
  initWhatsNew(Object.keys(store.states).length > 0);
  applyAudioSettings();
  preferPlaybackAudio();
  requestPersistentStorage();
  window.addEventListener('storage', (e) => { if (e.key === STORAGE_KEY) syncFromStorage(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    syncFromStorage();
    checkForUpdate();
  });
  window.addEventListener('focus', syncFromStorage);
  if (/[?&]e2e\b/.test(window.location.search)) {
    window.__guoziMine = {
      answer: () => (session && session.q ? session.q.answer : null),
      step: () => (session ? session.queue[session.pos] : null),
      store: () => store,
      sync: syncFromStorage,
      checkUpdate: () => checkForUpdate(true),
    };
  }
  render();
  checkForUpdate();
}

function boot() {
  installSprites();
  AudioOut.startOnFirstTouch();
  if (window.VOCAB_LOCKED) unlock(window.VOCAB_LOCKED).then(startApp);
  else startApp({ doc: window.GUOZI_DATA });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
