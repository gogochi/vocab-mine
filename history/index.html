function homeView() {
  return el('main', { class: 'screen home' },
    homeTop(),
    Storage.isOk() ? null : storageWarning(),
    whatsNewCard(),
    store.rounds.length ? null : introCard(),
    partsProgress(),
    PAPER.parts.map((part, i) => partCard(part, i)),
    el('nav', { class: 'menu home-menu', 'aria-label': '其他' },
      el('button', { class: 'menu-btn', onclick: () => go('parent') }, sprite('blk-diamond'), el('b', {}, '家長'), el('span', {}, '成績、設定、備份'))),
    el('footer', { class: 'foot' },
      el('p', {}, '每答一題都會自動存檔。進度存在這台裝置裡，清除瀏覽紀錄前請先到「家長」頁匯出備份。'),
      el('p', { class: 'version' }, versionLabel())));
}

// ---------- parent page ----------
function practicedDays() {
  return Object.keys(store.log).filter((d) => store.log[d].q > 0);
}

function overviewCard() {
  const days = practicedDays();
  const minutes = Math.round(days.reduce((s, d) => s + store.log[d].ms, 0) / 60000);
  const q = days.reduce((s, d) => s + store.log[d].q, 0);
  const ok = days.reduce((s, d) => s + store.log[d].ok, 0);
  const rows = PAPER.parts.map((part) => {
    const last = lastFull(part.id);
    const redo = ExamCore.wrongToRedo(store.rounds, PAPER.items, part.id);
    return el('tr', {}, el('td', {}, part.short), el('td', {}, part.nos.length),
      el('td', {}, last ? `${examPoints(last)} 分` : '—'), el('td', {}, last ? (redo.length ? `${redo.length} 題` : '都訂正了') : '—'));
  });
  return el('section', { class: 'card' },
    el('h2', {}, '進度總覽'),
    el('p', {}, q ? `練了 ${days.length} 天，共約 ${minutes} 分鐘，作答 ${q} 題，答對率 ${Math.round((ok / q) * 100)}%。` : '還沒有開始練習。'),
    el('table', { class: 'table' },
      el('thead', {}, el('tr', {}, ['段落', '題數', '最近一次全段', '還沒訂正'].map((h) => el('th', {}, h)))),
      el('tbody', {}, rows)));
}

function logCard() {
  const days = practicedDays().sort().reverse().slice(0, LOG_DAYS_SHOWN);
  const rows = days.map((d) => {
    const e = store.log[d];
    return el('tr', {}, el('td', {}, fmtDateW(d)), el('td', {}, e.q), el('td', {}, `${Math.round((e.ok / e.q) * 100)}%`),
      el('td', {}, Math.max(1, Math.round(e.ms / 60000))));
  });
  return el('section', { class: 'card' }, el('h2', {}, '每天練習紀錄'),
    days.length
      ? el('table', { class: 'table' }, el('thead', {}, el('tr', {}, ['日期', '題數', '答對率', '分鐘'].map((h) => el('th', {}, h)))), el('tbody', {}, rows))
      : el('p', { class: 'muted' }, '還沒有練習紀錄。'));
}

function field(label, control, hint) {
  return el('label', { class: 'field' }, el('span', { class: 'field-label' }, label), control, hint ? el('span', { class: 'field-hint' }, hint) : null);
}

function volumeControl() {
  const pct = (v) => `${Math.round(v * 100)}%`;
  const label = el('span', {}, pct(store.settings.volume));
  return el('div', { class: 'voice' },
    field('音效音量', el('div', { class: 'rate' },
      el('input', { type: 'range', min: '0.1', max: '1', step: '0.05', value: String(store.settings.volume), 'aria-label': '音量',
        oninput: (e) => { label.textContent = pct(Number(e.target.value)); },
        onchange: (e) => { setSettings({ volume: Number(e.target.value) }); applyAudioSettings(); } }),
      label)),
    el('button', { type: 'button', class: 'btn btn-dark btn-sm', onclick: () => Sfx.correct() }, '🔊 試聽音量'));
}

function settingsCard() {
  return el('section', { class: 'card settings' }, el('h2', {}, '設定'),
    field('歷史段考日期', el('input', { type: 'date', value: store.settings.examDate,
      onchange: (e) => { if (/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) { setSettings({ examDate: e.target.value }); render(); } } }),
    '首頁的倒數會用這個日期。'),
    volumeControl(),
    el('label', { class: 'check' }, el('input', { type: 'checkbox', checked: store.settings.sound,
      onchange: (e) => { setSettings({ sound: e.target.checked }); Sfx.setEnabled(e.target.checked); } }), '遊戲音效（答對、連續答對、做完一段）'));
}

/** Keep one copy of the current progress before a destructive action, so it can be undone. */
function replaceProgress(next, reason) {
  Storage.saveBackup(store, reason);
  commit(() => next);
  applyAudioSettings();
}

const progressSummary = (s) => `${s.rounds.length} 次作答紀錄`;

function importPanel() {
  if (!pendingImport) return null;
  const lastDay = Object.keys(pendingImport.log).sort().pop();
  const apply = () => {
    replaceProgress(pendingImport, '匯入');
    pendingImport = null;
    showToast(el('span', {}, '已匯入進度'), 'good');
    render();
  };
  return el('div', { class: 'confirm', role: 'alert' },
    el('p', {}, `這個檔案有 ${progressSummary(pendingImport)}${lastDay ? `，最後練習是 ${fmtDateW(lastDay)}` : ''}。要用它取代這台裝置上的進度嗎？`),
    el('button', { class: 'btn btn-red btn-sm', onclick: apply }, '取代目前進度'),
    el('button', { class: 'btn btn-dark btn-sm', onclick: () => { pendingImport = null; render(); } }, '取消'));
}

function onImportFile(e) {
  readProgressFile(e.target.files[0])
    .then((data) => { pendingImport = data; render(); })
    .catch((err) => { showToast(el('span', {}, err.message), 'bad'); });
}

function clearSavedRounds() {
  PAPER.parts.forEach((part) => { try { localStorage.removeItem(runKeyOf(part.id)); } catch (e) { /* nothing saved */ } });
}

function resetButton() {
  const reset = () => {
    if (!resetArmed) {
      resetArmed = true;
      render();
      setTimeout(() => { if (resetArmed) { resetArmed = false; render(); } }, 5000);
      return;
    }
    resetArmed = false;
    replaceProgress(Object.assign(Core.emptyStore(), { settings: store.settings }), '清除');
    clearSavedRounds();
    showToast(el('span', {}, '進度已清除'), 'info');
    render();
  };
  return el('button', { class: resetArmed ? 'btn btn-red btn-sm' : 'btn btn-ghost btn-sm', onclick: reset },
    resetArmed ? '再按一次：確定清除全部進度' : '清除全部進度');
}

function undoPanel() {
  const backup = Storage.loadBackup();
  if (!backup) return null;
  const undo = () => {
    replaceProgress(backup.store, '復原');
    Storage.clearBackup();
    showToast(el('span', {}, '已復原'), 'good');
    render();
  };
  return el('div', { class: 'confirm' },
    el('p', {}, `${fmtDateW(backup.savedAt)}「${backup.reason}」之前的進度還留著（${progressSummary(backup.store)}）。`),
    el('button', { class: 'btn btn-dark btn-sm', onclick: undo }, `復原到「${backup.reason}」之前`),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { Storage.clearBackup(); render(); } }, '不用了'));
}

function backupCard() {
  const fileInput = el('input', { type: 'file', accept: '.json,application/json', class: 'visually-hidden', onchange: onImportFile });
  return el('section', { class: 'card' }, el('h2', {}, '進度備份'),
    el('p', {}, '每答一題就會自動存檔，網頁更新也不會影響進度。進度只存在這台裝置裡：清除瀏覽紀錄、刪掉主畫面圖示或換裝置前，先匯出一個檔案，之後用「匯入」放回來。'),
    el('div', { class: 'row' },
      el('button', { class: 'btn btn-primary btn-sm', onclick: () => downloadProgress(store) }, '匯出進度'),
      el('button', { class: 'btn btn-dark btn-sm', onclick: () => fileInput.click() }, '匯入進度'),
      fileInput, resetButton()),
    importPanel(),
    undoPanel());
}

function parentView() {
  return el('main', { class: 'screen parent' }, backBar('家長'),
    overviewCard(), roundsParentCard(), logCard(), settingsCard(), backupCard(), versionCard());
}

// ---- main.js ----
/* Boot, routing, rendering, and keeping tabs and days in sync. */
const VIEWS = { home: homeView, parent: parentView, 'exam-q': examQuestionView, 'exam-done': examResultView };
// Mid-question screens: no update banner, and no re-render from other tabs.
const PRACTICE_ROUTES = ['exam-q'];

let store = null;
let route = 'home';
let lastRenderAt = 0;
let renderedDay = Core.todayISO();

/** change(store) returns the next store. Re-reads first when another tab saved in the meantime. */
function commit(change) {
  const saved = Storage.savedRev();
  if (saved !== null && saved !== store.rev) store = Storage.load();
  store = Object.assign({}, change(store), { rev: store.rev + 1 });
  Storage.save(store);
}

function render() {
  const root = document.getElementById('app');
  setChildren(root, inPractice() ? null : updateBanner(), (VIEWS[route] || homeView)());
  lastRenderAt = performance.now();
  renderedDay = Core.todayISO();
}

function inPractice() {
  return PRACTICE_ROUTES.includes(route);
}

function go(name) {
  route = name;
  render();
  window.scrollTo(0, 0);
}

/** Another tab saved, or a new day started while this tab stayed open: show the latest. */
function syncFromStorage() {
  const saved = Storage.savedRev();
  const changed = saved !== null && saved !== store.rev;
  if (changed) store = Storage.load();
  const newDay = renderedDay !== Core.todayISO();
  if ((changed || newDay) && !inPractice()) render();
}

function applyAudioSettings() {
  Sfx.setEnabled(store.settings.sound);
  Sfx.setVolume(store.settings.volume);
}

/** Asks the browser not to evict saved progress when space runs low (silently granted or not). */
function requestPersistentStorage() {
  try {
    if (window.location.protocol === 'https:' && navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => { /* keep best-effort storage */ });
    }
  } catch (e) { /* unsupported */ }
}

function startApp(data) {
  setPaper(data.paper);
  store = Storage.load();
  initWhatsNew(store.rounds.length > 0 || Object.keys(store.log).length > 0);
  applyAudioSettings();
  preferPlaybackAudio();
  requestPersistentStorage();
  window.addEventListener('storage', (e) => { if (e.key === STORAGE_KEY) syncFromStorage(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    syncFromStorage();
    checkForUpdate();
  });
  window.addEventListener('focus', syncFromStorage);
  if (/[?&]e2e\b/.test(window.location.search)) {
    window.__histMine = {
      store: () => store,
      sync: syncFromStorage,
      checkUpdate: () => checkForUpdate(true),
      exam: () => (examRun && !ExamCore.isFinished(examRun) ? { no: ExamCore.currentNo(examRun), answer: examQuestionNow().answer } : null),
    };
  }
  render();
  checkForUpdate();
}

function boot() {
  installSprites();
  AudioOut.startOnFirstTouch();
  if (window.APP_LOCKED) unlock(window.APP_LOCKED).then(startApp);
  else startApp({ paper: window.APP_PAPER });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
