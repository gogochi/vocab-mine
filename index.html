// ---- audio.js ----
/* Pronunciation through the browser's built-in speech (works offline with local voices),
 * and tiny generated sound effects (no audio files needed). */
const Speech = (() => {
  const supported = typeof window !== 'undefined' && 'speechSynthesis' in window
    && typeof window.SpeechSynthesisUtterance === 'function';
  const listeners = new Set();
  let english = [];
  let chosen = null;
  let preferred = '';
  let volume = 1;
  const isEnglish = (v) => /^en([-_]|$)/i.test(v.lang);

  function refresh() {
    if (!supported) return;
    english = window.speechSynthesis.getVoices().filter(isEnglish);
    chosen = english.find((v) => v.name === preferred)
      || english.find((v) => /en[-_]US/i.test(v.lang) && v.localService)
      || english.find((v) => /en[-_]US/i.test(v.lang))
      || english.find((v) => /en[-_]GB/i.test(v.lang))
      || english[0] || null;
    listeners.forEach((fn) => fn());
  }

  function init(name) {
    preferred = name || '';
    if (!supported) return;
    refresh();
    const synth = window.speechSynthesis;
    if (typeof synth.addEventListener === 'function') synth.addEventListener('voiceschanged', refresh);
    else synth.onvoiceschanged = refresh;
  }

  /** Unknown until voices load, so assume yes; no once voices exist but none is English. */
  function isAvailable() {
    if (!supported) return false;
    return window.speechSynthesis.getVoices().length === 0 || english.length > 0;
  }

  function utter(text, rate) {
    const u = new window.SpeechSynthesisUtterance(text);
    u.lang = chosen ? chosen.lang : 'en-US';
    if (chosen) u.voice = chosen;
    u.rate = rate;
    u.volume = volume;
    window.speechSynthesis.speak(u);
  }

  function speak(text, rate) {
    if (!supported || !text) return;
    const synth = window.speechSynthesis;
    if (synth.speaking || synth.pending) {
      synth.cancel();
      setTimeout(() => utter(text, rate), 60); // Chrome drops a speak() issued right after cancel()
    } else {
      utter(text, rate);
    }
  }

  return {
    init,
    speak,
    isAvailable,
    stop() { if (supported) window.speechSynthesis.cancel(); },
    voices() { return english.map((v) => ({ name: v.name, lang: v.lang })); },
    setPreferred(name) { preferred = name || ''; refresh(); },
    setVolume(v) { volume = v; },
    onChange(fn) { listeners.add(fn); },
  };
})();

/** iPad: play as media (full media volume, also when the device is in silent mode). */
function preferPlaybackAudio() {
  try {
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
  } catch (e) { /* older Safari: keep the default session */ }
}

/* Game sounds, all synthesized with Web Audio (no sound files): a pickaxe "clink" whose pitch climbs
 * with the combo, a different reward for each ore, fanfares for combos, mission and boss. */
const Sfx = (() => {
  let ctx = null;
  let master = null;
  let noiseBuf = null;
  let enabled = true;
  let volume = 1;

  function audio() {
    if (!enabled) return null;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!ctx) {
      ctx = new AC();
      master = ctx.createGain();
      master.connect(ctx.destination);
    }
    master.gain.value = volume;
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function noiseBuffer(c) {
    if (!noiseBuf) {
      noiseBuf = c.createBuffer(1, Math.floor(c.sampleRate * 0.6), c.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i += 1) data[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
  }

  /** One note; `to` glides the pitch (boing, bonk). */
  function tone(c, t0, n) {
    const osc = c.createOscillator();
    const gain = c.createGain();
    const at = t0 + (n.at || 0);
    osc.type = n.type || 'square';
    osc.frequency.setValueAtTime(n.f, at);
    if (n.to) osc.frequency.exponentialRampToValueAtTime(n.to, at + n.dur);
    gain.gain.setValueAtTime(n.vol || 0.12, at);
    gain.gain.exponentialRampToValueAtTime(0.0001, at + n.dur);
    osc.connect(gain);
    gain.connect(master);
    osc.start(at);
    osc.stop(at + n.dur + 0.02);
  }

  /** A burst of filtered noise: pickaxe on stone, thuds, sparkles. */
  function hiss(c, t0, h) {
    const src = c.createBufferSource();
    const filter = c.createBiquadFilter();
    const gain = c.createGain();
    const at = t0 + (h.at || 0);
    src.buffer = noiseBuffer(c);
    filter.type = h.filter || 'bandpass';
    filter.frequency.value = h.f;
    filter.Q.value = h.q || 1;
    gain.gain.setValueAtTime(h.vol || 0.2, at);
    gain.gain.exponentialRampToValueAtTime(0.0001, at + h.dur);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(master);
    src.start(at);
    src.stop(at + h.dur + 0.02);
  }

  function play(notes, hits) {
    const c = audio();
    if (!c) return;
    const t0 = c.currentTime + 0.01;
    (hits || []).forEach((h) => hiss(c, t0, h));
    (notes || []).forEach((n) => tone(c, t0, n));
  }

  const semis = (f, n) => f * Math.pow(2, n / 12);
  const arp = (freqs, gap, dur, type, vol, start) =>
    freqs.map((f, i) => ({ f, at: (start || 0) + i * gap, dur, type, vol }));
  const CLINK = { f: 3200, q: 4, dur: 0.05, vol: 0.35 };
  const COMBO_MAX_STEPS = 12;

  /** Pickaxe hits stone; the ding climbs a semitone per answer in a row (up to an octave). */
  function mine(combo) {
    const f = semis(880, Math.min(Math.max(combo, 1) - 1, COMBO_MAX_STEPS));
    play([{ f, at: 0.03, dur: 0.08 }, { f: f * 1.5, at: 0.09, dur: 0.14 }], [CLINK]);
  }

  /** Reward for reaching a new ore. short = keep it brief when speech comes right after. */
  function ore(lv, short) {
    if (short || lv <= 1) {
      // iron: a metallic clang
      play([{ f: 660, dur: 0.16, vol: 0.09 }, { f: 993, dur: 0.16, vol: 0.07 }, { f: 1320, at: 0.08, dur: 0.18, vol: 0.09 }],
        [CLINK, { f: 2400, q: 12, at: 0.02, dur: 0.18, vol: 0.18 }]);
      return;
    }
    if (lv === 2) {
      // gold: a bright run upwards with a sparkle
      play(arp([1047, 1319, 1568, 2093], 0.06, 0.13, 'triangle', 0.22),
        [CLINK, { f: 7000, filter: 'highpass', at: 0.12, dur: 0.25, vol: 0.06 }]);
      return;
    }
    // diamond: a magic bell with a shimmer
    play([
      ...arp([784, 988, 1175, 1568, 1976], 0.07, 0.16, 'triangle', 0.2),
      { f: 1568, at: 0.38, dur: 0.9, type: 'sine', vol: 0.22 },
      { f: 1568 * 2.76, at: 0.38, dur: 0.5, type: 'sine', vol: 0.06 },
    ], [CLINK, { f: 8000, filter: 'highpass', at: 0.3, dur: 0.7, vol: 0.05 }]);
  }

  /** Every 5 answers in a row: a short fanfare that gets higher with longer combos. */
  function combo(n) {
    const lift = Math.min(Math.floor(n / 5) - 1, 4) * 2;
    const run = [523, 659, 784, 1047].map((f) => semis(f, lift));
    play([
      ...arp(run, 0.07, 0.1, 'square', 0.1),
      ...[1047, 1319, 1568].map((f) => ({ f: semis(f, lift), at: 0.3, dur: 0.35, type: 'triangle', vol: 0.12 })),
    ]);
  }

  return {
    setEnabled(v) { enabled = Boolean(v); },
    setVolume(v) {
      volume = v;
      if (master) master.gain.value = v;
    },
    mine,
    ore,
    combo,
    // wrong: a cartoon "bonk" (falling pitch plus a soft thud), not a harsh buzzer
    wrong() { play([{ f: 330, to: 110, dur: 0.22, vol: 0.12 }], [{ f: 300, filter: 'lowpass', dur: 0.12, vol: 0.35 }]); },
    // the answer was typed out correctly after a mistake: "repaired"
    fixed() { play(arp([660, 880], 0.07, 0.12, 'triangle', 0.2)); },
    complete() {
      play([...arp([392, 523, 659, 784], 0.09, 0.12, 'square', 0.1),
        ...[523, 659, 784, 1047].map((f) => ({ f, at: 0.4, dur: 0.6, type: 'triangle', vol: 0.11 }))]);
    },
    // boss: every correct answer lands a hit
    bossHit() { play([{ f: 140, to: 60, dur: 0.16, type: 'sine', vol: 0.35 }], [{ f: 500, filter: 'lowpass', dur: 0.1, vol: 0.3 }]); },
    bossWin() {
      play([...arp([523, 523, 523, 659, 784, 1047], 0.1, 0.12, 'square', 0.1),
        ...[784, 1047, 1319, 1568].map((f) => ({ f, at: 0.65, dur: 0.8, type: 'triangle', vol: 0.1 }))]);
    },
    // boss survived: a comic "wah-wah"
    bossLose() {
      play([{ f: 392, to: 370, at: 0, dur: 0.3, vol: 0.09 }, { f: 349, to: 330, at: 0.32, dur: 0.3, vol: 0.09 },
        { f: 311, to: 233, at: 0.64, dur: 0.6, vol: 0.09 }]);
    },
    // kept for older call sites
    correct() { mine(1); },
    levelUp(lv) { ore(lv); },
  };
})();

// ---- store.js ----
/* Progress lives in this browser's localStorage; files are the backup / move-to-another-device path. */
const STORAGE_KEY = 'vocab-mine-u4u7';
const BACKUP_KEY = `${STORAGE_KEY}:backup`;
const MAX_IMPORT_BYTES = 2 * 1024 * 1024;
const DOWNLOAD_URL_TTL_MS = 60 * 1000; // iPad asks before downloading; keep the link alive meanwhile

const Storage = (() => {
  let ok = true;

  function probe() {
    try {
      const k = `${STORAGE_KEY}:probe`;
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
      return true;
    } catch (e) {
      return false;
    }
  }

  function readRaw(key) {
    try {
      return localStorage.getItem(key);
    } catch (e) {
      return null;
    }
  }

  function load(validIds) {
    ok = probe();
    if (!ok) return Core.emptyStore();
    const raw = readRaw(STORAGE_KEY);
    if (!raw) return Core.emptyStore();
    try {
      return Core.sanitizeStore(JSON.parse(raw), validIds);
    } catch (e) {
      // Keep the unreadable copy instead of silently overwriting it, then start fresh.
      try { localStorage.setItem(`${STORAGE_KEY}:unreadable-${Date.now()}`, raw); } catch (ignored) { /* quota */ }
      return Core.emptyStore();
    }
  }

  /** The rev of what is saved now (another tab may have written since we loaded). */
  function savedRev() {
    const raw = readRaw(STORAGE_KEY);
    if (!raw) return null;
    try {
      const rev = JSON.parse(raw).rev;
      return Number.isInteger(rev) ? rev : 0;
    } catch (e) {
      return null;
    }
  }

  function save(store) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
      ok = true;
    } catch (e) {
      ok = false;
    }
    return ok;
  }

  /** One undo slot for the destructive actions (import replaces, reset clears). */
  function saveBackup(store, reason) {
    try {
      localStorage.setItem(BACKUP_KEY, JSON.stringify({ savedAt: Core.todayISO(), reason, store }));
    } catch (e) { /* no room for a backup: the action still proceeds */ }
  }

  function loadBackup(validIds) {
    const raw = readRaw(BACKUP_KEY);
    if (!raw) return null;
    try {
      const data = JSON.parse(raw);
      return { savedAt: data.savedAt, reason: data.reason, store: Core.sanitizeStore(data.store, validIds) };
    } catch (e) {
      return null;
    }
  }

  function clearBackup() {
    try { localStorage.removeItem(BACKUP_KEY); } catch (e) { /* nothing to clear */ }
  }

  return { load, save, savedRev, saveBackup, loadBackup, clearBackup, isOk: () => ok };
})();

function downloadProgress(store) {
  const blob = new Blob([JSON.stringify(store)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: `單字挖礦進度-${Core.todayISO()}.json` });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), DOWNLOAD_URL_TTL_MS);
}

/** Resolves with a validated store, or rejects with a message a parent can act on. */
function readProgressFile(file, validIds) {
  return new Promise((resolve, reject) => {
    if (!file) { reject(new Error('沒有選到檔案。')); return; }
    if (file.size > MAX_IMPORT_BYTES) { reject(new Error('檔案太大，不是單字挖礦的進度檔。')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('讀不到這個檔案，請再試一次。'));
    reader.onload = () => {
      try {
        const data = Core.sanitizeStore(JSON.parse(String(reader.result)), validIds);
        if (!Object.keys(data.states).length && !Object.keys(data.log).length) {
          reject(new Error('這個檔案裡沒有任何練習紀錄，所以沒有匯入。'));
          return;
        }
        resolve(data);
      } catch (e) {
        reject(e instanceof SyntaxError ? new Error('檔案內容不是進度檔格式。') : e);
      }
    };
    reader.readAsText(file);
  });
}

// ---- lock.js ----
/* The hosted copy carries the vocabulary encrypted (AES-GCM, key derived from a family passphrase),
 * so the textbook sentences are not readable by whoever finds the public URL. */
const PASS_KEY = `${STORAGE_KEY}:pass`;
const normalizePass = (s) => String(s).normalize('NFKC').trim().toLowerCase();
const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

function decryptVocab(locked, pass) {
  const subtle = window.crypto && window.crypto.subtle;
  if (!subtle) return Promise.reject(new Error('no-crypto'));
  return subtle.importKey('raw', new TextEncoder().encode(normalizePass(pass)), 'PBKDF2', false, ['deriveKey'])
    .then((base) => subtle.deriveKey(
      { name: 'PBKDF2', salt: fromB64(locked.salt), iterations: locked.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']))
    .then((key) => subtle.decrypt({ name: 'AES-GCM', iv: fromB64(locked.iv) }, key, fromB64(locked.data)))
    .then((buf) => JSON.parse(new TextDecoder().decode(buf)));
}

function readSavedPass() {
  try { return localStorage.getItem(PASS_KEY); } catch (e) { return null; }
}
function savePass(pass) {
  try { localStorage.setItem(PASS_KEY, normalizePass(pass)); } catch (e) { /* asked again next time */ }
}
function forgetPass() {
  try { localStorage.removeItem(PASS_KEY); } catch (e) { /* nothing saved */ }
}

function lockView(onSubmit, message) {
  const input = el('input', {
    class: 'answer', type: 'text', lang: 'en', 'aria-label': '通關密語',
    autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', enterkeyhint: 'go',
  });
  const button = el('button', { type: 'submit', class: 'btn btn-primary btn-wide' }, '開始挖礦');
  const form = el('form', {
    class: 'card lock', autocomplete: 'off', novalidate: true,
    onsubmit: (e) => {
      e.preventDefault();
      if (!input.value.trim()) { input.focus(); return; }
      button.disabled = true;
      button.textContent = '解鎖中…';
      onSubmit(input.value);
    },
  },
  sprite('blk-diamond', 'lock-ore'),
  el('h1', {}, '單字挖礦'),
  el('p', {}, '常春藤基礎字彙 U4–U7'),
  el('p', { class: 'lock-hint' }, '請輸入通關密語（問家長）。輸入一次之後，這台裝置就會記住。'),
  input,
  message ? el('p', { class: 'lock-msg', role: 'alert' }, message) : null,
  button);
  return el('main', { class: 'screen' }, form);
}

/** Resolves with {units, tracks} once the saved or typed passphrase decrypts the data. */
function unlock(locked) {
  return new Promise((resolve) => {
    const root = document.getElementById('app');
    const show = (message) => {
      setChildren(root, lockView(attempt, message));
      root.querySelector('input').focus();
    };
    function attempt(pass) {
      decryptVocab(locked, pass)
        .then((data) => { savePass(pass); resolve(data); })
        .catch((err) => show(err.message === 'no-crypto'
          ? '這個瀏覽器沒辦法解鎖，請用 Safari 打開 https 開頭的網址。'
          : '通關密語不對，再試一次。'));
    }
    const saved = readSavedPass();
    if (!saved) { show(''); return; }
    decryptVocab(locked, saved).then(resolve).catch(() => { forgetPass(); show(''); });
  });
}

// ---- session.js ----
/* Practice sessions: learn cards, questions, wrong-answer feedback and results. */
const BOSS_SIZE = 30;
const EXTRA_NEW = 10;
const ERROR_SESSION_MAX = 30;
const ACTIVE_CAP_MS = 90 * 1000;
const MODE_LABELS = {
  mission: '今日任務', extra: '多學新字', errors: '錯題本', practice: '自由練習', boss: '魔王關', redo: '重練答錯的字',
};
const TYPE_LABELS = { spell: '拼字', cloze: '例句填空', listen: '聽寫', forms: '動詞三態' };
const ALL_TYPES_ON = { types: { spell: true, cloze: true, listen: true, forms: true } };
const COMBO_STEP = 5;      // fanfare every 5 answers in a row
const COMBO_BADGE_MIN = 3; // show the 🔥 counter from 3 in a row

let session = null;
const updateSession = (patch) => { session = Object.assign({}, session, patch); };
const stateOf = (id) => Core.getState(store.states, id);
const emptyLog = () => ({ q: 0, ok: 0, ms: 0, fresh: 0, mined: 0 });
const todayLog = () => store.log[Core.todayISO()] || emptyLog();

// ---------- building a session ----------
/** mix: give stone words varied question types too (error book, boss, practice). */
function typePicker(mix) {
  const ttsOk = Speech.isAvailable();
  return (it) => {
    const st = stateOf(it.id);
    return Core.pickType(it, mix && st.lv === 0 ? Object.assign({}, st, { lv: 1 }) : st, store.settings, ttsOk);
  };
}

function fixedType(type) {
  const ttsOk = Speech.isAvailable();
  return (it) => (Core.availableTypes(it, ALL_TYPES_ON, ttsOk).includes(type) ? type : 'spell');
}

function queueFor(mode, opts) {
  if (mode === 'mission') {
    const m = Core.buildMission(ITEMS, store.states, Core.todayISO(), store.settings, todayLog().fresh);
    return Core.buildQueue(m.reviews, m.fresh, typePicker(false));
  }
  if (mode === 'extra') {
    return Core.buildQueue([], ITEMS.filter((it) => !stateOf(it.id).seen).slice(0, EXTRA_NEW), typePicker(false));
  }
  if (mode === 'errors') {
    return Core.buildQueue(Core.errorBook(ITEMS, store.states).slice(0, ERROR_SESSION_MAX), [], typePicker(true));
  }
  if (mode === 'redo') {
    return Core.buildQueue(opts.ids.map((id) => ITEM_BY_ID.get(id)).filter(Boolean), [], typePicker(true));
  }
  if (mode === 'practice') {
    const filter = opts.type === 'forms' ? (it) => Boolean(it.forms) : () => true;
    const sel = Core.selectPractice(ITEMS, store.states, opts.units, opts.count, Math.random, filter);
    if (opts.type === 'mix') return Core.buildQueue(sel.review, sel.fresh, typePicker(true));
    return Core.buildQueue(sel.review, sel.fresh, fixedType(opts.type), Math.random, fixedType(opts.type));
  }
  if (mode === 'boss') {
    const pickBoss = typePicker(true);
    return Core.selectBoss(ITEMS, store.states, BOSS_SIZE).map((it) => ({ kind: 'quiz', id: it.id, qtype: pickBoss(it) }));
  }
  return [];
}

function questionAt(pos) {
  const step = session.queue[pos];
  if (!step || step.kind !== 'quiz') return null;
  const it = ITEM_BY_ID.get(step.id);
  return Core.makeQuestion(it, step.qtype, stateOf(it.id), Math.random, session.mode === 'boss');
}

function startSession(mode, opts) {
  const queue = queueFor(mode, opts || {});
  if (!queue.length) {
    showToast(el('span', {}, '目前沒有要練的字'), 'info');
    return;
  }
  Speech.stop();
  session = {
    mode, queue, pos: 0, q: null, fb: null, done: false, retries: {},
    answered: 0, correct: 0, ups: [0, 0, 0, 0], wrongIds: [], lastActive: Date.now(), combo: 0, bestCombo: 0,
  };
  updateSession({ q: questionAt(0) });
  go('session');
  onEnterStep();
}

function leaveSession() {
  Speech.stop();
  session = null;
  go('home');
}

// ---------- moving through the queue ----------
function onEnterStep() {
  const step = session && session.queue[session.pos];
  if (!step) return;
  if (step.kind === 'learn') Speech.speak(ITEM_BY_ID.get(step.id).word, store.settings.rate);
  else if (session.q && session.q.type === 'listen') Speech.speak(session.q.speak, store.settings.rate);
  else Speech.stop();
}

function advance() {
  if (!session || session.done) return;
  const pos = session.pos + 1;
  if (pos >= session.queue.length) {
    finishSession();
    return;
  }
  updateSession({ pos, fb: null, q: null });
  updateSession({ q: questionAt(pos) });
  render();
  onEnterStep();
}

function finishSession() {
  if (session.mode === 'boss') {
    const record = { date: Core.todayISO(), score: session.correct, total: session.answered };
    commit((s) => Object.assign({}, s, { boss: [...s.boss, record].slice(-50) }));
  }
  updateSession({ done: true });
  Speech.stop();
  const won = session.answered > 0 && session.correct / session.answered >= 0.8;
  if (session.mode === 'boss') (won ? Sfx.bossWin : Sfx.bossLose)();
  else Sfx.complete();
  go('result');
}

// ---------- answering ----------
function recordAnswer(id, before, after, correct) {
  const today = Core.todayISO();
  const now = Date.now();
  const delta = {
    q: 1, ok: correct ? 1 : 0, ms: Math.min(now - session.lastActive, ACTIVE_CAP_MS),
    fresh: before.seen ? 0 : 1, mined: correct ? 1 : 0,
  };
  commit((s) => Object.assign({}, s, {
    states: Object.assign({}, s.states, { [id]: after }),
    log: Core.addToLog(s.log, today, delta),
  }));
  updateSession({ lastActive: now });
}

/** values === null means "不會，看答案". */
function submitAnswer(values) {
  if (!session || session.fb || !session.q) return;
  const q = session.q;
  const step = session.queue[session.pos];
  const gaveUp = values === null;
  const res = gaveUp
    ? { correct: false, results: Core.answerTexts(q).map(() => false) }
    : Core.checkQuestion(q, values);
  const before = stateOf(q.id);
  const graded = Core.grade(before, res.correct, Core.todayISO());
  // A re-ask right after seeing the answer is too easy to count as "fixed": it stays in the error book.
  const patchState = {};
  if (q.type === 'cloze') patchState.lastEx = q.exIndex;
  if (step.retry && res.correct) patchState.run = 0;
  const after = Object.assign({}, graded, patchState);
  recordAnswer(q.id, before, after, res.correct);
  const ups = session.ups.map((n, lv) => (after.lv > before.lv && lv === after.lv ? n + 1 : n));
  const combo = res.correct ? session.combo + 1 : 0;
  updateSession({
    answered: session.answered + 1, correct: session.correct + (res.correct ? 1 : 0), ups,
    combo, bestCombo: Math.max(session.bestCombo, combo),
  });
  if (res.correct) {
    celebrate(q, before, after);
    advance();
    return;
  }
  handleMistake(q, step, values, gaveUp, before);
}

function handleMistake(q, step, values, gaveUp, before) {
  Sfx.wrong();
  const wrongIds = session.wrongIds.includes(q.id) ? session.wrongIds : [...session.wrongIds, q.id];
  updateSession({ wrongIds, fb: { inputs: values || [], gaveUp, lostLevel: before.seen ? before.lv : 0 } });
  if (session.mode !== 'boss') {
    const count = (session.retries[q.id] || 0) + 1;
    updateSession({
      retries: Object.assign({}, session.retries, { [q.id]: count }),
      queue: Core.insertRetry(session.queue, session.pos, step, count),
    });
  }
  render();
  Speech.speak(spokenAnswer(q), store.settings.rate);
}

function spokenAnswer(q) {
  if (q.type === 'cloze') return Core.stripMarks(q.en);
  if (q.type === 'forms') return q.pp ? `${q.base}, ${q.past[0]}, ${q.pp[0]}` : `${q.base}, ${q.past[0]}`;
  return q.answers[0];
}

/** Sounds for a correct answer; long fanfares give way when the next step speaks a word. */
function playCorrectSounds(up, lv, combo, milestone) {
  const next = session.queue[session.pos + 1];
  const speechNext = Boolean(next && (next.kind === 'learn' || next.qtype === 'listen'));
  if (session.mode === 'boss') Sfx.bossHit();
  if (up) Sfx.ore(lv, speechNext);
  else Sfx.mine(combo);
  if (milestone && !speechNext) setTimeout(() => Sfx.combo(combo), 280);
}

function celebrate(q, before, after) {
  const up = after.lv > before.lv;
  const combo = session.combo;
  const milestone = combo >= COMBO_STEP && combo % COMBO_STEP === 0;
  playCorrectSounds(up, after.lv, combo, milestone);
  const diamond = up && after.lv === Core.MAX_LEVEL;
  let msg = '答對了！';
  if (diamond) msg = '鑽石到手！';
  else if (up) msg = `升級成${Core.LEVEL_NAMES[after.lv]}`;
  const cls = ['toast-body', diamond ? 'is-diamond' : '', milestone ? 'is-combo' : ''].filter(Boolean).join(' ');
  showToast(el('div', { class: cls },
    oreSprite(after, 'toast-ore'),
    el('div', { class: 'toast-text' }, el('b', { lang: 'en' }, Core.displayAnswer(q)), el('span', {}, msg),
      milestone ? el('span', { class: 'toast-combo' }, `🔥 連續答對 ${combo} 題！`) : null)), 'good');
}

// ---------- views ----------
function sessionView() {
  if (!session || session.done) return homeView();
  const step = session.queue[session.pos];
  const it = ITEM_BY_ID.get(step.id);
  let body;
  if (step.kind === 'learn') body = learnCard(it);
  else if (session.fb) body = feedbackCard(it);
  else body = quizCard();
  return el('main', { class: `screen session mode-${session.mode}` },
    sessionBar(), session.mode === 'boss' ? bossBar() : null, body);
}

function sessionBar() {
  const total = session.queue.length;
  const pct = Math.round((session.pos / total) * 100);
  return el('header', { class: 'session-bar' },
    el('button', { class: 'icon-btn', 'aria-label': '先休息，回礦坑（進度已存）', title: '先休息', onclick: leaveSession }, '✕'),
    el('span', { class: 'session-title' }, MODE_LABELS[session.mode]),
    el('div', { class: 'progress', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': total, 'aria-valuenow': session.pos },
      el('span', { style: `width:${pct}%` })),
    session.combo >= COMBO_BADGE_MIN
      ? el('span', { class: 'combo-badge', title: '連續答對', 'aria-label': `連續答對 ${session.combo} 題` }, '🔥', el('b', {}, session.combo))
      : null,
    el('span', { class: 'count' }, `${Math.min(session.pos + 1, total)} / ${total}`));
}

function bossBar() {
  const total = session.queue.length;
  const hp = total - session.correct;
  return el('div', { class: 'boss-bar' },
    sprite('blk-boss', 'boss-icon'),
    el('div', { class: 'hp', 'aria-hidden': 'true' }, el('span', { style: `width:${(hp / total) * 100}%` })),
    el('span', { class: 'hp-num' }, `魔王 HP ${hp} / ${total}`));
}

function speakBtn(text, label, small) {
  if (!Speech.isAvailable()) return null;
  return el('button', {
    type: 'button', class: small ? 'speak speak-sm' : 'speak', 'aria-label': label, title: label,
    onclick: (e) => { e.preventDefault(); e.stopPropagation(); Speech.speak(text, store.settings.rate); },
  }, '🔊');
}

function exampleBlock(x) {
  return el('div', { class: 'example' },
    el('p', { class: 'en', lang: 'en' }, markedText(x.en), ' ', speakBtn(Core.stripMarks(x.en), '唸例句', true)),
    el('p', { class: 'zh' }, markedText(x.zh)));
}

function learnCard(it) {
  return el('section', { class: 'card learn-card' },
    el('span', { class: 'chip chip-new' }, '新字'),
    el('div', { class: 'word-row' }, el('h2', { class: 'word', lang: 'en' }, it.word), speakBtn(it.word, '唸單字')),
    kkText(it.ipa),
    el('p', { class: 'meaning' }, it.meaning),
    it.notes.length ? notesList(it.notes) : null,
    el('div', { class: 'examples' }, it.examples.slice(0, 2).map(exampleBlock)),
    el('button', { class: 'btn btn-primary btn-wide', 'data-autofocus': '', onclick: keyGuard(advance) }, '記住了，下一個 →'));
}

// ---- quiz.js ----
/* Question cards for the four types, and the wrong-answer card (see answer → type it once). */
const isLetter = (ch) => /[A-Za-z]/.test(ch);

function answerInput(opts) {
  return el('input', {
    class: opts.cls ? `answer ${opts.cls}` : 'answer', type: 'text', lang: 'en',
    'aria-label': opts.label, placeholder: opts.placeholder || '', style: opts.style || null,
    autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', enterkeyhint: 'done',
    onkeydown: answerKeydown,
  });
}

/** Enter in a blank that is not the last one jumps to the next blank instead of submitting. */
function answerKeydown(e) {
  if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
  const inputs = [...e.target.form.querySelectorAll('input.answer')];
  const idx = inputs.indexOf(e.target);
  if (idx >= 0 && idx < inputs.length - 1) {
    e.preventDefault();
    inputs[idx + 1].focus();
  }
}

const readInputs = (form) => [...form.querySelectorAll('input.answer')].map((i) => i.value);

/** An empty submit (often a double Enter) is not an answer: nudge instead of marking it wrong. */
function flagIfEmpty(form, values) {
  if (values.some((v) => v.trim())) return false;
  const inputs = [...form.querySelectorAll('input.answer')];
  inputs.forEach((input) => {
    input.classList.remove('nope');
    void input.offsetWidth;
    input.classList.add('nope');
  });
  inputs[0].focus();
  return true;
}

function letterBoxes(word, showLength, showFirst) {
  if (!showLength) {
    return el('div', { class: 'letters' },
      showFirst ? el('span', { class: 'letter given' }, word[0]) : null, el('span', { class: 'letter more' }, '…'));
  }
  const label = showFirst ? `${word.length} 個字母，第一個是 ${word[0]}` : `${word.length} 個字母`;
  return el('div', { class: 'letters', 'aria-label': label }, [...word].map((ch, i) => {
    if (i === 0 && showFirst) return el('span', { class: 'letter given' }, ch);
    return isLetter(ch) ? el('span', { class: 'letter' }) : el('span', { class: 'letter sym' }, ch);
  }));
}

/** Shows typed letters inside the boxes, so a missing or extra letter is easy to see. */
function mirrorIntoBoxes(input, boxes, word) {
  const cells = [...boxes.querySelectorAll('.letter')];
  input.addEventListener('input', () => {
    const typed = input.value.replace(/\s+/g, '');
    cells.forEach((cell, i) => {
      const fixed = i === 0 || !isLetter(word[i]);
      cell.textContent = typed[i] || (fixed ? (i === 0 ? word[0] : word[i]) : '');
      cell.classList.toggle('typed', Boolean(typed[i]));
    });
    boxes.classList.toggle('too-long', typed.length > word.length);
  });
}

function spellBody(q) {
  const word = q.answers[0];
  const boxes = letterBoxes(word, q.showLength, true);
  const input = answerInput({ label: '英文單字' });
  if (q.showLength) mirrorIntoBoxes(input, boxes, word);
  return el('div', { class: 'q-body' },
    el('p', { class: 'q-hint' }, '看中文，拼出完整的英文單字'),
    el('p', { class: 'q-meaning' }, q.meaning),
    q.ipa ? el('p', { class: 'q-kk' }, kkText(q.ipa)) : null,
    boxes,
    input);
}

function listenBody(q) {
  return el('div', { class: 'q-body' },
    el('p', { class: 'q-hint' }, '聽發音，拼出英文單字'),
    el('div', { class: 'listen-row' },
      el('button', { type: 'button', class: 'btn btn-speak', onclick: () => Speech.speak(q.speak, store.settings.rate) }, '🔊 再聽一次'),
      el('button', { type: 'button', class: 'btn btn-ghost', onclick: () => Speech.speak(q.speak, 0.6) }, '慢速')),
    q.showLength ? letterBoxes(q.answers[0], true, false) : null,
    answerInput({ label: '聽到的英文單字' }));
}

function clozeBlank(b, index, showLength) {
  const width = showLength ? Math.max(b.answer.length, 2) : 7;
  return el('span', { class: 'blank' },
    el('span', { class: 'blank-first', 'aria-hidden': 'true' }, b.first),
    answerInput({ cls: 'blank-input', label: `第 ${index + 1} 格，${b.first} 開頭`, style: `width:${width + 0.5}ch` }));
}

function clozeBody(q) {
  const sentence = el('p', { class: 'cloze-sentence', lang: 'en' }, q.parts.map((p) =>
    (p.text !== undefined ? p.text : clozeBlank(q.blanks[p.blank], p.blank, q.showLength))));
  return el('div', { class: 'q-body' },
    el('p', { class: 'q-hint' }, '照中文意思，從第一個字母接著填完綠色的字'),
    sentence,
    el('p', { class: 'cloze-zh' }, markedText(q.zh)));
}

function formsBody(q) {
  return el('div', { class: 'q-body' },
    el('p', { class: 'q-hint' }, q.pp ? '寫出動詞三態' : '寫出助動詞的過去式'),
    el('p', { class: 'forms-base' }, el('b', { lang: 'en' }, q.base), el('span', { class: 'forms-meaning' }, q.meaning)),
    el('div', { class: 'forms-grid' },
      el('label', {}, el('span', {}, '過去式'), answerInput({ label: '過去式' })),
      q.pp ? el('label', {}, el('span', {}, '過去分詞'), answerInput({ label: '過去分詞' })) : null));
}

const BODIES = { spell: spellBody, listen: listenBody, cloze: clozeBody, forms: formsBody };

function quizCard() {
  const q = session.q;
  const form = el('form', {
    class: 'card quiz-card', autocomplete: 'off', novalidate: true,
    onsubmit: (e) => {
      e.preventDefault();
      const values = readInputs(form);
      if (!flagIfEmpty(form, values)) submitAnswer(values);
    },
  },
  el('span', { class: `chip chip-${q.type}` }, TYPE_LABELS[q.type]),
  BODIES[q.type](q),
  el('div', { class: 'quiz-actions' },
    el('button', { type: 'button', class: 'btn btn-ghost', onclick: () => submitAnswer(null) }, '不會，看答案'),
    el('button', { type: 'submit', class: 'btn btn-primary' }, '確定')));
  const first = form.querySelector('input.answer');
  if (first) first.setAttribute('data-autofocus', '');
  return form;
}

// ---------- wrong answer ----------
/** Each target lists the acceptable spellings for one retype box. */
function retypeTargets(q) {
  if (q.type === 'cloze') return q.blanks.map((b) => [b.answer]);
  if (q.type === 'forms') return q.pp ? [q.past, q.pp] : [q.past];
  return [q.answers];
}

function checkRetype(form, targets) {
  const inputs = [...form.querySelectorAll('input.answer')];
  const wrong = inputs.filter((input, i) => !Core.isCorrect(input.value, targets[i]));
  inputs.forEach((input) => input.classList.remove('nope'));
  if (!wrong.length) {
    Sfx.fixed();
    advance();
    return;
  }
  wrong.forEach((input) => {
    void input.offsetWidth; // restart the shake animation
    input.classList.add('nope');
  });
  wrong[0].focus();
}

function feedbackHead(q, fb) {
  let title = '答錯了，明天會再考這個字';
  if (fb.gaveUp) title = '沒關係，記住正確答案';
  else if (fb.lostLevel > 0) title = `答錯了，${Core.LEVEL_NAMES[fb.lostLevel]}變回石頭`;
  return el('div', { class: 'fb-head', role: 'alert' },
    el('span', { class: 'fb-icon', 'aria-hidden': 'true' }, '✗'),
    el('div', {},
      el('b', {}, title),
      el('div', { class: 'fb-answer' }, '正確答案：', el('b', { lang: 'en' }, Core.displayAnswer(q)))));
}

function feedbackInfo(q, it) {
  return el('div', { class: 'fb-info' },
    el('div', { class: 'word-row' }, el('span', { class: 'word', lang: 'en' }, it.word), kkText(it.ipa), speakBtn(it.word, '唸單字')),
    el('p', { class: 'meaning' }, it.meaning),
    q.type === 'cloze' ? exampleBlock({ en: q.en, zh: q.zh }) : null);
}

function feedbackCard(it) {
  const q = session.q;
  const fb = session.fb;
  const yours = !fb.gaveUp && fb.inputs.some((v) => v.trim())
    ? el('p', { class: 'fb-yours' }, '你寫的：', el('s', { lang: 'en' }, fb.inputs.map((v) => v.trim() || '＿').join(' … ')))
    : null;
  if (session.mode === 'boss') {
    return el('section', { class: 'card fb-card' }, feedbackHead(q, fb), yours, feedbackInfo(q, it),
      el('button', { class: 'btn btn-primary btn-wide', 'data-autofocus': '', onclick: keyGuard(advance) }, '下一題 →'));
  }
  const targets = retypeTargets(q);
  const form = el('form', {
    class: 'retype', autocomplete: 'off', novalidate: true,
    onsubmit: (e) => { e.preventDefault(); checkRetype(form, targets); },
  },
  el('p', { class: 'q-hint' }, '照著正確答案打一次，加深印象：'),
  el('div', { class: 'retype-fields' }, targets.map((t, i) => answerInput({ label: `照打第 ${i + 1} 個`, placeholder: t[0] }))),
  el('button', { type: 'submit', class: 'btn btn-primary' }, '打好了 →'));
  form.querySelector('input.answer').setAttribute('data-autofocus', '');
  return el('section', { class: 'card fb-card' }, feedbackHead(q, fb), yours, feedbackInfo(q, it), form);
}

// ---------- result ----------
function bossVerdict(pct) {
  if (pct >= 90) return '完美擊敗魔王！';
  if (pct >= 80) return '擊敗魔王！';
  if (pct >= 60) return '魔王只剩一點血，再挑戰一次！';
  return '魔王太強了，先練錯題本再來';
}

function wordChips(list) {
  return el('div', { class: 'chips' }, list.map((it) =>
    el('button', { class: 'word-chip', lang: 'en', onclick: () => openWord(it.id) }, oreSprite(stateOf(it.id)), it.word)));
}

function resultView() {
  const s = session;
  if (!s) return homeView();
  const pct = s.answered ? Math.round((s.correct / s.answered) * 100) : 0;
  const isBoss = s.mode === 'boss';
  const ups = [1, 2, 3].filter((lv) => s.ups[lv] > 0);
  const wrongItems = s.wrongIds.map((id) => ITEM_BY_ID.get(id)).filter(Boolean);
  const backHome = () => { session = null; go('home'); };
  return el('main', { class: 'screen' }, el('section', { class: 'card result' },
    isBoss ? sprite('blk-boss', 'result-boss') : null,
    el('h1', {}, isBoss ? bossVerdict(pct) : '任務完成！'),
    el('p', { class: 'result-score' }, el('b', {}, isBoss ? `${pct} 分` : `${s.correct} / ${s.answered}`),
      isBoss ? `（答對 ${s.correct} / ${s.answered} 題）` : ` 答對（${pct}%）`),
    ups.length ? el('div', { class: 'result-block' }, el('h2', {}, '這回挖到的礦'),
      el('ul', { class: 'ups' }, ups.map((lv) => el('li', {}, sprite(LEVEL_SPRITES[lv]), `${Core.LEVEL_NAMES[lv]} ×${s.ups[lv]}`)))) : null,
    el('p', {}, `連續練習 ${Core.streakDays(store.log, Core.todayISO())} 天 🔥`),
    s.bestCombo >= COMBO_BADGE_MIN ? el('p', { class: 'best-combo' }, `這回最多連續答對 ${s.bestCombo} 題`) : null,
    wrongItems.length

      el('button', { class: 'btn btn-primary', 'data-autofocus': '', onclick: keyGuard(backHome) }, '回礦坑'))));
}

  const ttsOk = Speech.isAvailable();
  const names = { spell: '拼字', cloze: '例句填空', listen: '聽寫（需要英文語音）', forms: '動詞三態' };
  const flip = (k, on) => {
    const types = Object.assign({}, store.settings.types, { [k]: on });
    if (!Object.values(types).some(Boolean)) types.spell = true;
    setSettings({ types });
    render();
  };
  return el('div', { class: 'checks' }, Object.keys(names).map((k) => el('label', { class: 'check' },
    el('input', { type: 'checkbox', checked: store.settings.types[k], disabled: k === 'listen' && !ttsOk, onchange: (e) => flip(k, e.target.checked) }),
    names[k])));
}

function voiceControls() {
  if (!Speech.isAvailable()) return el('p', { class: 'muted' }, '這台裝置沒有英文語音，發音和聽寫題會關閉。');
  const voices = Speech.voices();
  const rateLabel = el('span', {}, `${store.settings.rate.toFixed(2)} 倍`);
  return el('div', { class: 'voice' },
    field('英文語音', el('select', { onchange: (e) => { setSettings({ voice: e.target.value }); Speech.setPreferred(e.target.value); } },
      el('option', { value: '' }, '自動選擇'),
      voices.map((v) => el('option', { value: v.name, selected: store.settings.voice === v.name }, `${v.name}（${v.lang}）`)))),
    field('語速', el('div', { class: 'rate' },
      el('input', { type: 'range', min: '0.6', max: '1.1', step: '0.05', value: String(store.settings.rate),
        oninput: (e) => { rateLabel.textContent = `${Number(e.target.value).toFixed(2)} 倍`; },
        onchange: (e) => setSettings({ rate: Number(e.target.value) }) }),
      rateLabel)),
    el('button', { type: 'button', class: 'btn btn-dark btn-sm', onclick: () => Speech.speak('Hello! Let us dig for some new words today.', store.settings.rate) }, '🔊 試聽'));
}

function volumeControl() {
  const pct = (v) => `${Math.round(v * 100)}%`;
  const label = el('span', {}, pct(store.settings.volume));
  const tryIt = () => {
    Sfx.correct();
    setTimeout(() => Speech.speak('Great job!', store.settings.rate), 350);
  };
  return el('div', { class: 'voice' },
    field('音量（發音和答題音效）', el('div', { class: 'rate' },
      el('input', { type: 'range', min: '0.1', max: '1', step: '0.05', value: String(store.settings.volume), 'aria-label': '音量',
        oninput: (e) => { label.textContent = pct(Number(e.target.value)); },
        onchange: (e) => { setSettings({ volume: Number(e.target.value) }); applyAudioSettings(); } }),
      label),
    '發音已經是瀏覽器能給的最大音量；還是太小聲的話，請把 iPad 側邊的音量鍵調大。'),
    el('button', { type: 'button', class: 'btn btn-dark btn-sm', onclick: tryIt }, '🔊 試聽音量'));
}

function settingsCard() {
  return el('section', { class: 'card settings' }, el('h2', {}, '設定'),
    field('英文段考日期', el('input', { type: 'date', value: store.settings.examDate,
      onchange: (e) => { if (/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) { setSettings({ examDate: e.target.value }); render(); } } }),
    '倒數和考前衝刺（最後 3 天）會用這個日期。'),
    field('每天新字', newPerDaySelect(), '自動會在考前 4 天前學完全部新字，最後幾天只複習。'),
    el('div', { class: 'field' }, el('span', { class: 'field-label' }, '題型'), typeChecks()),
    voiceControls(),
    volumeControl(),
    el('label', { class: 'check' }, el('input', { type: 'checkbox', checked: store.settings.sound,
      onchange: (e) => { setSettings({ sound: e.target.checked }); Sfx.setEnabled(e.target.checked); } }), '遊戲音效（挖礦、升級、連續答對）'));
}

// ---------- backup ----------
function importPanel() {
  if (!pendingImport) return null;
  const n = Object.keys(pendingImport.states).length;
  const lastDay = Object.keys(pendingImport.log).sort().pop();
  const apply = () => {
    replaceProgress(pendingImport, '匯入');
    pendingImport = null;
    showToast(el('span', {}, '已匯入進度'), 'good');
    render();
  };
  return el('div', { class: 'confirm', role: 'alert' },
    el('p', {}, `這個檔案有 ${n} 個字的紀錄${lastDay ? `，最後練習是 ${fmtDateW(lastDay)}` : ''}。要用它取代這台裝置上的進度嗎？`),
    el('button', { class: 'btn btn-red btn-sm', onclick: apply }, '取代目前進度'),
    el('button', { class: 'btn btn-dark btn-sm', onclick: () => { pendingImport = null; render(); } }, '取消'));
}

function onImportFile(e) {
  readProgressFile(e.target.files[0], VALID_IDS)
    .then((data) => { pendingImport = data; render(); })
    .catch((err) => { showToast(el('span', {}, err.message), 'bad'); });
}

function resetButton() {
  const reset = () => {
    if (!resetArmed) {
      resetArmed = true;
      render();
      setTimeout(() => { if (resetArmed) { resetArmed = false; render(); } }, 5000);
      return;
    }
    resetArmed = false;
    replaceProgress(Object.assign(Core.emptyStore(), { settings: store.settings }), '清除');
    showToast(el('span', {}, '進度已清除'), 'info');
    render();
  };
  return el('button', { class: resetArmed ? 'btn btn-red btn-sm' : 'btn btn-ghost btn-sm', onclick: reset },
    resetArmed ? '再按一次：確定清除全部進度' : '清除全部進度');
}

function undoPanel() {
  const backup = Storage.loadBackup(VALID_IDS);
  if (!backup) return null;
  const undo = () => {
    replaceProgress(backup.store, '復原');
    Storage.clearBackup();
    showToast(el('span', {}, '已復原'), 'good');
    render();
  };
  const seen = Object.keys(backup.store.states).length;
  return el('div', { class: 'confirm' },
    el('p', {}, `${fmtDateW(backup.savedAt)}「${backup.reason}」之前的進度還留著（${seen} 個字的紀錄）。`),
    el('button', { class: 'btn btn-dark btn-sm', onclick: undo }, `復原到「${backup.reason}」之前`),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { Storage.clearBackup(); render(); } }, '不用了'));
}

function backupCard() {
  const fileInput = el('input', { type: 'file', accept: '.json,application/json', class: 'visually-hidden', onchange: onImportFile });
  return el('section', { class: 'card' }, el('h2', {}, '進度備份'),
    el('p', {}, '每答一題就會自動存檔，網頁更新也不會影響進度。進度只存在這台裝置裡：清除瀏覽紀錄、刪掉主畫面圖示或換裝置前，先匯出一個檔案，之後用「匯入」放回來。'),
    el('div', { class: 'row' },
      el('button', { class: 'btn btn-primary btn-sm', onclick: () => downloadProgress(store) }, '匯出進度'),
      el('button', { class: 'btn btn-dark btn-sm', onclick: () => fileInput.click() }, '匯入進度'),
      fileInput, resetButton()),
    importPanel(),
    undoPanel());
}

function parentView() {
  return el('main', { class: 'screen parent' }, backBar('家長'),
    overviewCard(), logCard(), mistakesCard(), bossCard(), settingsCard(), backupCard());
}

// ---------- paper test ----------
let paperTest = null;
const BLANK_LINE = '＿＿＿＿＿＿';

function paperCloze(c) {
  return c.parts.map((p) => (p.text !== undefined ? p.text : `${c.blanks[p.blank].first}${BLANK_LINE}`)).join('');
}

function paperSheet(t) {
  return el('div', { class: 'sheet' },
    el('h1', {}, '常春藤基礎字彙 U4–U7 練習卷'),
    el('p', { class: 'sheet-meta' }, '姓名：＿＿＿＿＿＿　日期：＿＿＿＿＿＿　答對：＿＿＿ / 30'),
    el('h2', {}, '一、單字拼寫（依中文寫出英文單字，第一個字母已給）'),
    el('ol', { class: 'sheet-list' }, t.spell.map((s) => el('li', {}, el('span', {}, s.meaning), el('span', { class: 'ans', lang: 'en' }, `${s.first}${BLANK_LINE}`)))),
    el('h2', {}, '二、例句填空（依中文意思與第一個字母，填入適當的字）'),
    el('ol', { class: 'sheet-list cloze' }, t.cloze.map((c) => el('li', {}, el('p', { lang: 'en' }, paperCloze(c)), el('p', { class: 'zh' }, `（${Core.stripMarks(c.zh)}）`)))),
    el('h2', {}, '三、動詞三態（寫出過去式和過去分詞）'),
    el('ol', { class: 'sheet-list' }, t.forms.map((f) => el('li', {}, el('span', {}, el('b', { lang: 'en' }, f.base), `　${f.meaning}`),
      el('span', { class: 'ans' }, f.pp ? `過去式 ${BLANK_LINE}　過去分詞 ${BLANK_LINE}` : `過去式 ${BLANK_LINE}（助動詞）`)))));
}

function answerKey(t) {
  return el('div', { class: 'sheet answer-key' },
    el('h1', {}, '解答'),
    el('h2', {}, '一、單字拼寫'), el('ol', { class: 'key-list', lang: 'en' }, t.spell.map((s) => el('li', {}, s.word))),
    el('h2', {}, '二、例句填空'), el('ol', { class: 'key-list', lang: 'en' }, t.cloze.map((c) => el('li', {}, Core.displayAnswer(c)))),
    el('h2', {}, '三、動詞三態'), el('ol', { class: 'key-list', lang: 'en' }, t.forms.map((f) => el('li', {},
      f.pp ? `${f.base} – ${f.past.join(' / ')} – ${f.pp.join(' / ')}` : `${f.base} – ${f.past.join(' / ')}`))));
}

function paperView() {
  if (!paperTest) paperTest = Core.buildPaperTest(ITEMS, store.states);
  return el('main', { class: 'screen paper-screen' },
    el('div', { class: 'no-print' }, backBar('紙本測驗'),
      el('div', { class: 'row paper-tools' },
        el('p', {}, '優先出還不熟的字。第二頁是解答，印好後先收起來。'),
        el('button', { class: 'btn btn-dark btn-sm', onclick: () => { paperTest = null; render(); } }, '換一份'),
        el('button', { class: 'btn btn-primary btn-sm', onclick: () => window.print() }, '列印'))),
    el('article', { id: 'paper', class: 'paper' }, paperSheet(paperTest), answerKey(paperTest)));
}

// ---- main.js ----
/* Boot, routing, rendering, and keeping tabs and days in sync. */
const UNIT_IDS = ['04', '05', '06', '07'];
const KEY_GUARD_MS = 450;
const VIEWS = {
  home: homeView, session: sessionView, result: resultView, errors: errorsView, practice: practiceView,
  boss: bossView, bank: bankView, parent: parentView, paper: paperView,
};

// Filled in by startApp() once the vocabulary is available (it may first need unlocking).
let ITEMS = [];
let ITEM_BY_ID = new Map();
let VALID_IDS = new Set();
let TRACKS = [];
let AUDIO_URL = '音檔/{name}.mp3';
let store = null;
let route = 'home';
let lastRenderAt = 0;
let renderedDay = Core.todayISO();

/** change(store) returns the next store. Re-reads first when another tab saved in the meantime. */
function commit(change) {
  const saved = Storage.savedRev();
  if (saved !== null && saved !== store.rev) store = Storage.load(VALID_IDS);
  store = Object.assign({}, change(store), { rev: store.rev + 1 });
  Storage.save(store);
}

function render() {
  const root = document.getElementById('app');
  setChildren(root, (VIEWS[route] || homeView)());
  lastRenderAt = performance.now();
  renderedDay = Core.todayISO();
  const target = root.querySelector('[data-autofocus]');
  if (target && route !== 'home') target.focus();
}

function go(name) {
  route = name;
  render();
  window.scrollTo(0, 0);
}

/** Ignores a keyboard "click" that lands right after a screen change (a double Enter). */
function keyGuard(fn) {
  return (e) => {
    if (e && e.detail === 0 && performance.now() - lastRenderAt < KEY_GUARD_MS) return;
    fn(e);
  };
}

/** Another tab saved, or a new day started while this tab stayed open: show the latest. */
function syncFromStorage() {
  const saved = Storage.savedRev();
  const changed = saved !== null && saved !== store.rev;
  if (changed) store = Storage.load(VALID_IDS);
  const newDay = renderedDay !== Core.todayISO();
  if ((changed || newDay) && route !== 'session') render();
}

function applyAudioSettings() {
  Sfx.setEnabled(store.settings.sound);
  Sfx.setVolume(store.settings.volume);
  Speech.setVolume(store.settings.volume);
}

/** Asks the browser not to evict saved progress when space runs low (silently granted or not). */
function requestPersistentStorage() {
  try {
    if (window.location.protocol === 'https:' && navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => { /* keep best-effort storage */ });
    }
  } catch (e) { /* unsupported */ }
}

function startApp(data) {
  ITEMS = Core.buildItems(data.units);
  ITEM_BY_ID = new Map(ITEMS.map((it) => [it.id, it]));
  VALID_IDS = new Set(ITEMS.map((it) => it.id));
  TRACKS = data.tracks || [];
  AUDIO_URL = data.audioUrl || AUDIO_URL;
  store = Storage.load(VALID_IDS);
  Speech.init(store.settings.voice);
  // Voices load late on some browsers; refresh screens that show speech controls.
  Speech.onChange(() => { if (['parent', 'practice', 'bank'].includes(route)) render(); });
  applyAudioSettings();
  preferPlaybackAudio();
  requestPersistentStorage();
  window.addEventListener('storage', (e) => { if (e.key === STORAGE_KEY) syncFromStorage(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncFromStorage(); });
  window.addEventListener('focus', syncFromStorage);
  if (/[?&]e2e\b/.test(window.location.search)) {
    window.__vocabMine = {
      answers: () => (session && session.q ? Core.answerTexts(session.q) : null),
      step: () => (session ? session.queue[session.pos] : null),
      store: () => store,
      sync: syncFromStorage,
    };
  }
  render();
}

function boot() {
  installSprites();
  if (window.VOCAB_LOCKED) unlock(window.VOCAB_LOCKED).then(startApp);
  else startApp({ units: window.VOCAB_DATA, tracks: window.VOCAB_TRACKS, audioUrl: window.VOCAB_AUDIO_URL });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
