// ---- session.js ----
/* Practice sessions: learn cards, questions, wrong-answer feedback and results. */
const BOSS_SIZE = 30;
const EXTRA_NEW = 10;
const ERROR_SESSION_MAX = 30;
const ACTIVE_CAP_MS = 90 * 1000;
const MODE_LABELS = {
  mission: '今日任務', extra: '多學新字', errors: '錯題本', practice: '自由練習', boss: '魔王關', redo: '重練答錯的字',
};
const TYPE_LABELS = { spell: '拼字', cloze: '例句填空', listen: '聽寫', forms: '動詞三態' };
const ALL_TYPES_ON = { types: { spell: true, cloze: true, listen: true, forms: true } };
const COMBO_STEP = 5;      // fanfare every 5 answers in a row
const COMBO_BADGE_MIN = 3; // show the 🔥 counter from 3 in a row

let session = null;
const updateSession = (patch) => { session = Object.assign({}, session, patch); };
const stateOf = (id) => Core.getState(store.states, id);
const emptyLog = () => ({ q: 0, ok: 0, ms: 0, fresh: 0, mined: 0 });
const todayLog = () => store.log[Core.todayISO()] || emptyLog();

// ---------- building a session ----------
/** mix: give stone words varied question types too (error book, boss, practice). */
function typePicker(mix) {
  const ttsOk = Speech.isAvailable();
  return (it) => {
    const st = stateOf(it.id);
    return Core.pickType(it, mix && st.lv === 0 ? Object.assign({}, st, { lv: 1 }) : st, store.settings, ttsOk);
  };
}

function fixedType(type) {
  const ttsOk = Speech.isAvailable();
  return (it) => (Core.availableTypes(it, ALL_TYPES_ON, ttsOk).includes(type) ? type : 'spell');
}

function queueFor(mode, opts) {
  if (mode === 'mission') {
    const m = Core.buildMission(SCOPE_ITEMS, store.states, Core.todayISO(), store.settings, todayLog().fresh);
    return Core.buildQueue(m.reviews, m.fresh, typePicker(false));
  }
  if (mode === 'extra') {
    return Core.buildQueue([], SCOPE_ITEMS.filter((it) => !stateOf(it.id).seen).slice(0, EXTRA_NEW), typePicker(false));
  }
  if (mode === 'errors') {
    return Core.buildQueue(Core.errorBook(SCOPE_ITEMS, store.states).slice(0, ERROR_SESSION_MAX), [], typePicker(true));
  }
  if (mode === 'redo') {
    return Core.buildQueue(opts.ids.map((id) => ITEM_BY_ID.get(id)).filter(Boolean), [], typePicker(true));
  }
  if (mode === 'practice') {
    const filter = opts.type === 'forms' ? (it) => Boolean(it.forms) : () => true;
    const sel = Core.selectPractice(ITEMS, store.states, opts.units, opts.count, Math.random, filter);
    if (opts.type === 'mix') return Core.buildQueue(sel.review, sel.fresh, typePicker(true));
    return Core.buildQueue(sel.review, sel.fresh, fixedType(opts.type), Math.random, fixedType(opts.type));
  }
  if (mode === 'boss') {
    const pickBoss = typePicker(true);
    return Core.selectBoss(SCOPE_ITEMS, store.states, BOSS_SIZE).map((it) => ({ kind: 'quiz', id: it.id, qtype: pickBoss(it) }));
  }
  return [];
}

function questionAt(pos) {
  const step = session.queue[pos];
  if (!step || step.kind !== 'quiz') return null;
  const it = ITEM_BY_ID.get(step.id);
  return Core.makeQuestion(it, step.qtype, stateOf(it.id), Math.random, session.mode === 'boss');
}

function startSession(mode, opts) {
  const queue = queueFor(mode, opts || {});
  if (!queue.length) {
    showToast(el('span', {}, '目前沒有要練的字'), 'info');
    return;
  }
  Speech.stop();
  session = {
    mode, queue, pos: 0, q: null, fb: null, done: false, retries: {}, results: {}, view: null,
    answered: 0, correct: 0, ups: [0, 0, 0, 0], wrongIds: [], lastActive: Date.now(), combo: 0, bestCombo: 0,
  };
  updateSession({ q: questionAt(0) });
  prefetchClips();
  saveSessionSnapshot();
  go('session');
  onEnterStep();
}

/** Load the pronunciations of the words still ahead, so each card speaks without a delay. */
function prefetchClips() {
  const ahead = session.queue.slice(session.pos).map((s) => ITEM_BY_ID.get(s.id)).filter(Boolean);
  Pron.prefetch(ahead.map((it) => it.word));
}

function leaveSession() {
  Speech.stop();
  session = null;
  go('home');
}

// ---------- moving through the queue ----------
function onEnterStep() {
  const step = session && session.queue[session.pos];
  if (!step) return;
  if (step.kind === 'learn') Speech.speak(ITEM_BY_ID.get(step.id).word, store.settings.rate);
  else if (session.q && session.q.type === 'listen') Speech.speak(session.q.speak, store.settings.rate);
  else Speech.stop();
}

function advance() {
  if (!session || session.done) return;
  const pos = session.pos + 1;
  if (pos >= session.queue.length) {
    finishSession();
    return;
  }
  updateSession({ pos, fb: null, q: null, view: null });
  updateSession({ q: questionAt(pos) });
  saveSessionSnapshot();
  render();
  onEnterStep();
}

function finishSession() {
  if (session.mode === 'boss') {
    const record = { date: Core.todayISO(), score: session.correct, total: session.answered };
    commit((s) => Object.assign({}, s, { boss: [...s.boss, record].slice(-50) }));
  }
  updateSession({ done: true });
  saveSessionSnapshot();
  Speech.stop();
  const won = session.answered > 0 && session.correct / session.answered >= 0.8;
  if (session.mode === 'boss') (won ? Sfx.bossWin : Sfx.bossLose)();
  else Sfx.complete();
  go('result');
}

// ---------- answering ----------
function recordAnswer(id, before, after, correct) {
  const today = Core.todayISO();
  const now = Date.now();
  const delta = {
    q: 1, ok: correct ? 1 : 0, ms: Math.min(now - session.lastActive, ACTIVE_CAP_MS),
    fresh: before.seen ? 0 : 1, mined: correct ? 1 : 0,
  };
  commit((s) => Object.assign({}, s, {
    states: Object.assign({}, s.states, { [id]: after }),
    log: Core.addToLog(s.log, today, delta),
  }));
  updateSession({ lastActive: now });
}

/** values === null means "不會，看答案". */
function submitAnswer(values) {
  if (!session || session.fb || !session.q) return;
  const q = session.q;
  const step = session.queue[session.pos];
  const gaveUp = values === null;
  const res = gaveUp
    ? { correct: false, results: Core.answerTexts(q).map(() => false) }
    : Core.checkQuestion(q, values);
  const before = stateOf(q.id);
  const graded = Core.grade(before, res.correct, Core.todayISO());
  // A re-ask right after seeing the answer is too easy to count as "fixed": it stays in the error book.
  const patchState = {};
  if (q.type === 'cloze') patchState.lastEx = q.exIndex;
  if (step.retry && res.correct) patchState.run = 0;
  const after = Object.assign({}, graded, patchState);
  recordAnswer(q.id, before, after, res.correct);
  updateSession({ results: Object.assign({}, session.results, { [session.pos]: resultRecord(q, res.correct, gaveUp, values) }) });
  const ups = session.ups.map((n, lv) => (after.lv > before.lv && lv === after.lv ? n + 1 : n));
  const combo = res.correct ? session.combo + 1 : 0;
  updateSession({
    answered: session.answered + 1, correct: session.correct + (res.correct ? 1 : 0), ups,
    combo, bestCombo: Math.max(session.bestCombo, combo),
  });
  if (res.correct) {
    celebrate(q, before, after);
    advance();
    return;
  }
  handleMistake(q, step, values, gaveUp, before);
}

function handleMistake(q, step, values, gaveUp, before) {
  Sfx.wrong();
  const wrongIds = session.wrongIds.includes(q.id) ? session.wrongIds : [...session.wrongIds, q.id];
  updateSession({ wrongIds, fb: { inputs: values || [], gaveUp, lostLevel: before.seen ? before.lv : 0 } });
  if (session.mode !== 'boss') {
    const count = (session.retries[q.id] || 0) + 1;
    updateSession({
      retries: Object.assign({}, session.retries, { [q.id]: count }),
      queue: Core.insertRetry(session.queue, session.pos, step, count),
    });
  }
  saveSessionSnapshot();
  render();
  Speech.speak(spokenAnswer(q), store.settings.rate);
}

function spokenAnswer(q) {
  if (q.type === 'cloze') return Core.stripMarks(q.en);
  if (q.type === 'forms') return q.pp ? `${q.base}, ${q.past[0]}, ${q.pp[0]}` : `${q.base}, ${q.past[0]}`;
  return q.answers[0];
}

/** Sounds for a correct answer; long fanfares give way when the next step speaks a word. */
function playCorrectSounds(up, lv, combo, milestone) {
  const next = session.queue[session.pos + 1];
  const speechNext = Boolean(next && (next.kind === 'learn' || next.qtype === 'listen'));
  if (session.mode === 'boss') Sfx.bossHit();
  if (up) Sfx.ore(lv, speechNext);
  else Sfx.mine(combo);
  if (milestone && !speechNext) setTimeout(() => Sfx.combo(combo), 280);
}

function celebrate(q, before, after) {
  const up = after.lv > before.lv;
  const combo = session.combo;
  const milestone = combo >= COMBO_STEP && combo % COMBO_STEP === 0;
  playCorrectSounds(up, after.lv, combo, milestone);
  const diamond = up && after.lv === Core.MAX_LEVEL;
  let msg = '答對了！';
  if (diamond) msg = '鑽石到手！';
  else if (up) msg = `升級成${Core.LEVEL_NAMES[after.lv]}`;
  const cls = ['toast-body', diamond ? 'is-diamond' : '', milestone ? 'is-combo' : ''].filter(Boolean).join(' ');
  showToast(el('div', { class: cls },
    oreSprite(after, 'toast-ore'),
    el('div', { class: 'toast-text' }, el('b', { lang: 'en' }, Core.displayAnswer(q)), el('span', {}, msg),
      milestone ? el('span', { class: 'toast-combo' }, `🔥 連續答對 ${combo} 題！`) : null)), 'good');
}

// ---------- views ----------
function sessionView() {
  if (!session || session.done) return homeView();
  const step = session.queue[session.pos];
  const it = ITEM_BY_ID.get(step.id);
  let body;
  if (isReviewing()) body = reviewCard();
  else if (step.kind === 'learn') body = learnCard(it);
  else if (session.fb) body = feedbackCard(it);
  else body = quizCard();
  return el('main', { class: `screen session mode-${session.mode}` },
    sessionBar(), session.mode === 'boss' ? bossBar() : null, body);
}

function sessionBar() {
  const total = session.queue.length;
  const pct = Math.round((session.pos / total) * 100);
  return el('header', { class: 'session-bar' },
    el('button', { class: 'icon-btn', 'aria-label': '先休息，回礦坑（進度已存）', title: '先休息', onclick: leaveSession }, '✕'),
    el('span', { class: 'session-title' }, MODE_LABELS[session.mode]),
    el('div', { class: 'progress', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': total, 'aria-valuenow': session.pos },
      el('span', { style: `width:${pct}%` })),
    session.combo >= COMBO_BADGE_MIN
      ? el('span', { class: 'combo-badge', title: '連續答對', 'aria-label': `連續答對 ${session.combo} 題` }, '🔥', el('b', {}, session.combo))
      : null,
    el('span', { class: 'count' }, isReviewing()
      ? `回顧 ${session.view + 1} / ${total}`
      : `${Math.min(session.pos + 1, total)} / ${total}`));
}

function bossBar() {
  const total = session.queue.length;
  const hp = total - session.correct;
  return el('div', { class: 'boss-bar' },
    sprite('blk-boss', 'boss-icon'),
    el('div', { class: 'hp', 'aria-hidden': 'true' }, el('span', { style: `width:${(hp / total) * 100}%` })),
    el('span', { class: 'hp-num' }, `魔王 HP ${hp} / ${total}`));
}

function speakBtn(text, label, small) {
  if (!Speech.isAvailable()) return null;
  return el('button', {
    type: 'button', class: small ? 'speak speak-sm' : 'speak', 'aria-label': label, title: label,
    onclick: (e) => { e.preventDefault(); e.stopPropagation(); Speech.speak(text, store.settings.rate); },
  }, '🔊');
}

function exampleBlock(x) {
  return el('div', { class: 'example' },
    el('p', { class: 'en', lang: 'en' }, markedText(x.en), ' ', speakBtn(Core.stripMarks(x.en), '唸例句', true)),
    el('p', { class: 'zh' }, markedText(x.zh)));
}

/** reviewFooter: the back/forward buttons when looking at a card from earlier in the session. */
function learnCard(it, reviewFooter) {
  const footer = reviewFooter || el('div', { class: 'learn-nav' },
    backButton(),
    el('button', { class: 'btn btn-primary', 'data-autofocus': '', onclick: keyGuard(advance) }, '記住了，下一個 →'));
  return el('section', { class: 'card learn-card' },
    el('span', { class: reviewFooter ? 'chip chip-review' : 'chip chip-new' }, reviewFooter ? '回顧：新字' : '新字'),
    el('div', { class: 'word-row' }, el('h2', { class: 'word', lang: 'en' }, it.word), speakBtn(it.word, '唸單字')),
    kkText(it.ipa),
    el('p', { class: 'meaning' }, it.meaning),
    it.notes.length ? notesList(it.notes) : null,
    el('div', { class: 'examples' }, it.examples.slice(0, 2).map(exampleBlock)),
    footer);
}

// ---- session-nav.js ----
/* Today's mission and 「多學新字」 survive closing the app (saved after every step),
 * and a session can step back to look at earlier cards, or skip a question for later. */
const SESSION_KEY = `${STORAGE_KEY}:session`;
const SAVED_MODES = Core.RESUMABLE_MODES;
const RESUME_TEXT = {
  mission: { title: '今日任務做到一半', go: '繼續挖礦', other: '重新排今天的任務' },
  extra: { title: '多學新字做到一半', go: '繼續學新字', other: '這一輪先不做' },
};

function saveSessionSnapshot() {
  if (!session || !SAVED_MODES.includes(session.mode)) return;
  if (session.done) {
    clearSavedSession();
    return;
  }
  const snap = {
    v: 1, day: Core.todayISO(), mode: session.mode, queue: session.queue, pos: session.pos, q: session.q, fb: session.fb,
    results: session.results, retries: session.retries, ups: session.ups, answered: session.answered,
    correct: session.correct, wrongIds: session.wrongIds, combo: session.combo, bestCombo: session.bestCombo,
  };
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify(snap));
  } catch (e) { /* each answer is still saved per word; only the place in the queue is lost */ }
}

function clearSavedSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* nothing saved */ }
}

function loadSavedSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? Core.sanitizeSavedSession(JSON.parse(raw), SCOPE_IDS, Core.todayISO()) : null;
  } catch (e) {
    return null;
  }
}

function resumeSession() {
  const saved = loadSavedSession();
  if (!saved) {
    startSession('mission');
    return;
  }
  Speech.stop();
  session = Object.assign({ done: false, view: null, lastActive: Date.now() }, saved);
  if (!session.q && session.queue[session.pos].kind === 'quiz') updateSession({ q: questionAt(session.pos) });
  prefetchClips();
  go('session');
  if (!session.fb) onEnterStep();
}

function restartMission() {
  clearSavedSession();
  startSession('mission');
}

/** Leaves a half-done 「多學新字」 round; home offers a fresh round again. */
function dropSavedRound() {
  clearSavedSession();
  render();
}

// ---------- stepping back and forth ----------
const isReviewing = () => Boolean(session) && session.view !== null && session.view !== undefined;

function stepBack() {
  if (!session || session.fb) return;
  const from = isReviewing() ? session.view : session.pos;
  if (from <= 0) return;
  Speech.stop();
  updateSession({ view: from - 1 });
  render();
}

function stepForward() {
  if (!isReviewing()) return;
  const next = session.view + 1;
  updateSession({ view: next >= session.pos ? null : next });
  render();
}

function skipQuestion() {
  if (!session || session.fb || isReviewing() || !Core.canSkipStep(session.queue, session.pos)) return;
  updateSession({ queue: Core.skipStep(session.queue, session.pos) });
  updateSession({ q: questionAt(session.pos) });
  saveSessionSnapshot();
  render();
  onEnterStep();
}

/** What the review screen shows for a question that was already answered. */
function resultRecord(q, correct, gaveUp, values) {
  return {
    correct, gaveUp, type: q.type, answer: Core.displayAnswer(q),
    given: (values || []).map((v) => v.trim()).filter(Boolean).join(' … '),
    en: q.type === 'cloze' ? q.en : '', zh: q.type === 'cloze' ? q.zh : '',
  };
}

function backButton() {
  const from = isReviewing() ? session.view : session.pos;
  if (from <= 0 || session.fb) return null;
  return el('button', { type: 'button', class: 'btn btn-ghost btn-nav', onclick: keyGuard(stepBack) }, '← 上一步');
}

function skipButton() {
  if (!Core.canSkipStep(session.queue, session.pos)) return null;
  return el('button', { type: 'button', class: 'btn btn-ghost', title: '這題放到最後再做', onclick: skipQuestion }, '先跳過');
}

function reviewNav(index) {
  const backToNow = index + 1 >= session.pos;
  return el('div', { class: 'review-nav' },
    backButton(),
    el('button', { type: 'button', class: 'btn btn-primary', 'data-autofocus': '', onclick: keyGuard(stepForward) },
      backToNow ? '回到現在這題 →' : '下一步 →'));
}

function reviewBadge(r) {
  if (r.correct) return el('p', { class: 'review-badge good' }, '✓ 這題答對了');
  return el('p', { class: 'review-badge bad' }, r.gaveUp ? '這題按了「不會」' : '✗ 這題答錯了');
}

function reviewCard() {
  const index = session.view;
  const step = session.queue[index];
  const it = ITEM_BY_ID.get(step.id);
  if (step.kind === 'learn') return learnCard(it, reviewNav(index));
  const r = session.results[index];
  return el('section', { class: 'card review-card' },
    el('span', { class: 'chip chip-review' }, `回顧第 ${index + 1} 步`),
    r ? reviewBadge(r) : null,
    el('div', { class: 'word-row' }, el('h2', { class: 'word', lang: 'en' }, it.word), speakBtn(it.word, '唸單字')),
    kkText(it.ipa),
    el('p', { class: 'meaning' }, it.meaning),
    r ? el('p', { class: 'review-answer' }, '正確答案：', el('b', { lang: 'en' }, r.answer)) : null,
    r && !r.correct && r.given ? el('p', { class: 'fb-yours' }, '你寫的：', el('s', { lang: 'en' }, r.given)) : null,
    r && r.en ? exampleBlock({ en: r.en, zh: r.zh }) : null,
    reviewNav(index));
}

// ---------- home: pick up today's mission or a 「多學新字」 round ----------
function resumeMissionCard(saved) {
  const text = RESUME_TEXT[saved.mode] || RESUME_TEXT.mission;
  const total = saved.queue.length;
  const pct = Math.round((saved.pos / total) * 100);
  return el('section', { class: 'card mission resume' },
    el('div', { class: 'mission-ores', 'aria-hidden': 'true' }, sprite('blk-iron'), sprite('blk-gold'), sprite('blk-diamond')),
    el('div', { class: 'mission-text' },
      el('h2', {}, text.title),
      el('p', { class: 'mission-meta' }, `已完成 ${saved.pos} / ${total} 步，還剩 ${total - saved.pos} 步`),
      el('div', { class: 'progress mission-progress', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': total, 'aria-valuenow': saved.pos },
        el('span', { style: `width:${pct}%` }))),
    el('div', { class: 'mission-cta' },
      el('button', { class: 'btn btn-primary btn-big', 'data-autofocus': '', onclick: resumeSession }, text.go),
      el('button', { class: 'btn btn-ghost btn-sm', onclick: saved.mode === 'extra' ? dropSavedRound : restartMission }, text.other)));
}

// ---- quiz.js ----
/* Question cards for the four types, and the wrong-answer card (see answer → type it once). */
const isLetter = (ch) => /[A-Za-z]/.test(ch);

function answerInput(opts) {
  return el('input', {
    class: opts.cls ? `answer ${opts.cls}` : 'answer', type: 'text', lang: 'en',
    'aria-label': opts.label, placeholder: opts.placeholder || '', style: opts.style || null,
    autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', enterkeyhint: 'done',
    onkeydown: answerKeydown,
  });
}

/** Enter in a blank that is not the last one jumps to the next blank instead of submitting. */
function answerKeydown(e) {
  if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
  const inputs = [...e.target.form.querySelectorAll('input.answer')];
  const idx = inputs.indexOf(e.target);
  if (idx >= 0 && idx < inputs.length - 1) {
    e.preventDefault();
    inputs[idx + 1].focus();
  }
}

const readInputs = (form) => [...form.querySelectorAll('input.answer')].map((i) => i.value);

/** An empty submit (often a double Enter) is not an answer: nudge instead of marking it wrong. */
function flagIfEmpty(form, values) {
  if (values.some((v) => v.trim())) return false;
  const inputs = [...form.querySelectorAll('input.answer')];
  inputs.forEach((input) => {
    input.classList.remove('nope');
    void input.offsetWidth;
    input.classList.add('nope');
  });
  inputs[0].focus();
  return true;
}

function letterBoxes(word, showLength, showFirst) {
  if (!showLength) {
    return el('div', { class: 'letters' },
      showFirst ? el('span', { class: 'letter given' }, word[0]) : null, el('span', { class: 'letter more' }, '…'));
  }
  const label = showFirst ? `${word.length} 個字母，第一個是 ${word[0]}` : `${word.length} 個字母`;
  return el('div', { class: 'letters', 'aria-label': label }, [...word].map((ch, i) => {
    if (i === 0 && showFirst) return el('span', { class: 'letter given' }, ch);
    return isLetter(ch) ? el('span', { class: 'letter' }) : el('span', { class: 'letter sym' }, ch);
  }));
}

/** Shows typed letters inside the boxes, so a missing or extra letter is easy to see. */
function mirrorIntoBoxes(input, boxes, word) {
  const cells = [...boxes.querySelectorAll('.letter')];
  input.addEventListener('input', () => {
    const typed = input.value.replace(/\s+/g, '');
    cells.forEach((cell, i) => {
      const fixed = i === 0 || !isLetter(word[i]);
      cell.textContent = typed[i] || (fixed ? (i === 0 ? word[0] : word[i]) : '');
      cell.classList.toggle('typed', Boolean(typed[i]));
    });
    boxes.classList.toggle('too-long', typed.length > word.length);
  });
}

function spellBody(q) {
  const word = q.answers[0];
  const boxes = letterBoxes(word, q.showLength, true);
  const input = answerInput({ label: '英文單字' });
  if (q.showLength) mirrorIntoBoxes(input, boxes, word);
  return el('div', { class: 'q-body' },
    el('p', { class: 'q-hint' }, '看中文，拼出完整的英文單字'),
    el('p', { class: 'q-meaning' }, q.meaning),
    q.ipa ? el('p', { class: 'q-kk' }, kkText(q.ipa)) : null,
    boxes,
    input);
}

function listenBody(q) {
  return el('div', { class: 'q-body' },
    el('p', { class: 'q-hint' }, '聽發音，拼出英文單字'),
    el('div', { class: 'listen-row' },
      el('button', { type: 'button', class: 'btn btn-speak', onclick: () => Speech.speak(q.speak, store.settings.rate) }, '🔊 再聽一次'),
      el('button', { type: 'button', class: 'btn btn-ghost', onclick: () => Speech.speak(q.speak, 0.6) }, '慢速')),
    q.showLength ? letterBoxes(q.answers[0], true, false) : null,
    answerInput({ label: '聽到的英文單字' }));
}

function clozeBlank(b, index, showLength) {
  const width = showLength ? Math.max(b.answer.length, 2) : 7;
  return el('span', { class: 'blank' },
    el('span', { class: 'blank-first', 'aria-hidden': 'true' }, b.first),
    answerInput({ cls: 'blank-input', label: `第 ${index + 1} 格，${b.first} 開頭`, style: `width:${width + 0.5}ch` }));
}

function clozeBody(q) {
  const sentence = el('p', { class: 'cloze-sentence', lang: 'en' }, q.parts.map((p) =>
    (p.text !== undefined ? p.text : clozeBlank(q.blanks[p.blank], p.blank, q.showLength))));
  return el('div', { class: 'q-body' },
    el('p', { class: 'q-hint' }, '照中文意思，從第一個字母接著填完綠色的字'),
    sentence,
    el('p', { class: 'cloze-zh' }, markedText(q.zh)));
}

function formsBody(q) {
  return el('div', { class: 'q-body' },
    el('p', { class: 'q-hint' }, q.pp ? '寫出動詞三態' : '寫出助動詞的過去式'),
    el('p', { class: 'forms-base' }, el('b', { lang: 'en' }, q.base), el('span', { class: 'forms-meaning' }, q.meaning)),
    el('div', { class: 'forms-grid' },
      el('label', {}, el('span', {}, '過去式'), answerInput({ label: '過去式' })),
      q.pp ? el('label', {}, el('span', {}, '過去分詞'), answerInput({ label: '過去分詞' })) : null));
}

const BODIES = { spell: spellBody, listen: listenBody, cloze: clozeBody, forms: formsBody };

function quizCard() {
  const q = session.q;
  const form = el('form', {
    class: 'card quiz-card', autocomplete: 'off', novalidate: true,
    onsubmit: (e) => {
      e.preventDefault();
      const values = readInputs(form);
      if (!flagIfEmpty(form, values)) submitAnswer(values);
    },
  },
  el('span', { class: `chip chip-${q.type}` }, TYPE_LABELS[q.type]),
  BODIES[q.type](q),
  el('div', { class: 'quiz-actions' },
    backButton(),
    skipButton(),
    el('button', { type: 'button', class: 'btn btn-ghost', onclick: () => submitAnswer(null) }, '不會，看答案'),
    el('button', { type: 'submit', class: 'btn btn-primary' }, '確定')));
  const first = form.querySelector('input.answer');
  if (first) first.setAttribute('data-autofocus', '');
  return form;
}

// ---------- wrong answer ----------
/** Each target lists the acceptable spellings for one retype box. */
function retypeTargets(q) {
  if (q.type === 'cloze') return q.blanks.map((b) => [b.answer]);
  if (q.type === 'forms') return q.pp ? [q.past, q.pp] : [q.past];
  return [q.answers];
}

function checkRetype(form, targets) {
  const inputs = [...form.querySelectorAll('input.answer')];
  const wrong = inputs.filter((input, i) => !Core.isCorrect(input.value, targets[i]));
  inputs.forEach((input) => input.classList.remove('nope'));
  if (!wrong.length) {
    Sfx.fixed();
    advance();
    return;
  }
  wrong.forEach((input) => {
    void input.offsetWidth; // restart the shake animation
    input.classList.add('nope');
  });
  wrong[0].focus();
}

function feedbackHead(q, fb) {
  let title = '答錯了，明天會再考這個字';
  if (fb.gaveUp) title = '沒關係，記住正確答案';
  else if (fb.lostLevel > 0) title = `答錯了，${Core.LEVEL_NAMES[fb.lostLevel]}變回石頭`;
  return el('div', { class: 'fb-head', role: 'alert' },
    el('span', { class: 'fb-icon', 'aria-hidden': 'true' }, '✗'),
    el('div', {},
      el('b', {}, title),
      el('div', { class: 'fb-answer' }, '正確答案：', el('b', { lang: 'en' }, Core.displayAnswer(q)))));
}

function feedbackInfo(q, it) {
  return el('div', { class: 'fb-info' },
    el('div', { class: 'word-row' }, el('span', { class: 'word', lang: 'en' }, it.word), kkText(it.ipa), speakBtn(it.word, '唸單字')),
    el('p', { class: 'meaning' }, it.meaning),
    q.type === 'cloze' ? exampleBlock({ en: q.en, zh: q.zh }) : null);
}

function feedbackCard(it) {
  const q = session.q;
  const fb = session.fb;
  const yours = !fb.gaveUp && fb.inputs.some((v) => v.trim())
    ? el('p', { class: 'fb-yours' }, '你寫的：', el('s', { lang: 'en' }, fb.inputs.map((v) => v.trim() || '＿').join(' … ')))
    : null;
  if (session.mode === 'boss') {
    return el('section', { class: 'card fb-card' }, feedbackHead(q, fb), yours, feedbackInfo(q, it),
      el('button', { class: 'btn btn-primary btn-wide', 'data-autofocus': '', onclick: keyGuard(advance) }, '下一題 →'));
  }
  const targets = retypeTargets(q);
  const form = el('form', {
    class: 'retype', autocomplete: 'off', novalidate: true,
    onsubmit: (e) => { e.preventDefault(); checkRetype(form, targets); },
  },
  el('p', { class: 'q-hint' }, '照著正確答案打一次，加深印象：'),

// ---------- result ----------
function bossVerdict(pct) {
  if (pct >= 90) return '完美擊敗魔王！';
  if (pct >= 80) return '擊敗魔王！';
  if (pct >= 60) return '魔王只剩一點血，再挑戰一次！';
  return '魔王太強了，先練錯題本再來';
}

function wordChips(list) {
  return el('div', { class: 'chips' }, list.map((it) =>
    el('button', { class: 'word-chip', lang: 'en', onclick: () => openWord(it.id) }, oreSprite(stateOf(it.id)), it.word)));
}

function resultView() {
  const s = session;
  if (!s) return homeView();
  const pct = s.answered ? Math.round((s.correct / s.answered) * 100) : 0;
  const isBoss = s.mode === 'boss';
  const ups = [1, 2, 3].filter((lv) => s.ups[lv] > 0);
  const wrongItems = s.wrongIds.map((id) => ITEM_BY_ID.get(id)).filter(Boolean);
  const backHome = () => { session = null; go('home'); };
  return el('main', { class: 'screen' }, el('section', { class: 'card result' },
    isBoss ? sprite('blk-boss', 'result-boss') : null,
    el('h1', {}, isBoss ? bossVerdict(pct) : '任務完成！'),
    el('p', { class: 'result-score' }, el('b', {}, isBoss ? `${pct} 分` : `${s.correct} / ${s.answered}`),
      isBoss ? `（答對 ${s.correct} / ${s.answered} 題）` : ` 答對（${pct}%）`),
    ups.length ? el('div', { class: 'result-block' }, el('h2', {}, '這回挖到的礦'),
      el('ul', { class: 'ups' }, ups.map((lv) => el('li', {}, sprite(LEVEL_SPRITES[lv]), `${Core.LEVEL_NAMES[lv]} ×${s.ups[lv]}`)))) : null,
    el('p', {}, `連續練習 ${Core.streakDays(store.log, Core.todayISO())} 天 🔥`),
    s.bestCombo >= COMBO_BADGE_MIN ? el('p', { class: 'best-combo' }, `這回最多連續答對 ${s.bestCombo} 題`) : null,
    wrongItems.length
      ? el('div', { class: 'result-block' }, el('h2', {}, '這回答錯的字'), wordChips(wrongItems))
      : el('p', { class: 'all-right' }, '全部答對，太強了！'),

      wrongItems.length ? el('button', { class: 'btn btn-gold', onclick: keyGuard(() => startSession('redo', { ids: s.wrongIds })) }, '再練一次答錯的字') : null,
      el('button', { class: 'btn btn-primary', 'data-autofocus': '', onclick: keyGuard(backHome) }, '回礦坑'))));
}

function wordList(list) {

  if (!st.seen) return '還沒學';
  const due = st.due ? ` · 下次複習 ${fmtDate(st.due)}` : '';
  return `${Core.LEVEL_NAMES[st.lv]} · 答對 ${st.ok} 次、答錯 ${st.ng} 次${due}`;

function trackPlayer(name) {
  const src = AUDIO_URL.split('{name}').join(name);
  const remote = /^https?:/.test(src);
  const audio = el('audio', { controls: true, preload: 'none', src });
  audio.addEventListener('error', () => {
    audio.replaceWith(el('span', { class: 'muted' }, remote
      ? '音檔載入失敗，請確認有連上網路再試一次。'
      : '找不到音檔（「音檔」資料夾要放在這個檔案旁邊）'));
  });
  return el('div', { class: 'track' }, el('span', { class: 'track-name' }, name), audio);
}

function openWord(id) {
  const it = ITEM_BY_ID.get(id);
  Pron.prefetch([it.word]);
  const st = stateOf(id);
  const tracks = Core.tracksFor(TRACKS, it.unit, it.parentNo);
  openModal(el('div', { class: 'word-detail' },
    el('div', { class: 'detail-head' }, oreSprite(st, 'detail-ore'),
      el('div', {}, el('h2', { class: 'word', lang: 'en' }, it.word), kkText(it.ipa)), speakBtn(it.word, '唸單字')),
    el('p', { class: 'meaning' }, it.meaning),
    el('p', { class: 'detail-status' }, `${statusText(st)} · 課本 p.${it.page}`),
    it.notes.length ? notesList(it.notes) : null,

// ---- exam.js ----
/* 模擬考卷 and 類似題練習: a paper one question a screen. A mistake shows the right answer and why at once;
 * a round in progress is saved after every answer (own key, beside the progress). 類似題練習 is done one
 * part at a time, each part with its own saved round; a translation is checked against the model answers,
 * and the child marks it when what they wrote differs. */
const EXAM_WIN_POINTS = 80;
const EXAM_HISTORY_SHOWN = 8;
const EXAM_RECORDS_KEPT = 50;
const EXAM_TAP_GUARD_MS = 400; // a second tap on 確定 must not also press 下一題 in the same spot

// Filled in by startApp(); a paper the page was built without has no questions and no menu entry.
// `field` is where its rounds are kept in the progress: the paper's own "record" (Core.PAPER_RECORDS), else its id.
const blankPaper = () => ({ items: [], byNo: new Map(), parts: [], title: '', subtitle: '', intro: '', record: '' });
const PAPERS = {
  exam: Object.assign(blankPaper(), { id: 'exam', route: 'exam', field: 'exam', runKey: `${STORAGE_KEY}:exam-run`, name: '模擬考卷' }),
  sim: Object.assign(blankPaper(), { id: 'sim', route: 'sim', field: 'sim', runKey: `${STORAGE_KEY}:sim-run`, name: '類似題練習' }),
};
let examPaper = PAPERS.exam; // the paper of the round on screen
let examRun = null;    // the round on screen (route 'exam-q')
let examPick = null;   // the option tapped but not yet confirmed
let examDraft = '';    // what is typed for a translation
let examReveal = false; // a translation that did not match: compare it with the model answer
let examCombo = 0;
let examLastActive = 0;
let examResult = null; // { paper, part, kind, sum, picks } of the round just finished

/** A paper this browser cannot read only loses its own menu entry; the words and the other paper still work. */
function setPapers(data) {
  Object.values(PAPERS).forEach((p) => {
    let built = blankPaper();
    try {
      if (data[p.id]) built = ExamCore.buildPaper(data[p.id]);
      if (built.record && !Core.PAPER_RECORDS.includes(built.record)) throw new Error(`不認得的成績欄位 ${built.record}`);
    } catch (e) {
      console.error(`${p.name}無法載入：${e.message}`);
      built = blankPaper();
    }
    const field = built.record || p.id;
    Object.assign(p, built, { byNo: new Map(built.items.map((q) => [q.no, q])), field, runKey: `${STORAGE_KEY}:${field}-run` });
  });
}

const examPoints = (r) => Math.round((r.ok / r.total) * 100);
const examQuestionNow = () => examPaper.byNo.get(ExamCore.currentNo(examRun));
const examLabel = (q) => q.label || `第 ${q.no} 題`;
const examTag = (q) => q.tag || `第 ${q.no} 題`;
const partOf = (paper, id) => paper.parts.find((p) => p.id === id) || null;
const partName = (paper, id) => { const part = partOf(paper, id); return part ? part.short : paper.name; };
const examRecords = (paper, part) => ExamCore.recordsOf(store[paper.field], part);
const examTapGuarded = (fn) => () => { if (performance.now() - lastRenderAt >= EXAM_TAP_GUARD_MS) fn(); };

// ---------- the saved round (one per paper, or per part) ----------
const runKeyOf = (paper, part) => (part ? `${paper.runKey}:${part}` : paper.runKey);

function saveExamRun() {
  try {
    localStorage.setItem(runKeyOf(examPaper, examRun.part), JSON.stringify(examRun));
  } catch (e) { /* answers are still counted in the day's log; only the place in the paper is lost */ }
}

function clearExamRun(run) {
  try { localStorage.removeItem(runKeyOf(examPaper, run.part)); } catch (e) { /* nothing saved */ }
}

function loadExamRun(paper, part) {
  try {
    const raw = localStorage.getItem(runKeyOf(paper, part));
    const run = raw ? ExamCore.sanitizeRun(JSON.parse(raw), paper.items) : null;
    return run && (run.part || '') === (part || '') ? run : null;
  } catch (e) {
    return null;
  }
}

// ---------- playing a round ----------
function openExamRound(paper, run) {
  Speech.stop();
  examPaper = paper;
  examRun = run;
  examPick = null;
  examDraft = '';
  examReveal = false;
  examCombo = 0;
  examLastActive = Date.now();
  saveExamRun();
  go('exam-q');
}

/** `nos` null = the whole paper, or the whole part when `part` is given. */
function startExam(paper, kind, nos, part) {
  const scope = nos || (part ? partOf(paper, part).nos : null);
  const run = ExamCore.newRun(paper.items, kind, scope, Core.todayISO(), part);
  if (!run.order.length) {
    showToast(el('span', {}, '沒有要訂正的題目'), 'info');
    return;
  }
  openExamRound(paper, run);
}

function resumeExam(paper, part) {
  const run = loadExamRun(paper, part);
  if (run) openExamRound(paper, run);
  else render();
}

function leaveExam() {
  Speech.stop();
  examRun = null;
  examPick = null;
  go(examPaper.route);
}

function logExamAnswer(correct) {
  const now = Date.now();
  const delta = { q: 1, ok: correct ? 1 : 0, ms: Math.min(now - examLastActive, ACTIVE_CAP_MS), fresh: 0, mined: correct ? 1 : 0 };
  commit((s) => Object.assign({}, s, { log: Core.addToLog(s.log, Core.todayISO(), delta) }));
  examLastActive = now;
}

/** Records `choice` for the question on screen; null when it was already answered. */
function recordExamPick(q, choice) {
  if (ExamCore.pickOf(examRun, q.no) !== null) return null;
  const res = ExamCore.pickAnswer(examRun, q, choice);
  examRun = res.run;
  logExamAnswer(res.correct);
  examCombo = res.correct ? examCombo + 1 : 0;
  if (res.correct) examCheer(q);
  else Sfx.wrong();
  return res.correct;
}

function confirmExamPick() {
  if (!examRun || examPick === null) return;
  const correct = recordExamPick(examQuestionNow(), examPick);
  if (correct === null) return;
  if (correct) {
    nextExamQuestion();
    return;
  }
  saveExamRun();
  render();
  window.scrollTo(0, 0);
}

/** 對答案 on a translation: the same as a model answer counts at once, anything else is compared by the child. */
function checkExamWrite() {
  if (!examRun) return;
  const q = examQuestionNow();
  if (examDraft.trim() && ExamCore.writeMatches(q, examDraft)) {
    gradeExamWrite(true);
    return;
  }
  examReveal = true;
  render();
  window.scrollTo(0, 0);
}

function gradeExamWrite(right) {
  if (!examRun) return;
  if (recordExamPick(examQuestionNow(), right ? 0 : 1) !== null) nextExamQuestion();
}

function examCheer(q) {
  const combo = examCombo;
  const milestone = combo >= COMBO_STEP && combo % COMBO_STEP === 0;
  Sfx.mine(combo);
  if (milestone) setTimeout(() => Sfx.combo(combo), 280);
  showToast(el('div', { class: milestone ? 'toast-body is-combo' : 'toast-body' },
    sprite('blk-gold', 'toast-ore'),
    el('div', { class: 'toast-text' }, el('b', { lang: 'en' }, ExamCore.answerText(q)), el('span', {}, '答對了！'),
      milestone ? el('span', { class: 'toast-combo' }, `🔥 連續答對 ${combo} 題！`) : null)), 'good');
}

function nextExamQuestion() {
  if (!examRun) return;
  examRun = ExamCore.nextQuestion(examRun);
  examPick = null;
  examDraft = '';
  examReveal = false;
  if (ExamCore.isFinished(examRun)) {
    finishExam();
    return;
  }
  saveExamRun();
  render();
  window.scrollTo(0, 0);
}

function finishExam() {
  const paper = examPaper;
  const run = examRun;
  const record = ExamCore.recordOf(run, paper.items, Core.todayISO());
  commit((s) => Object.assign({}, s, { [paper.field]: [...s[paper.field], record].slice(-EXAM_RECORDS_KEPT) }));
  examResult = { paper, part: run.part || '', kind: run.kind, sum: ExamCore.summarize(run, paper.items), picks: run.picks };
  clearExamRun(run);
  examRun = null;
  Speech.stop();
  (examResult.sum.points >= EXAM_WIN_POINTS ? Sfx.bossWin : Sfx.complete)();
  go('exam-done');
}

// ---------- pieces of a question ----------
const paragraphs = (text) => text.split(/\n{2,}/).map((t) => el('p', {}, t));

/** A word-box passage: every gap numbered, this question's gap marked (or filled with option `fill`). */
function examGapPassage(q, fill) {
  return el('blockquote', { class: 'exam-passage exam-gaps', lang: 'en' }, ExamCore.passageParts(q, fill).map((para) => el('p', {}, para.map((p) => {
    if (p.text !== undefined) return p.text;
    if (p.fill !== undefined) return el('b', { class: 'exam-fill' }, `${p.gap}. ${p.fill}`);
    return el('span', { class: p.current ? 'exam-gap is-current' : 'exam-gap', role: 'img', 'aria-label': p.current ? `第 ${p.gap} 格（這一題）` : `第 ${p.gap} 格` }, String(p.gap));
  }))));
}

function examPrompt(q, fill) {
  if (q.type === 'bank') return examGapPassage(q, fill);
  if (q.type === 'write') return el('p', { class: 'exam-zh-prompt' }, q.stem);
  if (q.type === 'question') return el('p', { class: 'exam-question', lang: 'en' }, q.stem);
  const parts = fill === undefined ? ExamCore.stemParts(q.stem) : ExamCore.filledParts(q, fill);
  const sayable = fill !== undefined && (q.type === 'choice' || q.type === 'picture');
  const speak = sayable ? speakBtn(ExamCore.filledText(q, fill), '唸這一句', true) : null;
  return [
    q.picture ? el('img', { class: 'exam-picture', src: q.picture, alt: '題目的圖' }) : null,
    q.stem ? el('p', { class: 'exam-stem', lang: 'en' }, parts.map((p) => {
      if (p.blank) return el('span', { class: 'exam-blank', role: 'img', 'aria-label': '空格' });
      if (p.fill !== undefined) return el('b', { class: 'exam-fill' }, p.fill);
      return p.text;
    }), speak ? ' ' : null, speak) : null,
    q.passage ? el('blockquote', { class: 'exam-passage', lang: 'en' }, paragraphs(q.passage)) : null,
    q.question ? el('p', { class: 'exam-question', lang: 'en' }, q.question) : null,
  ];
}

const examChips = (q) => [
  el('span', { class: 'chip chip-exam' }, examLabel(q)),
  q.missed ? el('span', { class: 'chip chip-missed', title: '這題對應原本答錯的地方' }, '原本錯過') : null,
];

const examLetter = (q, i) => el('span', { class: 'exam-letter', 'aria-hidden': 'true' }, q.labels[i]);

/** The options after answering: the right one in green, a wrong pick crossed out. */
function examOptionsReview(q, picked) {
  return el('ul', { class: 'exam-options exam-review', 'aria-label': '選項' }, q.options.map((text, i) => {
    const right = i === q.answer;
    const mine = i === picked && !right;
    return el('li', { class: `exam-opt${right ? ' is-right' : ''}${mine ? ' is-wrong' : ''}` },
      examLetter(q, i), el('span', { class: 'exam-opt-text', lang: 'en' }, text),
      right ? el('span', { class: 'exam-tag' }, '正確答案') : null,
      mine ? el('span', { class: 'exam-tag' }, '你選的') : null);
  }));
}

function examAnswers(q) {
  return el('div', { class: 'exam-model' }, el('h3', {}, '參考答案'), q.answers.map((a) =>
    el('p', { lang: 'en' }, el('b', {}, a), ' ', speakBtn(a, '唸這一句', true))));
}

function examWhy(q) {
  const rows = [['考點', q.point], ['說明', q.note], ['單元', q.unit], ['對應', q.ref]].filter(([, text]) => text);
  return rows.length ? el('dl', { class: 'exam-why' }, rows.map(([k, text]) =>
    [el('dt', {}, k), el('dd', {}, text.split('\n').map((line, i) => (i ? [el('br'), line] : line)))])) : null;
}

const examZh = (q) => (q.zh ? el('details', { class: 'exam-zh' }, el('summary', {}, '中文翻譯'), paragraphs(q.zh)) : null);

/** The question with its answer, as shown after a mistake and when looked up later. */
function examReview(q, picked) {
  if (q.type === 'write') return [examPrompt(q), examAnswers(q), examWhy(q)];
  return [examPrompt(q, q.answer), examOptionsReview(q, picked), examWhy(q), examZh(q)];
}

function examBar() {
  const total = examRun.order.length;
  const pos = examRun.pos;
  const redo = examRun.kind === 'redo';
  const title = examPaper.parts.length ? `${partName(examPaper, examRun.part)}${redo ? '・訂正' : ''}` : (redo ? '訂正答錯的題目' : examPaper.name);
  return el('header', { class: 'session-bar' },
    el('button', { class: 'icon-btn', 'aria-label': '先休息（做到哪一題會記住）', title: '先休息', onclick: leaveExam }, '✕'),
    el('span', { class: 'session-title' }, title),
    el('div', { class: 'progress', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': total, 'aria-valuenow': pos },
      el('span', { style: `width:${Math.round((pos / total) * 100)}%` })),
    examCombo >= COMBO_BADGE_MIN
      ? el('span', { class: 'combo-badge', title: '連續答對', 'aria-label': `連續答對 ${examCombo} 題` }, '🔥', el('b', {}, examCombo))
      : null,
    el('span', { class: 'count' }, `${pos + 1} / ${total}`));
}

function examQuizCard(q) {
  const confirm = el('button', { type: 'button', class: 'btn btn-primary', disabled: examPick === null, onclick: confirmExamPick }, '確定');
  const options = q.options.map((text, i) => el('button', {
    type: 'button', class: 'exam-opt', 'aria-pressed': examPick === i ? 'true' : 'false',
    onclick: () => {
      examPick = i;
      options.forEach((b, k) => b.setAttribute('aria-pressed', k === i ? 'true' : 'false'));
      confirm.disabled = false;
    },
  }, examLetter(q, i), el('span', { class: 'exam-opt-text', lang: 'en' }, text)));
  return el('section', { class: 'card quiz-card exam-card' },
    examChips(q),
    examPrompt(q),
    q.type === 'bank' ? el('p', { class: 'exam-ask' }, `第 ${q.blank} 格要填哪一個？（每個選項只用一次）`) : null,
    el('div', { class: `exam-options${q.options.length > 4 ? ' is-bank' : ''}`, role: 'group', 'aria-label': '選項' }, options),
    el('div', { class: 'quiz-actions' }, el('span', { class: 'exam-hint' }, '先點一個答案，再按確定'), confirm));
}

function examFeedbackCard(q, picked) {
  const last = examRun.pos + 1 >= examRun.order.length;
  return el('section', { class: 'card fb-card exam-card' },
    el('div', { class: 'fb-head', role: 'alert' },
      el('span', { class: 'fb-icon', 'aria-hidden': 'true' }, '✗'),
      el('div', {}, el('b', {}, '答錯了，看一下為什麼'),
        el('div', { class: 'fb-answer' }, '正確答案：', el('b', { lang: 'en' }, ExamCore.answerText(q))))),
    examChips(q),
    examReview(q, picked),
    el('button', { type: 'button', class: 'btn btn-primary btn-wide', onclick: examTapGuarded(nextExamQuestion) }, last ? '看成績 →' : '下一題 →'));
}

function examWriteCard(q) {
  const box = el('textarea', {
    class: 'exam-write', lang: 'en', rows: 3, autocapitalize: 'sentences', autocorrect: 'off', autocomplete: 'off', spellcheck: 'false',
    'aria-label': '你的英文翻譯', placeholder: '在這裡打英文句子（寫在紙上也可以，寫好再按「對答案」）', 'data-autofocus': '',
    oninput: (e) => { examDraft = e.target.value; },
  }, examDraft);
  return el('section', { class: 'card quiz-card exam-card' },
    examChips(q),
    el('p', { class: 'exam-ask' }, '翻成英文：'),
    examPrompt(q),
    box,
    el('div', { class: 'quiz-actions' }, el('span', { class: 'exam-hint' }, '注意大寫、逗號和拼字'),
      el('button', { type: 'button', class: 'btn btn-primary', onclick: examTapGuarded(checkExamWrite) }, '對答案')));
}

/** A translation that did not match a model answer: side by side, and the child says whether it is right. */
function examWriteCheck(q, picked) {
  const typed = examDraft.trim();
  const last = examRun.pos + 1 >= examRun.order.length;
  return el('section', { class: 'card fb-card exam-card' },
    examChips(q),
    examPrompt(q),
    el('div', { class: 'exam-mine' }, el('h3', {}, '你寫的'),
      typed ? el('p', { lang: 'en' }, typed) : el('p', { class: 'muted' }, '（沒有打字：請拿紙上寫的來對照）')),
    examAnswers(q),
    examWhy(q),
    picked !== null
      ? el('button', { type: 'button', class: 'btn btn-primary btn-wide', onclick: examTapGuarded(nextExamQuestion) }, last ? '看成績 →' : '下一題 →')
      : el('div', { class: 'confirm exam-grade' },
        el('p', {}, '和參考答案比一比：意思、拼字、大寫和標點都對嗎？'),
        el('button', { type: 'button', class: 'btn btn-primary', onclick: examTapGuarded(() => gradeExamWrite(true)) }, '我寫對了'),
        el('button', { type: 'button', class: 'btn btn-gold', onclick: examTapGuarded(() => gradeExamWrite(false)) }, '寫錯了，算錯')));
}

function examQuestionView() {
  if (!examRun || ExamCore.isFinished(examRun)) return examPaper.route === 'sim' ? simView() : examView();
  const q = examQuestionNow();
  const picked = ExamCore.pickOf(examRun, q.no);
  let card;
  if (q.type === 'write') card = picked === null && !examReveal ? examWriteCard(q) : examWriteCheck(q, picked);
  else card = picked === null ? examQuizCard(q) : examFeedbackCard(q, picked);
  return el('main', { class: 'screen session mode-exam' }, examBar(), card);
}

// ---------- looking a question up later ----------
function openExamDetail(q, picked) {
  openModal(el('div', { class: 'exam-detail' }, el('h2', {}, examLabel(q)), examReview(q, picked)));
}

function examNumberChips(paper, nos, picks) {
  return el('div', { class: 'chips' }, nos.map((no) => paper.byNo.get(no)).filter(Boolean).map((q) =>
    el('button', { class: 'word-chip', onclick: () => openExamDetail(q, picks && picks[q.no] !== undefined ? picks[q.no] : null) }, examTag(q))));
}

// ---------- screens ----------
function examRecordText(paper, r) {
  if (!paper.parts.length) {
    return r.kind === 'full'
      ? `${fmtDateW(r.date)}　全卷 ${examPoints(r)} 分（答對 ${r.ok} / ${r.total} 題）`
      : `${fmtDateW(r.date)}　訂正 ${r.total} 題，答對 ${r.ok} 題`;
  }
  const name = partName(paper, r.part);
  return r.kind === 'full'
    ? `${fmtDateW(r.date)}　${name} ${examPoints(r)} 分（答對 ${r.ok} / ${r.total} 題）`
    : `${fmtDateW(r.date)}　${name} 訂正 ${r.total} 題，答對 ${r.ok} 題`;
}

function examMenuText() {
  const p = PAPERS.exam;
  const run = loadExamRun(p, null);
  if (run) return `做到第 ${run.pos + 1} / ${run.order.length} 題，點這裡接著做`;
  const last = store[p.field].filter((r) => r.kind === 'full').pop();
  return last ? `上次 ${examPoints(last)} 分・段考題型 ${p.items.length} 題選擇題` : `照段考題型出的 ${p.items.length} 題選擇題`;
}

function simMenuText() {
  const p = PAPERS.sim;
  const going = p.parts.map((part) => ({ part, run: loadExamRun(p, part.id) })).find((x) => x.run);
  if (going) return `${going.part.short}做到第 ${going.run.pos + 1} / ${going.run.order.length} 題，點這裡接著做`;
  const done = p.parts.filter((part) => examRecords(p, part.id).some((r) => r.kind === 'full')).length;
  return done ? `做完 ${done} / ${p.parts.length} 段・共 ${p.items.length} 題` : `${p.subtitle || `${p.parts.length} 段`}，共 ${p.items.length} 題`;
}

function examStartRow(paper, part, run, redo) {
  const partId = part ? part.id : undefined;
  if (run) {
    return el('div', { class: 'confirm exam-resume' },
      el('p', {}, `${run.kind === 'redo' ? '訂正' : (part ? '這一段' : paper.name)}做到第 ${run.pos + 1} / ${run.order.length} 題。`),
      el('button', { class: 'btn btn-primary btn-big', onclick: () => resumeExam(paper, partId) }, '繼續作答'),
      el('button', { class: 'btn btn-ghost btn-sm', onclick: () => startExam(paper, run.kind, run.order, partId) }, '從第一題重新開始'));
  }
  const size = part ? part.nos.length : paper.items.length;
  return el('div', { class: 'row exam-start' },
    el('button', { class: 'btn btn-primary btn-big', onclick: () => startExam(paper, 'full', null, partId) }, `開始作答（${size} 題）`),
    redo.length ? el('button', { class: 'btn btn-gold', onclick: () => startExam(paper, 'redo', redo, partId) }, `訂正上次答錯的 ${redo.length} 題`) : null);
}

function examView() {
  const p = PAPERS.exam;
  if (!p.items.length) return homeView();
  const run = loadExamRun(p, null);
  const redo = ExamCore.wrongToRedo(store[p.field], p.items);
  const history = store[p.field].slice(-EXAM_HISTORY_SHOWN).reverse();
  return el('main', { class: 'screen' }, backBar('模擬考卷'), el('section', { class: 'card exam-intro' },
    sprite('blk-exam', 'boss-big'),
    el('h2', {}, p.title || p.name),
    el('p', {}, `照學校段考題型出的 ${p.items.length} 題選擇題，滿分 100 分。先點答案，再按「確定」；答錯會馬上看到正確答案和說明。中途離開也沒關係，下次會從同一題接著做。`),
    examStartRow(p, null, run, redo),
    redo.length && !run ? el('div', { class: 'result-block' }, el('h3', {}, '上次答錯的題目（點一下看說明）'), examNumberChips(p, redo, null)) : null,
    history.length ? el('div', { class: 'boss-history' }, el('h3', {}, '作答紀錄'),
      el('ul', {}, history.map((r) => el('li', {}, examRecordText(p, r))))) : null));
}

function simErrata(e) {
  return el('details', { class: 'sim-errata' }, el('summary', {}, e.title),
    e.intro ? el('p', {}, e.intro) : null, el('ul', {}, e.items.map((t) => el('li', {}, t))));
}

function simPartCard(p, part) {
  const run = loadExamRun(p, part.id);
  const redo = ExamCore.wrongToRedo(store.sim, p.items, part.id);
  const last = examRecords(p, part.id).filter((r) => r.kind === 'full').pop();
  const missed = part.nos.filter((no) => p.byNo.get(no).missed).length;
  const meta = [`${part.nos.length} 題`, missed ? `${missed} 題是原本錯過的地方` : '', last ? `上次 ${examPoints(last)} 分（答對 ${last.ok} / ${last.total} 題）` : ''];
  return el('section', { class: 'card sim-part', 'data-part': part.id },
    el('h2', {}, part.title),
    el('p', { class: 'sim-meta' }, meta.filter(Boolean).join('・')),
    part.note ? el('p', { class: 'muted' }, part.note) : null,
    examStartRow(p, part, run, redo),
    redo.length && !run ? el('div', { class: 'result-block' }, el('h3', {}, '上次答錯的題目（點一下看說明）'), examNumberChips(p, redo, null)) : null,
    part.errata ? simErrata(part.errata) : null);
}

function simView() {
  const p = PAPERS.sim;
  if (!p.items.length) return homeView();
  return el('main', { class: 'screen' }, backBar(p.name),
    el('section', { class: 'card exam-intro sim-intro' },
      sprite('blk-sim', 'boss-big'),
      el('h2', {}, p.title || p.name),
      p.intro ? el('p', {}, p.intro) : null,
      el('p', {}, '每一段分開做。先點答案再按「確定」，答錯會馬上看到正確答案和說明，閱讀和選詞填空還有中文翻譯。中翻英打好字按「對答案」，和參考答案不一樣時，自己對照後選對或錯。中途離開也沒關係，下次會從同一題接著做。')),
    p.parts.map((part) => simPartCard(p, part)));
}

function examVerdict(kind, points) {
  if (kind === 'redo') return points === 100 ? '全部訂正好了！' : '再訂正一次就好了';
  if (points >= 90) return '太強了！';
  if (points >= EXAM_WIN_POINTS) return '很棒！';
  if (points >= 60) return '及格了，把答錯的訂正好';
  return '別灰心，把答錯的一題一題訂正';
}

function examResultView() {
  if (!examResult) return examView();
  const { paper, part, kind, sum, picks } = examResult;
  const inParts = paper.parts.length > 0;
  const back = () => { examResult = null; go(inParts ? paper.route : 'home'); };
  return el('main', { class: 'screen' }, el('section', { class: 'card result exam-result' },
    sprite(inParts ? 'blk-sim' : 'blk-exam', 'result-boss'),
    inParts ? el('p', { class: 'muted' }, partOf(paper, part).title) : null,
    el('h1', {}, examVerdict(kind, sum.points)),
    kind === 'full'
      ? el('p', { class: 'result-score' }, el('b', {}, `${sum.points} 分`), `（答對 ${sum.ok} / ${sum.total} 題）`)
      : el('p', { class: 'result-score' }, el('b', {}, `${sum.ok} / ${sum.total}`), ' 題訂正成功'),
    sum.wrong.length
      ? el('div', { class: 'result-block' }, el('h2', {}, '答錯的題目（點一下看說明）'), examNumberChips(paper, sum.wrong, picks))
      : el('p', { class: 'all-right' }, '全部答對，太強了！'),
    el('div', { class: 'result-actions' },
      sum.wrong.length ? el('button', { class: 'btn btn-gold', onclick: () => startExam(paper, 'redo', sum.wrong, part || undefined) }, `訂正答錯的 ${sum.wrong.length} 題`) : null,
      el('button', { class: 'btn btn-primary', onclick: back }, inParts ? `回${paper.name}` : '回礦坑'))));
}

/** Parent page: every round, newest first. */
function examParentCard() {
  const p = PAPERS.exam;
  if (!p.items.length || !store[p.field].length) return null; // a paper put away keeps its rounds in the progress
  return el('section', { class: 'card' }, el('h2', {}, `${p.title || p.name}成績`),
    el('ul', { class: 'boss-history' }, store[p.field].slice(-10).reverse().map((r) => el('li', {},
      examRecordText(PAPERS.exam, r), r.wrong.length ? el('span', { class: 'muted' }, `　答錯：第 ${r.wrong.join('、')} 題`) : null))));
}

function simParentCard() {
  const p = PAPERS.sim;
  if (!store.sim.length || !p.items.length) return null;
  const tags = (nos) => nos.map((no) => (p.byNo.has(no) ? examTag(p.byNo.get(no)) : `第 ${no} 題`)).join('、');
  return el('section', { class: 'card' }, el('h2', {}, '類似題練習成績'),
    el('ul', { class: 'boss-history' }, store.sim.slice(-12).reverse().map((r) => el('li', {},
      examRecordText(p, r), r.wrong.length ? el('span', { class: 'muted' }, `　答錯：${tags(r.wrong)}`) : null))));
}

// ---- main.js ----
/* Boot, routing, rendering, and keeping tabs and days in sync. */
// Every unit in the app, in book order; Core.SCOPE picks the ones of the coming exam.
const UNIT_IDS = ['04', '05', '06', '07', '08', '09', '10', '11'];
const KEY_GUARD_MS = 450;
const VIEWS = {
  home: homeView, session: sessionView, result: resultView, errors: errorsView, practice: practiceView,
  boss: bossView, bank: bankView, parent: parentView, paper: paperView,
  exam: examView, sim: simView, 'exam-q': examQuestionView, 'exam-done': examResultView,
};
// Mid-question screens: no update banner, and no re-render from other tabs.
const PRACTICE_ROUTES = ['session', 'exam-q'];

// Filled in by startApp() once the vocabulary is available (it may first need unlocking).
let ITEMS = [];
let SCOPE_ITEMS = []; // the coming exam's words: mission, 多學新字, error book, boss, home mine, paper test
let ITEM_BY_ID = new Map();
let VALID_IDS = new Set();
let SCOPE_IDS = new Set(); // a mission saved mid-way resumes only with these (not a U4–U7 one saved before U8–U11)
let TRACKS = [];
let AUDIO_URL = '音檔/{name}.mp3';
let store = null;
let route = 'home';
let lastRenderAt = 0;
let renderedDay = Core.todayISO();

/** change(store) returns the next store. Re-reads first when another tab saved in the meantime. */
function commit(change) {
  const saved = Storage.savedRev();
  if (saved !== null && saved !== store.rev) store = Storage.load(VALID_IDS);
  store = Object.assign({}, change(store), { rev: store.rev + 1 });
  Storage.save(store);
}

function render() {
  const root = document.getElementById('app');
  setChildren(root, inPractice() ? null : updateBanner(), (VIEWS[route] || homeView)());
  lastRenderAt = performance.now();
  renderedDay = Core.todayISO();
  const target = root.querySelector('[data-autofocus]');
  if (target && route !== 'home') target.focus();
}

function inPractice() {
  return PRACTICE_ROUTES.includes(route);
}

function go(name) {
  route = name;
  render();
  window.scrollTo(0, 0);
}

/** Ignores a keyboard "click" that lands right after a screen change (a double Enter). */
function keyGuard(fn) {
  return (e) => {
    if (e && e.detail === 0 && performance.now() - lastRenderAt < KEY_GUARD_MS) return;
    fn(e);
  };
}

/** Another tab saved, or a new day started while this tab stayed open: show the latest. */
function syncFromStorage() {
  const saved = Storage.savedRev();
  const changed = saved !== null && saved !== store.rev;
  if (changed) store = Storage.load(VALID_IDS);
  const newDay = renderedDay !== Core.todayISO();
  if ((changed || newDay) && !inPractice()) render();
}

function applyAudioSettings() {
  Sfx.setEnabled(store.settings.sound);
  Sfx.setVolume(store.settings.volume);
  Speech.setVolume(store.settings.volume);
  Pron.setVolume(store.settings.volume);
}

/** Asks the browser not to evict saved progress when space runs low (silently granted or not). */
function requestPersistentStorage() {
  try {
    if (window.location.protocol === 'https:' && navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => { /* keep best-effort storage */ });
    }
  } catch (e) { /* unsupported */ }
}

function startApp(data) {
  ITEMS = Core.buildItems(data.units);
  SCOPE_ITEMS = Core.scopeItems(ITEMS);
  ITEM_BY_ID = new Map(ITEMS.map((it) => [it.id, it]));
  VALID_IDS = new Set(ITEMS.map((it) => it.id));
  SCOPE_IDS = new Set(SCOPE_ITEMS.map((it) => it.id));
  TRACKS = data.tracks || [];
  AUDIO_URL = data.audioUrl || AUDIO_URL;
  setPapers(data);
  store = Storage.load(VALID_IDS);
  initWhatsNew(Object.keys(store.states).length > 0);
  Speech.init(store.settings.voice);
  Pron.setup(data.voice);
  Speech.useClips(Pron);
  // Voices load late on some browsers; refresh screens that show speech controls.
  Speech.onChange(() => { if (['parent', 'practice', 'bank'].includes(route)) render(); });
  applyAudioSettings();
  preferPlaybackAudio();
  requestPersistentStorage();
  window.addEventListener('storage', (e) => { if (e.key === STORAGE_KEY) syncFromStorage(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    syncFromStorage();
    checkForUpdate();
  });
  window.addEventListener('focus', syncFromStorage);
  if (/[?&]e2e\b/.test(window.location.search)) {
    window.__vocabMine = {
      answers: () => (session && session.q ? Core.answerTexts(session.q) : null),
      step: () => (session ? session.queue[session.pos] : null),
      queue: () => (session ? session.queue.map((x) => x.id) : null),
      store: () => store,
      sync: syncFromStorage,
      checkUpdate: () => checkForUpdate(true),
      speak: (text) => Speech.speak(text, store.settings.rate),
      exam: () => {
        if (!examRun || ExamCore.isFinished(examRun)) return null;
        const q = examQuestionNow();
        return { paper: examPaper.id, no: q.no, type: q.type, answer: q.answer, options: q.options.length, answers: q.answers };
      },
    };
  }
  render();
  checkForUpdate();
}

function boot() {
  installSprites();
  AudioOut.startOnFirstTouch();
  if (window.VOCAB_LOCKED) unlock(window.VOCAB_LOCKED).then(startApp);
  else startApp({ units: window.VOCAB_DATA, tracks: window.VOCAB_TRACKS, audioUrl: window.VOCAB_AUDIO_URL, voice: window.VOCAB_VOICE, exam: window.VOCAB_EXAM, sim: window.VOCAB_SIM });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
