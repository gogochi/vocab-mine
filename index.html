// ---- exam.js ----
/* 模擬考卷 and 類似題練習: a paper one question a screen. A mistake shows the right answer and why at once;
 * a round in progress is saved after every answer (own key, beside the progress). 類似題練習 is done one
 * part at a time, each part with its own saved round; a translation is checked against the model answers,
 * and the child marks it when what they wrote differs. */
const EXAM_WIN_POINTS = 80;
const EXAM_HISTORY_SHOWN = 8;
const EXAM_RECORDS_KEPT = 50;
const EXAM_TAP_GUARD_MS = 400; // a second tap on 確定 must not also press 下一題 in the same spot

// Filled in by startApp(); a paper the page was built without has no questions and no menu entry.
// `field` is where its rounds are kept in the progress.
const blankPaper = () => ({ items: [], byNo: new Map(), parts: [], title: '', subtitle: '', intro: '' });
const PAPERS = {
  exam: Object.assign(blankPaper(), { id: 'exam', route: 'exam', field: 'exam', runKey: `${STORAGE_KEY}:exam-run`, name: '模擬考卷' }),
  sim: Object.assign(blankPaper(), { id: 'sim', route: 'sim', field: 'sim', runKey: `${STORAGE_KEY}:sim-run`, name: '類似題練習' }),
};
let examPaper = PAPERS.exam; // the paper of the round on screen
let examRun = null;    // the round on screen (route 'exam-q')
let examPick = null;   // the option tapped but not yet confirmed
let examDraft = '';    // what is typed for a translation
let examReveal = false; // a translation that did not match: compare it with the model answer
let examCombo = 0;
let examLastActive = 0;
let examResult = null; // { paper, part, kind, sum, picks } of the round just finished

/** A paper this browser cannot read only loses its own menu entry; the words and the other paper still work. */
function setPapers(data) {
  Object.values(PAPERS).forEach((p) => {
    let built = blankPaper();
    try {
      if (data[p.id]) built = ExamCore.buildPaper(data[p.id]);
    } catch (e) {
      console.error(`${p.name}無法載入：${e.message}`);
    }
    Object.assign(p, built, { byNo: new Map(built.items.map((q) => [q.no, q])) });
  });
}

const examPoints = (r) => Math.round((r.ok / r.total) * 100);
const examQuestionNow = () => examPaper.byNo.get(ExamCore.currentNo(examRun));
const examLabel = (q) => q.label || `第 ${q.no} 題`;
const examTag = (q) => q.tag || `第 ${q.no} 題`;
const partOf = (paper, id) => paper.parts.find((p) => p.id === id) || null;
const partName = (paper, id) => { const part = partOf(paper, id); return part ? part.short : paper.name; };
const examRecords = (paper, part) => ExamCore.recordsOf(store[paper.field], part);
const examTapGuarded = (fn) => () => { if (performance.now() - lastRenderAt >= EXAM_TAP_GUARD_MS) fn(); };

// ---------- the saved round (one per paper, or per part) ----------
const runKeyOf = (paper, part) => (part ? `${paper.runKey}:${part}` : paper.runKey);

function saveExamRun() {
  try {
    localStorage.setItem(runKeyOf(examPaper, examRun.part), JSON.stringify(examRun));
  } catch (e) { /* answers are still counted in the day's log; only the place in the paper is lost */ }
}

function clearExamRun(run) {
  try { localStorage.removeItem(runKeyOf(examPaper, run.part)); } catch (e) { /* nothing saved */ }
}

function loadExamRun(paper, part) {
  try {
    const raw = localStorage.getItem(runKeyOf(paper, part));
    const run = raw ? ExamCore.sanitizeRun(JSON.parse(raw), paper.items) : null;
    return run && (run.part || '') === (part || '') ? run : null;
  } catch (e) {
    return null;
  }
}

// ---------- playing a round ----------
function openExamRound(paper, run) {
  Speech.stop();
  examPaper = paper;
  examRun = run;
  examPick = null;
  examDraft = '';
  examReveal = false;
  examCombo = 0;
  examLastActive = Date.now();
  saveExamRun();
  go('exam-q');
}

/** `nos` null = the whole paper, or the whole part when `part` is given. */
function startExam(paper, kind, nos, part) {
  const scope = nos || (part ? partOf(paper, part).nos : null);
  const run = ExamCore.newRun(paper.items, kind, scope, Core.todayISO(), part);
  if (!run.order.length) {
    showToast(el('span', {}, '沒有要訂正的題目'), 'info');
    return;
  }
  openExamRound(paper, run);
}

function resumeExam(paper, part) {
  const run = loadExamRun(paper, part);
  if (run) openExamRound(paper, run);
  else render();
}

function leaveExam() {
  Speech.stop();
  examRun = null;
  examPick = null;
  go(examPaper.route);
}

function logExamAnswer(correct) {
  const now = Date.now();
  const delta = { q: 1, ok: correct ? 1 : 0, ms: Math.min(now - examLastActive, ACTIVE_CAP_MS), fresh: 0, mined: correct ? 1 : 0 };
  commit((s) => Object.assign({}, s, { log: Core.addToLog(s.log, Core.todayISO(), delta) }));
  examLastActive = now;
}

/** Records `choice` for the question on screen; null when it was already answered. */
function recordExamPick(q, choice) {
  if (ExamCore.pickOf(examRun, q.no) !== null) return null;
  const res = ExamCore.pickAnswer(examRun, q, choice);
  examRun = res.run;
  logExamAnswer(res.correct);
  examCombo = res.correct ? examCombo + 1 : 0;
  if (res.correct) examCheer(q);
  else Sfx.wrong();
  return res.correct;
}

function confirmExamPick() {
  if (!examRun || examPick === null) return;
  const correct = recordExamPick(examQuestionNow(), examPick);
  if (correct === null) return;
  if (correct) {
    nextExamQuestion();
    return;
  }
  saveExamRun();
  render();
  window.scrollTo(0, 0);
}

/** 對答案 on a translation: the same as a model answer counts at once, anything else is compared by the child. */
function checkExamWrite() {
  if (!examRun) return;
  const q = examQuestionNow();
  if (examDraft.trim() && ExamCore.writeMatches(q, examDraft)) {
    gradeExamWrite(true);
    return;
  }
  examReveal = true;
  render();
  window.scrollTo(0, 0);
}

function gradeExamWrite(right) {
  if (!examRun) return;
  if (recordExamPick(examQuestionNow(), right ? 0 : 1) !== null) nextExamQuestion();
}

function examCheer(q) {
  const combo = examCombo;
  const milestone = combo >= COMBO_STEP && combo % COMBO_STEP === 0;
  Sfx.mine(combo);
  if (milestone) setTimeout(() => Sfx.combo(combo), 280);
  showToast(el('div', { class: milestone ? 'toast-body is-combo' : 'toast-body' },
    sprite('blk-gold', 'toast-ore'),
    el('div', { class: 'toast-text' }, el('b', { lang: 'en' }, ExamCore.answerText(q)), el('span', {}, '答對了！'),
      milestone ? el('span', { class: 'toast-combo' }, `🔥 連續答對 ${combo} 題！`) : null)), 'good');
}

function nextExamQuestion() {
  if (!examRun) return;
  examRun = ExamCore.nextQuestion(examRun);
  examPick = null;
  examDraft = '';
  examReveal = false;
  if (ExamCore.isFinished(examRun)) {
    finishExam();
    return;
  }
  saveExamRun();
  render();
  window.scrollTo(0, 0);
}

function finishExam() {
  const paper = examPaper;
  const run = examRun;
  const record = ExamCore.recordOf(run, paper.items, Core.todayISO());
  commit((s) => Object.assign({}, s, { [paper.field]: [...s[paper.field], record].slice(-EXAM_RECORDS_KEPT) }));
  examResult = { paper, part: run.part || '', kind: run.kind, sum: ExamCore.summarize(run, paper.items), picks: run.picks };
  clearExamRun(run);
  examRun = null;
  Speech.stop();
  (examResult.sum.points >= EXAM_WIN_POINTS ? Sfx.bossWin : Sfx.complete)();
  go('exam-done');
}

// ---------- pieces of a question ----------
const paragraphs = (text) => text.split(/\n{2,}/).map((t) => el('p', {}, t));

/** A word-box passage: every gap numbered, this question's gap marked (or filled with option `fill`). */
function examGapPassage(q, fill) {
  return el('blockquote', { class: 'exam-passage exam-gaps', lang: 'en' }, ExamCore.passageParts(q, fill).map((para) => el('p', {}, para.map((p) => {
    if (p.text !== undefined) return p.text;
    if (p.fill !== undefined) return el('b', { class: 'exam-fill' }, `${p.gap}. ${p.fill}`);
    return el('span', { class: p.current ? 'exam-gap is-current' : 'exam-gap', role: 'img', 'aria-label': p.current ? `第 ${p.gap} 格（這一題）` : `第 ${p.gap} 格` }, String(p.gap));
  }))));
}

function examPrompt(q, fill) {
  if (q.type === 'bank') return examGapPassage(q, fill);
  if (q.type === 'write') return el('p', { class: 'exam-zh-prompt' }, q.stem);
  if (q.type === 'question') return el('p', { class: 'exam-question', lang: 'en' }, q.stem);
  const parts = fill === undefined ? ExamCore.stemParts(q.stem) : ExamCore.filledParts(q, fill);
  const sayable = fill !== undefined && (q.type === 'choice' || q.type === 'picture');
  const speak = sayable ? speakBtn(ExamCore.filledText(q, fill), '唸這一句', true) : null;
  return [
    q.picture ? el('img', { class: 'exam-picture', src: q.picture, alt: '題目的圖' }) : null,
    q.stem ? el('p', { class: 'exam-stem', lang: 'en' }, parts.map((p) => {
      if (p.blank) return el('span', { class: 'exam-blank', role: 'img', 'aria-label': '空格' });
      if (p.fill !== undefined) return el('b', { class: 'exam-fill' }, p.fill);
      return p.text;
    }), speak ? ' ' : null, speak) : null,
    q.passage ? el('blockquote', { class: 'exam-passage', lang: 'en' }, paragraphs(q.passage)) : null,
    q.question ? el('p', { class: 'exam-question', lang: 'en' }, q.question) : null,
  ];
}

const examChips = (q) => [
  el('span', { class: 'chip chip-exam' }, examLabel(q)),
  q.missed ? el('span', { class: 'chip chip-missed', title: '這題對應原本答錯的地方' }, '原本錯過') : null,
];

const examLetter = (q, i) => el('span', { class: 'exam-letter', 'aria-hidden': 'true' }, q.labels[i]);

/** The options after answering: the right one in green, a wrong pick crossed out. */
function examOptionsReview(q, picked) {
  return el('ul', { class: 'exam-options exam-review', 'aria-label': '選項' }, q.options.map((text, i) => {
    const right = i === q.answer;
    const mine = i === picked && !right;
    return el('li', { class: `exam-opt${right ? ' is-right' : ''}${mine ? ' is-wrong' : ''}` },
      examLetter(q, i), el('span', { class: 'exam-opt-text', lang: 'en' }, text),
      right ? el('span', { class: 'exam-tag' }, '正確答案') : null,
      mine ? el('span', { class: 'exam-tag' }, '你選的') : null);
  }));
}

function examAnswers(q) {
  return el('div', { class: 'exam-model' }, el('h3', {}, '參考答案'), q.answers.map((a) =>
    el('p', { lang: 'en' }, el('b', {}, a), ' ', speakBtn(a, '唸這一句', true))));
}

function examWhy(q) {
  const rows = [['考點', q.point], ['說明', q.note], ['單元', q.unit], ['對應', q.ref]].filter(([, text]) => text);
  return rows.length ? el('dl', { class: 'exam-why' }, rows.map(([k, text]) =>
    [el('dt', {}, k), el('dd', {}, text.split('\n').map((line, i) => (i ? [el('br'), line] : line)))])) : null;
}

const examZh = (q) => (q.zh ? el('details', { class: 'exam-zh' }, el('summary', {}, '中文翻譯'), paragraphs(q.zh)) : null);

/** The question with its answer, as shown after a mistake and when looked up later. */
function examReview(q, picked) {
  if (q.type === 'write') return [examPrompt(q), examAnswers(q), examWhy(q)];
  return [examPrompt(q, q.answer), examOptionsReview(q, picked), examWhy(q), examZh(q)];
}

function examBar() {
  const total = examRun.order.length;
  const pos = examRun.pos;
  const redo = examRun.kind === 'redo';
  const title = examPaper.parts.length ? `${partName(examPaper, examRun.part)}${redo ? '・訂正' : ''}` : (redo ? '訂正答錯的題目' : examPaper.name);
  return el('header', { class: 'session-bar' },
    el('button', { class: 'icon-btn', 'aria-label': '先休息（做到哪一題會記住）', title: '先休息', onclick: leaveExam }, '✕'),
    el('span', { class: 'session-title' }, title),
    el('div', { class: 'progress', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': total, 'aria-valuenow': pos },
      el('span', { style: `width:${Math.round((pos / total) * 100)}%` })),
    examCombo >= COMBO_BADGE_MIN
      ? el('span', { class: 'combo-badge', title: '連續答對', 'aria-label': `連續答對 ${examCombo} 題` }, '🔥', el('b', {}, examCombo))
      : null,
    el('span', { class: 'count' }, `${pos + 1} / ${total}`));
}

function examQuizCard(q) {
  const confirm = el('button', { type: 'button', class: 'btn btn-primary', disabled: examPick === null, onclick: confirmExamPick }, '確定');
  const options = q.options.map((text, i) => el('button', {
    type: 'button', class: 'exam-opt', 'aria-pressed': examPick === i ? 'true' : 'false',
    onclick: () => {
      examPick = i;
      options.forEach((b, k) => b.setAttribute('aria-pressed', k === i ? 'true' : 'false'));
      confirm.disabled = false;
    },
  }, examLetter(q, i), el('span', { class: 'exam-opt-text', lang: 'en' }, text)));
  return el('section', { class: 'card quiz-card exam-card' },
    examChips(q),
    examPrompt(q),
    q.type === 'bank' ? el('p', { class: 'exam-ask' }, `第 ${q.blank} 格要填哪一個？（每個選項只用一次）`) : null,
    el('div', { class: `exam-options${q.options.length > 4 ? ' is-bank' : ''}`, role: 'group', 'aria-label': '選項' }, options),
    el('div', { class: 'quiz-actions' }, el('span', { class: 'exam-hint' }, '先點一個答案，再按確定'), confirm));
}

function examFeedbackCard(q, picked) {
  const last = examRun.pos + 1 >= examRun.order.length;
  return el('section', { class: 'card fb-card exam-card' },
    el('div', { class: 'fb-head', role: 'alert' },
      el('span', { class: 'fb-icon', 'aria-hidden': 'true' }, '✗'),
      el('div', {}, el('b', {}, '答錯了，看一下為什麼'),
        el('div', { class: 'fb-answer' }, '正確答案：', el('b', { lang: 'en' }, ExamCore.answerText(q))))),
    examChips(q),
    examReview(q, picked),
    el('button', { type: 'button', class: 'btn btn-primary btn-wide', onclick: examTapGuarded(nextExamQuestion) }, last ? '看成績 →' : '下一題 →'));
}

function examWriteCard(q) {
  const box = el('textarea', {
    class: 'exam-write', lang: 'en', rows: 3, autocapitalize: 'sentences', autocorrect: 'off', autocomplete: 'off', spellcheck: 'false',
    'aria-label': '你的英文翻譯', placeholder: '在這裡打英文句子（寫在紙上也可以，寫好再按「對答案」）', 'data-autofocus': '',
    oninput: (e) => { examDraft = e.target.value; },
  }, examDraft);
  return el('section', { class: 'card quiz-card exam-card' },
    examChips(q),
    el('p', { class: 'exam-ask' }, '翻成英文：'),
    examPrompt(q),
    box,
    el('div', { class: 'quiz-actions' }, el('span', { class: 'exam-hint' }, '注意大寫、逗號和拼字'),
      el('button', { type: 'button', class: 'btn btn-primary', onclick: examTapGuarded(checkExamWrite) }, '對答案')));
}

/** A translation that did not match a model answer: side by side, and the child says whether it is right. */
function examWriteCheck(q, picked) {
  const typed = examDraft.trim();
  const last = examRun.pos + 1 >= examRun.order.length;
  return el('section', { class: 'card fb-card exam-card' },
    examChips(q),
    examPrompt(q),
    el('div', { class: 'exam-mine' }, el('h3', {}, '你寫的'),
      typed ? el('p', { lang: 'en' }, typed) : el('p', { class: 'muted' }, '（沒有打字：請拿紙上寫的來對照）')),
    examAnswers(q),
    examWhy(q),
    picked !== null
      ? el('button', { type: 'button', class: 'btn btn-primary btn-wide', onclick: examTapGuarded(nextExamQuestion) }, last ? '看成績 →' : '下一題 →')
      : el('div', { class: 'confirm exam-grade' },
        el('p', {}, '和參考答案比一比：意思、拼字、大寫和標點都對嗎？'),
        el('button', { type: 'button', class: 'btn btn-primary', onclick: examTapGuarded(() => gradeExamWrite(true)) }, '我寫對了'),
        el('button', { type: 'button', class: 'btn btn-gold', onclick: examTapGuarded(() => gradeExamWrite(false)) }, '寫錯了，算錯')));
}

function examQuestionView() {
  if (!examRun || ExamCore.isFinished(examRun)) return examPaper.route === 'sim' ? simView() : examView();
  const q = examQuestionNow();
  const picked = ExamCore.pickOf(examRun, q.no);
  let card;
  if (q.type === 'write') card = picked === null && !examReveal ? examWriteCard(q) : examWriteCheck(q, picked);
  else card = picked === null ? examQuizCard(q) : examFeedbackCard(q, picked);
  return el('main', { class: 'screen session mode-exam' }, examBar(), card);
}

// ---------- looking a question up later ----------
function openExamDetail(q, picked) {
  openModal(el('div', { class: 'exam-detail' }, el('h2', {}, examLabel(q)), examReview(q, picked)));
}

function examNumberChips(paper, nos, picks) {
  return el('div', { class: 'chips' }, nos.map((no) => paper.byNo.get(no)).filter(Boolean).map((q) =>
    el('button', { class: 'word-chip', onclick: () => openExamDetail(q, picks && picks[q.no] !== undefined ? picks[q.no] : null) }, examTag(q))));
}

// ---------- screens ----------
function examRecordText(paper, r) {
  if (!paper.parts.length) {
    return r.kind === 'full'
      ? `${fmtDateW(r.date)}　全卷 ${examPoints(r)} 分（答對 ${r.ok} / ${r.total} 題）`
      : `${fmtDateW(r.date)}　訂正 ${r.total} 題，答對 ${r.ok} 題`;
  }
  const name = partName(paper, r.part);
  return r.kind === 'full'
    ? `${fmtDateW(r.date)}　${name} ${examPoints(r)} 分（答對 ${r.ok} / ${r.total} 題）`
    : `${fmtDateW(r.date)}　${name} 訂正 ${r.total} 題，答對 ${r.ok} 題`;
}

function examMenuText() {
  const p = PAPERS.exam;
  const run = loadExamRun(p, null);
  if (run) return `做到第 ${run.pos + 1} / ${run.order.length} 題，點這裡接著做`;
  const last = store.exam.filter((r) => r.kind === 'full').pop();
  return last ? `上次 ${examPoints(last)} 分・段考題型 ${p.items.length} 題選擇題` : `照段考題型出的 ${p.items.length} 題選擇題`;
}

function simMenuText() {
  const p = PAPERS.sim;
  const going = p.parts.map((part) => ({ part, run: loadExamRun(p, part.id) })).find((x) => x.run);
  if (going) return `${going.part.short}做到第 ${going.run.pos + 1} / ${going.run.order.length} 題，點這裡接著做`;
  const done = p.parts.filter((part) => examRecords(p, part.id).some((r) => r.kind === 'full')).length;
  return done ? `做完 ${done} / ${p.parts.length} 段・共 ${p.items.length} 題` : `${p.subtitle || `${p.parts.length} 段`}，共 ${p.items.length} 題`;
}

function examStartRow(paper, part, run, redo) {
  const partId = part ? part.id : undefined;
  if (run) {
    return el('div', { class: 'confirm exam-resume' },
      el('p', {}, `${run.kind === 'redo' ? '訂正' : (part ? '這一段' : paper.name)}做到第 ${run.pos + 1} / ${run.order.length} 題。`),
      el('button', { class: 'btn btn-primary btn-big', onclick: () => resumeExam(paper, partId) }, '繼續作答'),
      el('button', { class: 'btn btn-ghost btn-sm', onclick: () => startExam(paper, run.kind, run.order, partId) }, '從第一題重新開始'));
  }
  const size = part ? part.nos.length : paper.items.length;
  return el('div', { class: 'row exam-start' },
    el('button', { class: 'btn btn-primary btn-big', onclick: () => startExam(paper, 'full', null, partId) }, `開始作答（${size} 題）`),
    redo.length ? el('button', { class: 'btn btn-gold', onclick: () => startExam(paper, 'redo', redo, partId) }, `訂正上次答錯的 ${redo.length} 題`) : null);
}

function examView() {
  const p = PAPERS.exam;
  if (!p.items.length) return homeView();
  const run = loadExamRun(p, null);
  const redo = ExamCore.wrongToRedo(store.exam, p.items);
  const history = store.exam.slice(-EXAM_HISTORY_SHOWN).reverse();
  return el('main', { class: 'screen' }, backBar('模擬考卷'), el('section', { class: 'card exam-intro' },
    sprite('blk-exam', 'boss-big'),
    el('h2', {}, 'U4–U7 模擬考卷'),
    el('p', {}, `照學校段考題型出的 ${p.items.length} 題選擇題，滿分 100 分。先點答案，再按「確定」；答錯會馬上看到正確答案和說明。中途離開也沒關係，下次會從同一題接著做。`),
    examStartRow(p, null, run, redo),
    redo.length && !run ? el('div', { class: 'result-block' }, el('h3', {}, '上次答錯的題目（點一下看說明）'), examNumberChips(p, redo, null)) : null,
    history.length ? el('div', { class: 'boss-history' }, el('h3', {}, '作答紀錄'),
      el('ul', {}, history.map((r) => el('li', {}, examRecordText(p, r))))) : null));
}

function simErrata(e) {
  return el('details', { class: 'sim-errata' }, el('summary', {}, e.title),
    e.intro ? el('p', {}, e.intro) : null, el('ul', {}, e.items.map((t) => el('li', {}, t))));
}

function simPartCard(p, part) {
  const run = loadExamRun(p, part.id);
  const redo = ExamCore.wrongToRedo(store.sim, p.items, part.id);
  const last = examRecords(p, part.id).filter((r) => r.kind === 'full').pop();
  const missed = part.nos.filter((no) => p.byNo.get(no).missed).length;
  const meta = [`${part.nos.length} 題`, missed ? `${missed} 題是原本錯過的地方` : '', last ? `上次 ${examPoints(last)} 分（答對 ${last.ok} / ${last.total} 題）` : ''];
  return el('section', { class: 'card sim-part', 'data-part': part.id },
    el('h2', {}, part.title),
    el('p', { class: 'sim-meta' }, meta.filter(Boolean).join('・')),
    part.note ? el('p', { class: 'muted' }, part.note) : null,
    examStartRow(p, part, run, redo),
    redo.length && !run ? el('div', { class: 'result-block' }, el('h3', {}, '上次答錯的題目（點一下看說明）'), examNumberChips(p, redo, null)) : null,
    part.errata ? simErrata(part.errata) : null);
}

function simView() {
  const p = PAPERS.sim;
  if (!p.items.length) return homeView();
  return el('main', { class: 'screen' }, backBar(p.name),
    el('section', { class: 'card exam-intro sim-intro' },
      sprite('blk-sim', 'boss-big'),
      el('h2', {}, p.title || p.name),
      p.intro ? el('p', {}, p.intro) : null,
      el('p', {}, '每一段分開做。先點答案再按「確定」，答錯會馬上看到正確答案和說明，閱讀和選詞填空還有中文翻譯。中翻英打好字按「對答案」，和參考答案不一樣時，自己對照後選對或錯。中途離開也沒關係，下次會從同一題接著做。')),
    p.parts.map((part) => simPartCard(p, part)));
}

function examVerdict(kind, points) {
  if (kind === 'redo') return points === 100 ? '全部訂正好了！' : '再訂正一次就好了';
  if (points >= 90) return '太強了！';
  if (points >= EXAM_WIN_POINTS) return '很棒！';
  if (points >= 60) return '及格了，把答錯的訂正好';
  return '別灰心，把答錯的一題一題訂正';
}

function examResultView() {
  if (!examResult) return examView();
  const { paper, part, kind, sum, picks } = examResult;
  const inParts = paper.parts.length > 0;
  const back = () => { examResult = null; go(inParts ? paper.route : 'home'); };
  return el('main', { class: 'screen' }, el('section', { class: 'card result exam-result' },
    sprite(inParts ? 'blk-sim' : 'blk-exam', 'result-boss'),
    inParts ? el('p', { class: 'muted' }, partOf(paper, part).title) : null,
    el('h1', {}, examVerdict(kind, sum.points)),
    kind === 'full'
      ? el('p', { class: 'result-score' }, el('b', {}, `${sum.points} 分`), `（答對 ${sum.ok} / ${sum.total} 題）`)
      : el('p', { class: 'result-score' }, el('b', {}, `${sum.ok} / ${sum.total}`), ' 題訂正成功'),
    sum.wrong.length
      ? el('div', { class: 'result-block' }, el('h2', {}, '答錯的題目（點一下看說明）'), examNumberChips(paper, sum.wrong, picks))
      : el('p', { class: 'all-right' }, '全部答對，太強了！'),
    el('div', { class: 'result-actions' },
      sum.wrong.length ? el('button', { class: 'btn btn-gold', onclick: () => startExam(paper, 'redo', sum.wrong, part || undefined) }, `訂正答錯的 ${sum.wrong.length} 題`) : null,
      el('button', { class: 'btn btn-primary', onclick: back }, inParts ? `回${paper.name}` : '回礦坑'))));
}

/** Parent page: every round, newest first. */
function examParentCard() {
  if (!store.exam.length) return null;
  return el('section', { class: 'card' }, el('h2', {}, '模擬考卷成績'),
    el('ul', { class: 'boss-history' }, store.exam.slice(-10).reverse().map((r) => el('li', {},
      examRecordText(PAPERS.exam, r), r.wrong.length ? el('span', { class: 'muted' }, `　答錯：第 ${r.wrong.join('、')} 題`) : null))));
}

function simParentCard() {
  const p = PAPERS.sim;
  if (!store.sim.length || !p.items.length) return null;
  const tags = (nos) => nos.map((no) => (p.byNo.has(no) ? examTag(p.byNo.get(no)) : `第 ${no} 題`)).join('、');
  return el('section', { class: 'card' }, el('h2', {}, '類似題練習成績'),
    el('ul', { class: 'boss-history' }, store.sim.slice(-12).reverse().map((r) => el('li', {},
      examRecordText(p, r), r.wrong.length ? el('span', { class: 'muted' }, `　答錯：${tags(r.wrong)}`) : null))));
}

// ---- main.js ----
/* Boot, routing, rendering, and keeping tabs and days in sync. */
const UNIT_IDS = ['04', '05', '06', '07'];
const KEY_GUARD_MS = 450;
const VIEWS = {
  home: homeView, session: sessionView, result: resultView, errors: errorsView, practice: practiceView,
  boss: bossView, bank: bankView, parent: parentView, paper: paperView,
  exam: examView, sim: simView, 'exam-q': examQuestionView, 'exam-done': examResultView,
};
// Mid-question screens: no update banner, and no re-render from other tabs.
const PRACTICE_ROUTES = ['session', 'exam-q'];

// Filled in by startApp() once the vocabulary is available (it may first need unlocking).
let ITEMS = [];
let ITEM_BY_ID = new Map();
let VALID_IDS = new Set();
let TRACKS = [];
let AUDIO_URL = '音檔/{name}.mp3';
let store = null;
let route = 'home';
let lastRenderAt = 0;
let renderedDay = Core.todayISO();

/** change(store) returns the next store. Re-reads first when another tab saved in the meantime. */
function commit(change) {
  const saved = Storage.savedRev();
  if (saved !== null && saved !== store.rev) store = Storage.load(VALID_IDS);
  store = Object.assign({}, change(store), { rev: store.rev + 1 });
  Storage.save(store);
}

function render() {
  const root = document.getElementById('app');
  setChildren(root, inPractice() ? null : updateBanner(), (VIEWS[route] || homeView)());
  lastRenderAt = performance.now();
  renderedDay = Core.todayISO();
  const target = root.querySelector('[data-autofocus]');
  if (target && route !== 'home') target.focus();
}

function inPractice() {
  return PRACTICE_ROUTES.includes(route);
}

function go(name) {
  route = name;
  render();
  window.scrollTo(0, 0);
}

/** Ignores a keyboard "click" that lands right after a screen change (a double Enter). */
function keyGuard(fn) {
  return (e) => {
    if (e && e.detail === 0 && performance.now() - lastRenderAt < KEY_GUARD_MS) return;
    fn(e);
  };
}

/** Another tab saved, or a new day started while this tab stayed open: show the latest. */
function syncFromStorage() {
  const saved = Storage.savedRev();
  const changed = saved !== null && saved !== store.rev;
  if (changed) store = Storage.load(VALID_IDS);
  const newDay = renderedDay !== Core.todayISO();
  if ((changed || newDay) && !inPractice()) render();
}

function applyAudioSettings() {
  Sfx.setEnabled(store.settings.sound);
  Sfx.setVolume(store.settings.volume);
  Speech.setVolume(store.settings.volume);
  Pron.setVolume(store.settings.volume);
}

/** Asks the browser not to evict saved progress when space runs low (silently granted or not). */
function requestPersistentStorage() {
  try {
    if (window.location.protocol === 'https:' && navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => { /* keep best-effort storage */ });
    }
  } catch (e) { /* unsupported */ }
}

function startApp(data) {
  ITEMS = Core.buildItems(data.units);
  ITEM_BY_ID = new Map(ITEMS.map((it) => [it.id, it]));
  VALID_IDS = new Set(ITEMS.map((it) => it.id));
  TRACKS = data.tracks || [];
  AUDIO_URL = data.audioUrl || AUDIO_URL;
  setPapers(data);
  store = Storage.load(VALID_IDS);
  initWhatsNew(Object.keys(store.states).length > 0);
  Speech.init(store.settings.voice);
  Pron.setup(data.voice);
  Speech.useClips(Pron);
  // Voices load late on some browsers; refresh screens that show speech controls.
  Speech.onChange(() => { if (['parent', 'practice', 'bank'].includes(route)) render(); });
  applyAudioSettings();
  preferPlaybackAudio();
  requestPersistentStorage();
  window.addEventListener('storage', (e) => { if (e.key === STORAGE_KEY) syncFromStorage(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    syncFromStorage();
    checkForUpdate();
  });
  window.addEventListener('focus', syncFromStorage);
  if (/[?&]e2e\b/.test(window.location.search)) {
    window.__vocabMine = {
      answers: () => (session && session.q ? Core.answerTexts(session.q) : null),
      step: () => (session ? session.queue[session.pos] : null),
      queue: () => (session ? session.queue.map((x) => x.id) : null),
      store: () => store,
      sync: syncFromStorage,
      checkUpdate: () => checkForUpdate(true),
      speak: (text) => Speech.speak(text, store.settings.rate),
      exam: () => {
        if (!examRun || ExamCore.isFinished(examRun)) return null;
        const q = examQuestionNow();
        return { paper: examPaper.id, no: q.no, type: q.type, answer: q.answer, options: q.options.length, answers: q.answers };
      },
    };
  }
  render();
  checkForUpdate();
}

function boot() {
  installSprites();
  AudioOut.startOnFirstTouch();
  if (window.VOCAB_LOCKED) unlock(window.VOCAB_LOCKED).then(startApp);
  else startApp({ units: window.VOCAB_DATA, tracks: window.VOCAB_TRACKS, audioUrl: window.VOCAB_AUDIO_URL, voice: window.VOCAB_VOICE, exam: window.VOCAB_EXAM, sim: window.VOCAB_SIM });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
